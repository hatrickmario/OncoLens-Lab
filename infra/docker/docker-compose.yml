# Stack local de OncoLens (US-034, readme §2.4). Se levanta con:
#   docker compose -f infra/docker/docker-compose.yml up -d
# El LLM corre FUERA de Docker (en macOS Docker no expone Metal): rag-orchestrator lo alcanza por LLM_BASE_URL.
# Solo web publica un puerto; los secretos son archivos fuera del repositorio (ONCOLENS_SECRETS_DIR, RN-14).
# Todo valor a calibrar (puertos, intervalos, reintentos, tamaños) viene de variables (RN-22): ver .env.example.
name: ${COMPOSE_PROJECT_NAME:-oncolens}

x-healthcheck-defaults: &healthcheck-defaults
  interval: ${HEALTHCHECK_INTERVAL:-10s}
  timeout: ${HEALTHCHECK_TIMEOUT:-5s}
  retries: ${HEALTHCHECK_RETRIES:-12}
  start_period: ${HEALTHCHECK_START_PERIOD:-20s}

# Vida máxima del JWT de servicio (US-054 AC-5): un solo valor para quien firma y quien valida (RN-22).
x-service-jwt-ttl: &service-jwt-ttl ${SERVICE_JWT_TTL_SECONDS:-60}

services:
  postgres:
    image: postgres:17.11-alpine
    # TLS obligatorio (SEG-08): entrypoint-tls.sh instala la clave con los permisos que exige PostgreSQL y delega
    # en el entrypoint de la imagen. El superusuario solo entra por `local peer` (docker compose exec -u postgres).
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint-tls.sh"]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/pg_server.crt
      - -c
      - ssl_key_file=/run/pg-secrets/pg_server.key
      - -c
      - hba_file=/run/secrets/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oncolens}
      PG_RAG_CORPUS_CONNECTION_LIMIT: ${PG_RAG_CORPUS_CONNECTION_LIMIT:-10}
      PG_RAG_CORPUS_MIGRATOR_CONNECTION_LIMIT: ${PG_RAG_CORPUS_MIGRATOR_CONNECTION_LIMIT:-2}
      # Timeouts de sesión de rag_corpus en ms (US-040, RN-22): valores a calibrar; claves en .env.example.
      PG_RAG_CORPUS_STATEMENT_TIMEOUT_MS: ${PG_RAG_CORPUS_STATEMENT_TIMEOUT_MS:-30000}
      PG_RAG_CORPUS_IDLE_TX_TIMEOUT_MS: ${PG_RAG_CORPUS_IDLE_TX_TIMEOUT_MS:-60000}
    secrets:
      - pg_superuser_password
      - pg_clinical_api_password
      - pg_research_writer_password
      - pg_rag_corpus_password
      - pg_rag_corpus_migrator_password
      - pg_server.crt
      - pg_server.key
      - pg_hba.conf
    # Copia de las claves y contraseñas con el dueño que exige PostgreSQL; solo en memoria.
    tmpfs:
      - /run/pg-secrets:size=1m,mode=0700
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/entrypoint-tls.sh
        target: /usr/local/bin/entrypoint-tls.sh
        read_only: true
      - type: bind
        source: ./postgres/initdb
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: bind
        source: ./postgres/sql
        target: /opt/oncolens/sql
        read_only: true
    networks: [clinical-net, corpus-db-net]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]

  clinical-minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${CLINICAL_MINIO_ROOT_USER:-clinical-minio-admin}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/clinical_minio_root_password
    secrets:
      - clinical_minio_root_password
    volumes:
      - clinical-minio-data:/data
    networks: [clinical-net]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "mc", "ready", "local"]

  milvus-etcd:
    image: gcr.io/etcd-development/etcd:v3.5.34
    command:
      - etcd
      - --advertise-client-urls=http://milvus-etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=${ETCD_QUOTA_BACKEND_BYTES:-4294967296}
    volumes:
      - milvus-etcd-data:/etcd
    networks: [ai-net]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "etcdctl", "endpoint", "health"]

  milvus-minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ROOT_USER:-milvus-minio-admin}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/milvus_minio_root_password
    secrets:
      - milvus_minio_root_password
    volumes:
      - milvus-minio-data:/data
    networks: [ai-net]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "mc", "ready", "local"]

  milvus-standalone:
    image: milvusdb/milvus:v2.6.25
    # Milvus lee la clave de MinIO del entorno: se carga desde el secreto al arrancar, sin escribirla en el Compose.
    command:
      - sh
      - -c
      - 'MINIO_SECRET_ACCESS_KEY="$$(cat /run/secrets/milvus_minio_root_password)" exec milvus run standalone'
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ROOT_USER:-milvus-minio-admin}
    secrets:
      - milvus_minio_root_password
    volumes:
      - milvus-data:/var/lib/milvus
    networks: [ai-net]
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      start_period: ${MILVUS_HEALTHCHECK_START_PERIOD:-90s}
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]

  clinical-api:
    build:
      context: ../..
      dockerfile: apps/clinical-api/Dockerfile
    # Los secretos conservan el 0600 de su dueño: la app corre con ese uid:gid para poder leerlos (scripts/setup-secrets.sh).
    user: "${ONCOLENS_UID:-1000}:${ONCOLENS_GID:-1000}"
    environment:
      PORT: "3000"
      APP_ENV: ${APP_ENV:?APP_ENV obligatorio}
      CLINICAL_CATALOG_PATH: ${CLINICAL_CATALOG_PATH:-/catalogs}
      # Rol de aplicación clinical_api. Sin contraseña en la URL (RN-14): va por archivo de secreto. TLS con
      # verificación del certificado del servidor (SAN postgres) contra la CA propia (SEG-08).
      CLINICAL_DATABASE_URL: postgresql://clinical_api@postgres:5432/${POSTGRES_DB:-oncolens}
      CLINICAL_DATABASE_CA_FILE: /run/secrets/pg_ca.crt
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-}
      SESSION_TOUCH_SECONDS: ${SESSION_TOUCH_SECONDS:-}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      ARGON2_MEMORY_COST_KIB: ${ARGON2_MEMORY_COST_KIB:-}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-}
      SERVICE_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_service_private.pem
      SERVICE_JWT_TTL_SECONDS: *service-jwt-ttl
      # Gateway de análisis (L1D-103): hostname interno de rag-orchestrator y valores a calibrar (RN-22); vacío = por defecto.
      RAG_ORCHESTRATOR_URL: ${RAG_ORCHESTRATOR_URL:-http://rag-orchestrator:8000}
      ANALYSIS_MAX_OPTIONS: ${ANALYSIS_MAX_OPTIONS:-}
      EVIDENCE_DEFAULT_YEARS: ${EVIDENCE_DEFAULT_YEARS:-}
      # Cierre del análisis (L1D-104): plazo hacia rag-orchestrator y textos configurables (RN-22). Los dos textos son
      # obligatorios: vacíos, clinical-api no arranca (fallo cerrado); sus claves están en .env.example.
      RAG_TIMEOUT_MS: ${RAG_TIMEOUT_MS:-}
      AI_DISCLAIMER_TEXT: ${AI_DISCLAIMER_TEXT:-}
      ANALYSIS_BASIS_S1_ASSUMPTION_TEXT: ${ANALYSIS_BASIS_S1_ASSUMPTION_TEXT:-}
      # Alcance del análisis (L1D-173, RN-20/RN-22): tipos habilitados (validados contra manifest.json al arrancar) y lo que
      # la Base de un tipo_no_habilitado dice del corpus. Valores de demo; vacíos o inválidos, clinical-api no arranca.
      ENABLED_CANCER_TYPES: ${ENABLED_CANCER_TYPES:-mama,prostata}
      CORPUS_EXCLUDED_SOURCES: ${CORPUS_EXCLUDED_SOURCES:-NCCN,ESMO}
      CORPUS_CUTOFF_DATE: ${CORPUS_CUTOFF_DATE:-2026-09-30}
      # Desidentificación (L1D-203, RN-11): formatos de PII de L1D-166 (fuente única, montados de solo lectura) y reglas
      # de reemplazo de la imagen; vacío = por defecto. Archivos ausentes o inválidos: clinical-api no arranca.
      PII_FORMATS_PATH: ${PII_FORMATS_PATH:-/config/pii-formats.json}
      PII_MASKS_PATH: ${PII_MASKS_PATH:-/app/apps/clinical-api/config/pii-masks.json}
      PII_NAME_TOKEN_MIN_LENGTH: ${PII_NAME_TOKEN_MIN_LENGTH:-}
      # Versión con la que se cifra la identidad (US-046); vacío = 1. Debe coincidir con la de clinical-seed.
      IDENTITY_KEY_VERSION: ${IDENTITY_KEY_VERSION:-}
      IDENTITY_AES_KEY_FILE: /run/secrets/identity_aes_key
      BLIND_INDEX_HMAC_KEY_FILE: /run/secrets/blind_index_hmac_key
      PG_CLINICAL_API_PASSWORD_FILE: /run/secrets/pg_clinical_api_password
      PG_RESEARCH_WRITER_PASSWORD_FILE: /run/secrets/pg_research_writer_password
      CLINICAL_MINIO_PASSWORD_FILE: /run/secrets/clinical_minio_root_password
      # Carga de documentos (L1D-56, RN-22): vacío = por defecto (20 MiB, http://clinical-minio:9000, bucket clinical-documents).
      CLINICAL_MINIO_ENDPOINT: ${CLINICAL_MINIO_ENDPOINT:-}
      CLINICAL_MINIO_ROOT_USER: ${CLINICAL_MINIO_ROOT_USER:-clinical-minio-admin}
      CLINICAL_DOCUMENTS_BUCKET: ${CLINICAL_DOCUMENTS_BUCKET:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
    secrets:
      - jwt_service_private.pem
      - identity_aes_key
      - blind_index_hmac_key
      - pg_clinical_api_password
      - pg_ca.crt
      - pg_research_writer_password
      - clinical_minio_root_password
    volumes:
      - type: bind
        source: ../../packages/clinical-catalogs
        target: ${CLINICAL_CATALOG_PATH:-/catalogs}
        read_only: true
      - type: bind
        source: ../../config/pii-formats.json
        target: ${PII_FORMATS_PATH:-/config/pii-formats.json}
        read_only: true
    networks: [clinical-net, ai-net]
    # No depende de rag-orchestrator: con el LLM caído la ficha sigue sirviendo (US-034 AC-4).
    depends_on:
      postgres:
        condition: service_healthy
      clinical-minio:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]

  # One-shot (US-039, L1D-169, [S1 resp. 14b]): siembra los datos SINTÉTICOS de demo (pacientes a-e y usuarios doc1 y
  # admin) y termina. Es el único servicio con las contraseñas del seed; clinical-api no las monta. Se conecta como
  # clinical_api con la URL sin credenciales y TLS verificado (SEG-08). Se niega en APP_ENV=piloto y con
  # REAL_*_ENABLED=true (RN-13). Ejecuta el seed COMPILADO: la imagen runtime no trae el CLI de Prisma ni tsx.
  # Requiere el esquema clínico migrado: nada lo migra todavía en Compose (pendiente del one-shot clinical-migrate).
  clinical-seed:
    # Perfil `seed`: no arranca con `up` (el piloto no debe montar la contraseña del dueño de la base). Se ejecuta con
    # `docker compose --profile seed run --rm clinical-seed`.
    profiles: ["seed"]
    build:
      context: ../..
      dockerfile: apps/clinical-api/Dockerfile
    command: ["node", "dist/apps/clinical-api/prisma/seed.js"]
    restart: "no"
    user: "${ONCOLENS_UID:-1000}:${ONCOLENS_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV obligatorio}
      SEED_ALLOWED_ENVS: ${SEED_ALLOWED_ENVS:-}
      SEED_REFERENCE_DATE: ${SEED_REFERENCE_DATE:-}
      REAL_ANONYMIZED_ENABLED: ${REAL_ANONYMIZED_ENABLED:-false}
      REAL_IDENTIFIED_ENABLED: ${REAL_IDENTIFIED_ENABLED:-false}
      CLINICAL_CATALOG_PATH: ${CLINICAL_CATALOG_PATH:-/catalogs}
      ARGON2_MEMORY_COST_KIB: ${ARGON2_MEMORY_COST_KIB:-}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-}
      CLINICAL_DATABASE_URL: postgresql://clinical_api@postgres:5432/${POSTGRES_DB:-oncolens}
      CLINICAL_DATABASE_CA_FILE: /run/secrets/pg_ca.crt
      PG_CLINICAL_API_PASSWORD_FILE: /run/secrets/pg_clinical_api_password
      SEED_DOCTOR_PASSWORD_FILE: /run/secrets/seed_doctor_password
      SEED_ADMIN_PASSWORD_FILE: /run/secrets/seed_admin_password
      # Identidad cifrada de los pacientes semilla (US-046 AC-6): el seed usa IdentityService, no una copia del cifrador.
      IDENTITY_KEY_VERSION: ${IDENTITY_KEY_VERSION:-}
      IDENTITY_AES_KEY_FILE: /run/secrets/identity_aes_key
      BLIND_INDEX_HMAC_KEY_FILE: /run/secrets/blind_index_hmac_key
    secrets:
      - pg_clinical_api_password
      - pg_ca.crt
      - seed_doctor_password
      - seed_admin_password
      - identity_aes_key
      - blind_index_hmac_key
    volumes:
      - type: bind
        source: ../../packages/clinical-catalogs
        target: ${CLINICAL_CATALOG_PATH:-/catalogs}
        read_only: true
    networks: [clinical-net]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot (US-058, L1D-114, [S1 resp. 14b]): aplica Alembic al schema corpus como rag_corpus_migrator y termina.
  # Es el único servicio con la contraseña del migrator; rag-orchestrator no arranca si este no sale con código 0.
  corpus-migrate:
    build:
      context: ../..
      dockerfile: apps/rag-orchestrator/Dockerfile
    command: ["python", "-m", "app.scripts.migrate_corpus_catalog"]
    restart: "no"
    user: "${ONCOLENS_UID:-1000}:${ONCOLENS_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=${RAG_TMPFS_SIZE:-256m}
    environment:
      TMPDIR: /tmp
      # Sin contraseña en la URL (la lee del archivo del secreto) y TLS obligatorio (SEG-08).
      CORPUS_MIGRATOR_DATABASE_URL: postgresql+psycopg://rag_corpus_migrator@postgres:5432/${POSTGRES_DB:-oncolens}?sslmode=require
      PG_RAG_CORPUS_MIGRATOR_PASSWORD_FILE: /run/secrets/pg_rag_corpus_migrator_password
    secrets:
      - pg_rag_corpus_migrator_password
    networks: [corpus-db-net]
    depends_on:
      postgres:
        condition: service_healthy

  rag-orchestrator:
    build:
      context: ../..
      dockerfile: apps/rag-orchestrator/Dockerfile
    user: "${ONCOLENS_UID:-1000}:${ONCOLENS_GID:-1000}"
    # Sistema de archivos de solo lectura: ningún PDF ni texto extraído persiste en el contenedor.
    read_only: true
    tmpfs:
      - /tmp:size=${RAG_TMPFS_SIZE:-256m}
    environment:
      TMPDIR: /tmp
      APP_ENV: ${APP_ENV:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_HEALTH_TIMEOUT_MS: ${LLM_HEALTH_TIMEOUT_MS:-2000}
      # Salida del LLM (RN-22): la ventana LLM_NUM_CTX se reparte entre el prompt y la salida (ARR-08).
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_FRAGMENTS_MAX_CHARS: ${LLM_FRAGMENTS_MAX_CHARS:-12000}
      DETAILS_MAX_PARAGRAPHS: ${DETAILS_MAX_PARAGRAPHS:-2}
      LLM_CLOUD_ENABLED: ${LLM_CLOUD_ENABLED:-false}
      REAL_ANONYMIZED_ENABLED: ${REAL_ANONYMIZED_ENABLED:-false}
      REAL_IDENTIFIED_ENABLED: ${REAL_IDENTIFIED_ENABLED:-false}
      FAKE_RESPONSES_PATH: ${FAKE_RESPONSES_PATH:-/contracts/examples}
      CLINICAL_CATALOG_PATH: ${CLINICAL_CATALOG_PATH:-/catalogs}
      # Defensa en profundidad (L1D-173, RN-20): mismo valor de demo que clinical-api; se valida contra manifest.json.
      ENABLED_CANCER_TYPES: ${ENABLED_CANCER_TYPES:-mama,prostata}
      # Recuperación de /rag/query (RN-22): valores provisionales hasta US-072 (calibración con la suite evaluate).
      # Sin ellos, con LLM_PROVIDER=local el arranque se niega (sin valor por defecto en el código).
      RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-0.30}
      # 30 candidatos de Milvus y corte previo a RERANKER_MAX_PAIRS por puntaje de recuperación (decisión 82, US-231b).
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-30}
      RERANK_TOP_N: ${RERANK_TOP_N:-10}
      # Soporte NLI (L1D-180, RN-01, RN-22): probabilidad mínima de entailment; provisional hasta US-072.
      NLI_ENTAILMENT_THRESHOLD: ${NLI_ENTAILMENT_THRESHOLD:-0.7}
      # Tope de valores de población por criterio y fragmento (ADR-47, RN-22).
      POPULATION_MAX_VALUES_PER_CRITERION: ${POPULATION_MAX_VALUES_PER_CRITERION:-3}
      SERVICE_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_service_public.pem
      SERVICE_JWT_TTL_SECONDS: *service-jwt-ttl
      PG_RAG_CORPUS_PASSWORD_FILE: /run/secrets/pg_rag_corpus_password
      # Modelos locales de recuperación (US-231a, RN-12, RN-22). MODEL_PROVIDER es fake|local: en Compose `local` (verifica
      # los pesos montados y recupera con ellos); la CI, sin pesos reales, usa `fake`. Sin red ni descargas: los pesos
      # llegan por el montaje de solo lectura de MODEL_HOST_DIR y los clientes de modelos no consultan ningún hub.
      MODEL_PROVIDER: ${MODEL_PROVIDER:-local}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-}
      EMBEDDING_MODEL_SHA256: ${EMBEDDING_MODEL_SHA256:-}
      EMBEDDING_TOKENIZER_PATH: ${EMBEDDING_TOKENIZER_PATH:-}
      EMBEDDING_TOKENIZER_SHA256: ${EMBEDDING_TOKENIZER_SHA256:-}
      RERANKER_MODEL_PATH: ${RERANKER_MODEL_PATH:-}
      RERANKER_MODEL_SHA256: ${RERANKER_MODEL_SHA256:-}
      RERANKER_TOKENIZER_PATH: ${RERANKER_TOKENIZER_PATH:-}
      RERANKER_TOKENIZER_SHA256: ${RERANKER_TOKENIZER_SHA256:-}
      # NLI de soporte (US-231b): un SHA-256 por archivo cargado. El ONNX se reexporta en UN solo archivo; si trajera datos
      # externos (`*.onnx.data`) exige además su par NLI_MODEL_DATA_*. Las columnas de cada clase son configuración
      # versionada (nunca el config.json del modelo) y se validan al arrancar.
      NLI_MODEL_PATH: ${NLI_MODEL_PATH:-}
      NLI_MODEL_SHA256: ${NLI_MODEL_SHA256:-}
      NLI_TOKENIZER_PATH: ${NLI_TOKENIZER_PATH:-}
      NLI_TOKENIZER_SHA256: ${NLI_TOKENIZER_SHA256:-}
      NLI_MODEL_DATA_PATH: ${NLI_MODEL_DATA_PATH:-}
      NLI_MODEL_DATA_SHA256: ${NLI_MODEL_DATA_SHA256:-}
      NLI_LABEL_INDEX_ENTAILMENT: ${NLI_LABEL_INDEX_ENTAILMENT:-}
      NLI_LABEL_INDEX_NEUTRAL: ${NLI_LABEL_INDEX_NEUTRAL:-}
      NLI_LABEL_INDEX_CONTRADICTION: ${NLI_LABEL_INDEX_CONTRADICTION:-}
      NLI_MAX_LENGTH: ${NLI_MAX_LENGTH:-512}
      # Corpus real (US-231b): con MODEL_PROVIDER=local y LLM_PROVIDER=local el proceso compone Milvus y el schema `corpus`
      # y los sonda al arrancar; si no responden, termina nombrando la variable (sin corpus falso). Sin contraseña en la
      # URL (la lee del archivo del secreto) y TLS obligatorio (SEG-08).
      CORPUS_DATABASE_URL: postgresql+psycopg://rag_corpus@postgres:5432/${POSTGRES_DB:-oncolens}?sslmode=require
      MILVUS_URI: http://milvus-standalone:19530
      MILVUS_DENSE_METRIC_TYPE: ${MILVUS_DENSE_METRIC_TYPE:-}
      MILVUS_CONNECT_TIMEOUT_SECONDS: ${MILVUS_CONNECT_TIMEOUT_SECONDS:-5}
      CORPUS_CONNECT_TIMEOUT_SECONDS: ${CORPUS_CONNECT_TIMEOUT_SECONDS:-5}
      # Claves de ADR-39 (app/config/modelos.py): vacías = ausentes. Con MODEL_PROVIDER=local se exigen todas.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-}
      SPARSE_VECTOR_SOURCE: ${SPARSE_VECTOR_SOURCE:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-}
      RERANKER_MAX_PAIRS: ${RERANKER_MAX_PAIRS:-}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-}
      NLI_MODEL: ${NLI_MODEL:-}
      NLI_MODEL_REVISION: ${NLI_MODEL_REVISION:-}
      MODEL_QUANTIZATION: ${MODEL_QUANTIZATION:-}
      NLI_QUANTIZATION: ${NLI_QUANTIZATION:-}
      MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-}
      CORPUS_CHUNK_SIZE: ${CORPUS_CHUNK_SIZE:-}
      CORPUS_CHUNK_OVERLAP: ${CORPUS_CHUNK_OVERLAP:-}
      CORPUS_CHUNKING_STRATEGY: ${CORPUS_CHUNKING_STRATEGY:-}
      VECTOR_INDEX_TYPE: ${VECTOR_INDEX_TYPE:-}
      VECTOR_INDEX_PARAMS: ${VECTOR_INDEX_PARAMS:-}
      CHUNK_SELECTION_MARGIN: ${CHUNK_SELECTION_MARGIN:-}
      INDEX_MIN_RECALL_VS_FLAT: ${INDEX_MIN_RECALL_VS_FLAT:-}
      DATA_CACHE_DIR: ${DATA_CACHE_DIR:-}
      STACK_MEMORY_LIMIT_GB: ${STACK_MEMORY_LIMIT_GB:-}
      LLM_MEMORY_BUDGET_GB: ${LLM_MEMORY_BUDGET_GB:-}
      STAGE_P95_BUDGET_MS: ${STAGE_P95_BUDGET_MS:-}
      ACADEMIC_LICENSES: ${ACADEMIC_LICENSES:-}
    secrets:
      - jwt_service_public.pem
      - pg_rag_corpus_password
    volumes:
      - type: bind
        source: ../../contracts/examples
        target: ${FAKE_RESPONSES_PATH:-/contracts/examples}
        read_only: true
      # Pesos de los modelos (US-231a): directorio del HOST fuera del repo (RN-14), sin valor por defecto. La CI, que
      # no tiene pesos, fija MODEL_PROVIDER=fake y un MODEL_HOST_DIR temporal y vacío. Nunca se copian a la imagen.
      - type: bind
        source: ${MODEL_HOST_DIR:?MODEL_HOST_DIR obligatorio - directorio del host, fuera del repo, con los pesos de los modelos}
        target: ${MODEL_CACHE_DIR:-/models}
        read_only: true
      - type: bind
        source: ../../packages/clinical-catalogs
        target: ${CLINICAL_CATALOG_PATH:-/catalogs}
        read_only: true
    # host.docker.internal resuelve igual en macOS y en el runner Linux de la CI.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ai-net, corpus-db-net]
    depends_on:
      postgres:
        condition: service_healthy
      corpus-migrate:
        condition: service_completed_successfully
      milvus-standalone:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      CLINICAL_API_URL: http://clinical-api:3000
      # Único origen aceptado en POST que mutan (SEG-01); por defecto el mismo que publica el puerto de web.
      WEB_ALLOWED_ORIGIN: ${WEB_ALLOWED_ORIGIN:-http://127.0.0.1:3000}
      # Mayor que el deadline de clinical-api hacia rag-orchestrator (RN-22).
      WEB_UPSTREAM_TIMEOUT_MS: ${WEB_UPSTREAM_TIMEOUT_MS:-40000}
      # Tope del cuerpo de las peticiones al BFF; más allá, 413 (RN-22).
      WEB_MAX_BODY_BYTES: ${WEB_MAX_BODY_BYTES:-32768}
      # Ruta de inicio tras el login (solo servidor). Sin valor por defecto: el web se niega a servir /login sin ella.
      WEB_HOME_PATH: ${WEB_HOME_PATH:-}
    # Único puerto publicado del stack (SEG-09); en el S1 solo en la máquina local.
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    networks: [clinical-net]
    depends_on:
      clinical-api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]

# Subredes fijas desde configuración (RN-22): las mismas que renderiza pg_hba.conf (scripts/setup-secrets.sh).
networks:
  clinical-net:
    ipam:
      config:
        - subnet: ${CLINICAL_NET_SUBNET:-172.28.10.0/24}
  ai-net: {}
  # Solo PostgreSQL <-> rag-orchestrator: sin salida a otras redes.
  corpus-db-net:
    internal: true
    ipam:
      config:
        - subnet: ${CORPUS_DB_NET_SUBNET:-172.28.20.0/24}

volumes:
  postgres-data: {}
  clinical-minio-data: {}
  milvus-etcd-data: {}
  milvus-minio-data: {}
  milvus-data: {}

# Nombres que genera scripts/setup-secrets.sh (US-035). Archivos fuera del repositorio.
secrets:
  jwt_service_private.pem:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/jwt_service_private.pem
  jwt_service_public.pem:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/jwt_service_public.pem
  identity_aes_key:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/identity_aes_key
  blind_index_hmac_key:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/blind_index_hmac_key
  pg_clinical_api_password:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/pg_clinical_api_password
  pg_research_writer_password:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/pg_research_writer_password
  pg_rag_corpus_password:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/pg_rag_corpus_password
  pg_rag_corpus_migrator_password:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/pg_rag_corpus_migrator_password
  pg_superuser_password:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/pg_superuser_password
  pg_ca.crt:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/pg_ca.crt
  seed_doctor_password:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/seed_doctor_password
  seed_admin_password:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/seed_admin_password
  pg_server.crt:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/pg_server.crt
  pg_server.key:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/pg_server.key
  pg_hba.conf:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/pg_hba.conf
  clinical_minio_root_password:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/clinical_minio_root_password
  milvus_minio_root_password:
    file: ${ONCOLENS_SECRETS_DIR:-./secrets}/milvus_minio_root_password
