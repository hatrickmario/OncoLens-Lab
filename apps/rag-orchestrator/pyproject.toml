[tool.ruff]
line-length = 100
target-version = "py313"
# Pydantic generado desde el openapi.yaml: reformatearlo rompería contracts:generate:check.
extend-exclude = ["app/schemas/generated"]

# L1D-285 (US-213 AC-8): reglas por defecto de Ruff + PT (estilo de pytest). Los desactivados de tests (skip, skipif, xfail)
# los prohíbe scripts/quality/check-pytest-hygiene.py. Se ignoran las reglas de estilo con deuda vigente en los tests.
# Cobertura de Pytest (L1D-285 tarea 3.4): los datos y el XML quedan en coverage/, ignorado por git.
[tool.coverage.run]
data_file = "coverage/.coverage"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PT"]

# Deuda de estilo solo en tests/ (298 hallazgos vigentes): PT018 268, PT011 22, PT001 5, PT006 3.
# Ver backlog/sprints/S3-deuda.md, fila 'estilo pytest PT' (la añade la sesión principal; el ID lo asigna al crear el issue)
# y tasks.md 5.1 de l1d-285-higiene-tests-ci. No ampliar este per-file-ignores.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT001", "PT006", "PT011", "PT018"]

# >>> umbrales generados desde quality-thresholds.json (no editar: node scripts/quality/sync-ruff-thresholds.mjs)
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
# <<< umbrales generados
