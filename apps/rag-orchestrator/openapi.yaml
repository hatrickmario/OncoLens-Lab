openapi: 3.1.0
info:
  title: OncoLens — RAG & AI Services API (Backend 2 / rag-orchestrator)
  version: 1.0.0
  description: >-
    API interna, alcanzable solo desde la red ai-net y solo por clinical-api (JWT de servicio
    asimétrico; la cookie de sesión del doctor nunca llega aquí). No persiste PHI y procesa los
    documentos clínicos de forma transitoria, en memoria. Recibe solo contexto desidentificado:
    ninguna propiedad, parámetro ni cabecera de este contrato lleva identidad ni identificadores
    enlazables (RN-10); la única excepción es identityFound en la respuesta de
    /documents/extract, que existe solo para verificar que el documento pertenece al paciente.
    Fuente única del contrato de rag-orchestrator (provider-driven): el spec cambia antes que el
    código y los modelos Pydantic se generan de él. Los ejemplos de contracts/examples/ no son
    normativos: el spec manda. Los nombres de propiedad van en camelCase.

servers:
  - url: http://rag-orchestrator:8000

security:
  - serviceJwt: []

tags:
  - name: rag
  - name: documentos
  - name: caso

paths:
  /rag/query:
    post:
      operationId: ragQuery
      tags: [rag]
      summary: Recuperación híbrida multilingüe + generación + validación
      description: >-
        Invocado solo por clinical-api. Expansión bilingüe, recuperación (dense; sparse desde el
        Sprint 3) con filtros is_current, source_type y cancer_type; reranker; umbral de
        relevancia (sin evidencia, sin invocar al LLM); generación en el idioma de la pregunta;
        validación de citas y chequeo de soporte NLI (los análisis previos de la memoria nunca
        cuentan como soporte). Desde el Sprint 4 genera síntesis y aplicabilidad, ejecuta el
        agente acotado (agentLimits) y ordena las opciones por aplicabilidad. Lo que no tiene
        soporte se devuelve en discardedOptions. Si dataClassification es real, solo usa
        modelos locales (RN-12).
      parameters:
        - $ref: '#/components/parameters/RequestDeadline'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagQueryInternalRequest'
      responses:
        "200":
          description: Resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagQueryInternalResponse'
        "401":
          $ref: '#/components/responses/TokenServicioInvalido'
        "409":
          $ref: '#/components/responses/CatalogVersionMismatch'
        "422":
          description: >-
            Cuerpo inválido (Pydantic), o TIPO_NO_HABILITADO: cancerType fuera de
            ENABLED_CANCER_TYPES, que responde sin invocar al LLM (defensa en profundidad).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorTipoNoHabilitado'
                  - $ref: '#/components/schemas/ErrorValidacion'
        "429":
          $ref: '#/components/responses/ColaInferenciaLlena'
        "503":
          $ref: '#/components/responses/LlmLocalNoDisponible'
        "504":
          $ref: '#/components/responses/DeadlineVencido'

  /rag/follow-up:
    post:
      operationId: ragFollowUp
      tags: [rag]
      summary: Responde una pregunta de seguimiento anclada a un análisis
      description: >-
        Invocado solo por clinical-api (FR-31). Sin estado entre turnos: rag-orchestrator no
        guarda turnos ni memoria, ni en disco, ni en caché, ni en Milvus, ni en logs; clinical-api
        envía en cada llamada el contexto desidentificado del paciente y la memoria del análisis
        (analysisMemory, rotulada y no citable: nunca cuenta como soporte, RN-24). El
        pseudoPatientId y el traceId son nuevos en cada turno. question llega enmascarada
        (RN-11). Recupera solo del corpus, valida citas y soporte NLI sobre la respuesta
        completa, y clasifica fuera_de_contexto cuando la pregunta no se refiere al análisis.
        Con datos reales solo se usan modelos locales, sin fallback a la nube (RN-12).
      parameters:
        - $ref: '#/components/parameters/RequestDeadline'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagFollowUpRequest'
      responses:
        "200":
          description: Respuesta del turno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagFollowUpResponse'
        "401":
          $ref: '#/components/responses/TokenServicioInvalido'
        "409":
          $ref: '#/components/responses/CatalogVersionMismatch'
        "422":
          description: Cuerpo inválido (Pydantic), o TIPO_NO_HABILITADO.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorTipoNoHabilitado'
                  - $ref: '#/components/schemas/ErrorValidacion'
        "429":
          $ref: '#/components/responses/ColaInferenciaLlena'
        "503":
          description: >-
            LLM local no disponible (LOCAL_LLM_UNAVAILABLE). Con datos reales solo se usan
            modelos locales, sin fallback a la nube (RN-12).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLlmLocalNoDisponible'
        "504":
          $ref: '#/components/responses/DeadlineVencido'

  /documents/extract:
    post:
      operationId: extractDocument
      tags: [documentos]
      summary: Extrae datos estructurados de un documento clínico
      description: >-
        Invocado solo por clinical-api. El PDF viaja en el cuerpo porque rag-orchestrator no
        tiene credenciales ni red hacia clinical-minio. Primero la capa de texto; OCR solo en las
        páginas escaneadas; gate de PII según dataClassification; estructuración con el LLM
        local y confianza por campo (anclaje textual, dominio, consistencia). El PDF no se
        persiste ni se registra en logs. clinical-api valida y persiste. Con datos reales solo
        se usan modelos locales (RN-12).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, traceId, documentType, dataClassification, mode]
              properties:
                file:
                  type: string
                  format: binary
                traceId:
                  $ref: '#/components/schemas/TraceId'
                documentType:
                  type: string
                  enum: [historia_clinica, examen]
                dataClassification:
                  $ref: '#/components/schemas/DataClassification'
                mode:
                  type: string
                  enum: [registro, carga]
      responses:
        "200":
          description: Datos extraídos (o piiScan.clean=false sin datos clínicos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentExtractResponse'
        "401":
          $ref: '#/components/responses/TokenServicioInvalido'
        "413":
          description: >-
            Tamaño máximo excedido. Pendiente: el código y el cuerpo de este error los fija la
            historia dueña de la extracción (FEAT-01b); aquí no se inventa ningún código.
          x-pending-owner: FEAT-01b
        "415":
          description: >-
            Tipo de archivo no admitido o documento ilegible. Pendiente: el código y el cuerpo de
            este error los fija la historia dueña de la extracción (FEAT-01b); aquí no se
            inventa ningún código.
          x-pending-owner: FEAT-01b
        "422":
          description: Cuerpo inválido (Pydantic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        "503":
          $ref: '#/components/responses/LlmLocalNoDisponible'

  /case/summary:
    post:
      operationId: caseSummary
      tags: [caso]
      summary: Genera el resumen verificable del caso
      description: >-
        Invocado solo por clinical-api (FR-21). Recibe el ClinicalContext desidentificado, con
        referencias opacas por dato (dataRef), y devuelve afirmaciones que referencian esos datos
        (supportingDataRefs). Cada afirmación pasa el chequeo de soporte contra los datos
        referenciados; las que no, se omiten y cuentan en omittedClaims. Si dataClassification es
        real, solo usa modelos locales (RN-12).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSummaryInternalRequest'
      responses:
        "200":
          description: Resumen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummaryInternalResponse'
        "401":
          $ref: '#/components/responses/TokenServicioInvalido'
        "422":
          description: Cuerpo inválido (Pydantic).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        "429":
          $ref: '#/components/responses/ColaInferenciaLlena'
        "503":
          $ref: '#/components/responses/LlmLocalNoDisponible'

components:
  securitySchemes:
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RequestDeadline:
      name: X-Request-Deadline
      in: header
      required: false
      schema:
        type: string
        format: date-time

  responses:
    TokenServicioInvalido:
      description: JWT de servicio ausente o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorTokenServicioInvalido'
    CatalogVersionMismatch:
      description: catalogVersion distinto del catálogo cargado (ADR-38).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorCatalogVersionMismatch'
    ColaInferenciaLlena:
      description: Cola de inferencia llena.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorColaInferenciaLlena'
    LlmLocalNoDisponible:
      description: >-
        LLM local no disponible. Con datos reales solo se usan modelos locales, sin fallback a la
        nube (RN-12).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorLlmLocalNoDisponible'
    DeadlineVencido:
      description: Deadline vencido; la generación se aborta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDeadlineVencido'

  schemas:
    # ---- Schemas compartidos con clinical-api: un solo origen (contracts/schemas/evidence.yaml)
    EvidenceOption:
      $ref: '../../contracts/schemas/evidence.yaml#/components/schemas/EvidenceOption'
    DiscardedOption:
      $ref: '../../contracts/schemas/evidence.yaml#/components/schemas/DiscardedOption'
    Synthesis:
      $ref: '../../contracts/schemas/evidence.yaml#/components/schemas/Synthesis'
    SupportedClaim:
      $ref: '../../contracts/schemas/evidence.yaml#/components/schemas/SupportedClaim'
    SourceApplicability:
      $ref: '../../contracts/schemas/evidence.yaml#/components/schemas/SourceApplicability'
    ApplicabilityCriterion:
      $ref: '../../contracts/schemas/evidence.yaml#/components/schemas/ApplicabilityCriterion'
    ApplicabilitySummary:
      $ref: '../../contracts/schemas/evidence.yaml#/components/schemas/ApplicabilitySummary'
    CitedSource:
      $ref: '../../contracts/schemas/evidence.yaml#/components/schemas/CitedSource'

    # ---- Tipos auxiliares
    TraceId:
      type: string
      pattern: ^req_[A-Za-z0-9]{8,32}$
      description: Identificador de trazabilidad (X-Trace-Id). Un valor nuevo por llamada, también por turno de seguimiento.
    DataClassification:
      type: string
      enum: [sintetico, real_anonimizado, real_identificado]
      description: Con datos reales solo se usan modelos locales, sin fallback a la nube (RN-12).
    DataRef:
      type: string
      pattern: ^r[0-9]+$
      description: >-
        Referencia opaca a un dato del contexto, asignada por clinical-api por petición (r1, r2…);
        nunca un UUID ni un identificador enlazable.
    TextoEnmascarado:
      type: string
      description: >-
        Texto libre enmascarado (RN-11): clinical-api sustituye la PII detectada antes de
        enviarlo; los términos de catálogo pasan sin cambio.
    TextoEnmascaradoNulo:
      type: [string, "null"]
      description: >-
        Texto libre enmascarado (RN-11), o null si el dato no se registró; los términos de
        catálogo pasan sin cambio.
    Provenance:
      type: object
      description: Procedencia de un dato del contexto. Sin identificadores de documento (RN-10).
      additionalProperties: false
      required: [entryMethod, extractionConfidence, reviewStatus, conflict]
      properties:
        entryMethod:
          type: string
          enum: [ocr, manual, manual_correction, seed]
        extractionConfidence:
          type: string
          enum: [alta, media, baja, n_a]
        reviewStatus:
          type: string
          enum: [auto_aceptado, requiere_revision, verificado, corregido]
        conflict:
          type: boolean
    SourcesSelected:
      type: object
      additionalProperties: false
      required: [guias, ensayos, publicaciones]
      properties:
        guias:
          type: boolean
        ensayos:
          type: boolean
        publicaciones:
          type: boolean
    RagFiltersApplied:
      type: object
      description: Filtros efectivos de la consulta, resueltos por clinical-api.
      additionalProperties: false
      required:
        - historiaCompleta
        - soloBiomarcadoresRelevantes
        - ultimosSeisMeses
        - antecedentesFamiliares
        - publishedFromYear
      properties:
        historiaCompleta:
          type: boolean
        soloBiomarcadoresRelevantes:
          type: boolean
        ultimosSeisMeses:
          type: boolean
        antecedentesFamiliares:
          type: boolean
        publishedFromYear:
          type: [integer, "null"]
          description: >-
            Valor efectivo del filtro de antigüedad: clinical-api ya aplicó el valor de la
            petición o año actual menos EVIDENCE_DEFAULT_YEARS. null significa toda la
            evidencia. Siempre presente.
    RagMeta:
      type: object
      description: >-
        Metadatos de la ejecución, con los que clinical-api registra modelos, versión del prompt
        y del catálogo (RN-06). Mismo bloque en /rag/query, /rag/follow-up y /case/summary; los
        campos del corpus y retrievalParams son null donde la operación no consulta el corpus.
      additionalProperties: false
      required:
        - queryLanguage
        - responseLanguage
        - llmProvider
        - llmModel
        - embeddingModel
        - rerankerModel
        - nliModel
        - promptVersion
        - catalogVersion
        - corpusRelease
        - corpusCutoffDate
        - excludedSources
        - retrievalParams
        - latencyMs
      properties:
        queryLanguage:
          type: string
          enum: [es, en]
        responseLanguage:
          type: string
          enum: [es, en]
        llmProvider:
          type: string
        llmModel:
          type: string
        embeddingModel:
          type: [string, "null"]
        rerankerModel:
          type: [string, "null"]
        nliModel:
          type: string
        promptVersion:
          type: string
        catalogVersion:
          type: string
          minLength: 1
          description: Versión del catálogo clínico cargada por rag-orchestrator (ADR-38).
        corpusRelease:
          type: [string, "null"]
        corpusCutoffDate:
          type: [string, "null"]
          format: date
        excludedSources:
          type: [array, "null"]
          description: Fuentes excluidas del corpus, declaradas como exclusión.
          items:
            type: string
        retrievalParams:
          type: [object, "null"]
          additionalProperties: false
          required: [topK, rerankTopN, relevanceThreshold, retrievalMode]
          properties:
            topK:
              type: integer
              minimum: 1
            rerankTopN:
              type: integer
              minimum: 1
            relevanceThreshold:
              type: number
              minimum: 0
              maximum: 1
            retrievalMode:
              type: string
              enum: [dense, hibrida]
        latencyMs:
          type: integer
          minimum: 0

    # ---- Contexto clínico desidentificado
    PriorAnalysisMemory:
      type: object
      description: >-
        Memoria de un análisis previo del paciente (RN-24): contexto, nunca evidencia. No es
        citable ni cuenta como soporte NLI. Sin identidad, con tiempos relativos.
      additionalProperties: false
      required:
        - source
        - citable
        - monthsAgo
        - question
        - synthesisSummary
        - optionsDescribed
        - linkedDecision
        - outcomesSince
      properties:
        source:
          type: string
          const: analisis_previo_ia
        citable:
          type: boolean
          const: false
        monthsAgo:
          type: integer
          minimum: 0
        question:
          $ref: '#/components/schemas/TextoEnmascarado'
        synthesisSummary:
          $ref: '#/components/schemas/TextoEnmascarado'
        optionsDescribed:
          type: array
          items:
            $ref: '#/components/schemas/TextoEnmascarado'
        linkedDecision:
          type: [string, "null"]
          description: >-
            Dato rotulado, no es soporte ni cita (RN-24). Texto libre enmascarado (RN-11).
        outcomesSince:
          type: array
          description: >-
            Evolución registrada por el oncólogo después del análisis. Dato rotulado, no es
            soporte ni cita (RN-24).
          items:
            type: object
            additionalProperties: false
            required: [eventType, monthsAgo, description]
            properties:
              eventType:
                $ref: '#/components/schemas/TextoEnmascarado'
              monthsAgo:
                type: integer
                minimum: 0
              description:
                $ref: '#/components/schemas/TextoEnmascarado'

    ClinicalContext:
      type: object
      description: >-
        Desidentificado por clinical-api: sin identidad ni identificadores enlazables; fechas
        relativas; texto libre enmascarado (RN-10, RN-11). Cada ítem lleva una referencia opaca
        dataRef (r1…rN) asignada por petición.
      additionalProperties: false
      required:
        - pseudoPatientId
        - population
        - diagnosis
        - biomarkers
        - clinicalNotes
        - currentLine
        - attributes
        - priorTreatments
        - events
        - biomarkerTrends
        - missingCriticalData
        - priorAnalyses
      properties:
        pseudoPatientId:
          type: string
          pattern: ^psd_[A-Za-z0-9]+$
          description: Aleatorio por consulta (y por turno de seguimiento); nunca en el prompt.
        population:
          type: string
          enum: [adulto, pediatrico]
        diagnosis:
          type: [object, "null"]
          additionalProperties: false
          required:
            - dataRef
            - cancerType
            - histology
            - grade
            - stagingSystem
            - stageValue
            - performanceScale
            - performanceValue
            - monthsSinceDiagnosis
            - provenance
          properties:
            dataRef:
              $ref: '#/components/schemas/DataRef'
            cancerType:
              $ref: '#/components/schemas/TextoEnmascarado'
            histology:
              $ref: '#/components/schemas/TextoEnmascaradoNulo'
            grade:
              $ref: '#/components/schemas/TextoEnmascaradoNulo'
            stagingSystem:
              $ref: '#/components/schemas/TextoEnmascarado'
            stageValue:
              $ref: '#/components/schemas/TextoEnmascarado'
            performanceScale:
              $ref: '#/components/schemas/TextoEnmascaradoNulo'
            performanceValue:
              type: [integer, "null"]
            monthsSinceDiagnosis:
              type: integer
              minimum: 0
            provenance:
              $ref: '#/components/schemas/Provenance'
        biomarkers:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - dataRef
              - biomarkerName
              - value
              - resultType
              - clinicalSignificance
              - monthsAgo
              - provenance
            properties:
              dataRef:
                $ref: '#/components/schemas/DataRef'
              biomarkerName:
                $ref: '#/components/schemas/TextoEnmascarado'
              value:
                $ref: '#/components/schemas/TextoEnmascarado'
              resultType:
                type: string
                enum: [cuantitativo, cualitativo]
              clinicalSignificance:
                type: string
                enum: [normal, alterado, relevante, crítico]
              monthsAgo:
                type: integer
                minimum: 0
              provenance:
                $ref: '#/components/schemas/Provenance'
        clinicalNotes:
          type: array
          description: Filtradas según filtersApplied y enmascaradas.
          items:
            type: object
            additionalProperties: false
            required: [dataRef, noteType, content, monthsAgo, provenance]
            properties:
              dataRef:
                $ref: '#/components/schemas/DataRef'
              noteType:
                type: string
                enum: [antecedente, comorbilidad, alergia, antecedente_familiar, nota_libre]
              content:
                $ref: '#/components/schemas/TextoEnmascarado'
              monthsAgo:
                type: integer
                minimum: 0
              provenance:
                $ref: '#/components/schemas/Provenance'
        currentLine:
          type: [integer, "null"]
          description: Línea de tratamiento actual.
        attributes:
          type: array
          description: ClinicalAttribute (estado menopáusico, estado de castración, sitios metastásicos…).
          items:
            type: object
            additionalProperties: false
            required: [dataRef, key, value, monthsAgo, provenance]
            properties:
              dataRef:
                $ref: '#/components/schemas/DataRef'
              key:
                $ref: '#/components/schemas/TextoEnmascarado'
              value:
                $ref: '#/components/schemas/TextoEnmascarado'
              monthsAgo:
                type: [integer, "null"]
                minimum: 0
              provenance:
                $ref: '#/components/schemas/Provenance'
        priorTreatments:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - dataRef
              - lineNumber
              - setting
              - regimenName
              - atcCodes
              - monthsSinceStart
              - monthsSinceEnd
              - endReason
              - provenance
            properties:
              dataRef:
                $ref: '#/components/schemas/DataRef'
              lineNumber:
                type: [integer, "null"]
              setting:
                $ref: '#/components/schemas/TextoEnmascarado'
              regimenName:
                $ref: '#/components/schemas/TextoEnmascarado'
              atcCodes:
                type: array
                items:
                  type: string
                  pattern: ^[A-Z][0-9]{2}[A-Z]{2}[0-9]{2}$
              monthsSinceStart:
                type: [integer, "null"]
                minimum: 0
              monthsSinceEnd:
                type: [integer, "null"]
                minimum: 0
              endReason:
                type: string
                enum: [progresion, toxicidad, completado, otro, desconocido]
              provenance:
                $ref: '#/components/schemas/Provenance'
        events:
          type: array
          description: Eventos relevantes del timeline, con fechas relativas.
          items:
            type: object
            additionalProperties: false
            required: [dataRef, eventType, monthsAgo, description, provenance]
            properties:
              dataRef:
                $ref: '#/components/schemas/DataRef'
              eventType:
                $ref: '#/components/schemas/TextoEnmascarado'
              monthsAgo:
                type: [integer, "null"]
                minimum: 0
              description:
                $ref: '#/components/schemas/TextoEnmascarado'
              provenance:
                $ref: '#/components/schemas/Provenance'
        biomarkerTrends:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [dataRef, biomarkerName, trend, points]
            properties:
              dataRef:
                $ref: '#/components/schemas/DataRef'
              biomarkerName:
                $ref: '#/components/schemas/TextoEnmascarado'
              trend:
                type: string
                enum: [sube, baja, estable]
              points:
                type: integer
                minimum: 1
        missingCriticalData:
          type: array
          description: Faltantes del checklist; se tratan como "desconocido".
          items:
            $ref: '#/components/schemas/TextoEnmascarado'
        priorAnalyses:
          type: array
          description: >-
            Memoria de análisis previos. Contexto, nunca evidencia; no citable ni válida como
            soporte NLI (RN-24).
          items:
            $ref: '#/components/schemas/PriorAnalysisMemory'

    # ---- /rag/query
    RagQueryInternalRequest:
      type: object
      additionalProperties: false
      required:
        - traceId
        - query
        - sourcesSelected
        - dataClassification
        - catalogVersion
        - maxOptions
        - filtersApplied
        - clinicalContext
      properties:
        traceId:
          $ref: '#/components/schemas/TraceId'
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: Pregunta ya enmascarada (RN-11).
        sourcesSelected:
          $ref: '#/components/schemas/SourcesSelected'
        dataClassification:
          $ref: '#/components/schemas/DataClassification'
        catalogVersion:
          type: string
          minLength: 1
        maxOptions:
          type: integer
          minimum: 1
          maximum: 3
          description: 1 en los Sprints 1–3 y 3 desde el Sprint 4.
        filtersApplied:
          $ref: '#/components/schemas/RagFiltersApplied'
        agentLimits:
          type: object
          description: Agente acotado (FR-30); ausente o maxIterations = 0 mientras el agente no esté habilitado.
          additionalProperties: false
          required: [maxIterations, maxSubQueries]
          properties:
            maxIterations:
              type: integer
              minimum: 0
            maxSubQueries:
              type: integer
              minimum: 0
        clinicalContext:
          $ref: '#/components/schemas/ClinicalContext'

    RagQueryInternalResponse:
      type: object
      description: >-
        Usa los schemas compartidos de contracts/schemas/evidence.yaml (Synthesis,
        SourceApplicability, EvidenceOption, DiscardedOption). clinical-api agrega la Base del
        análisis y persiste el AIAnalysisRecord.
      additionalProperties: false
      required:
        - status
        - synthesis
        - applicability
        - evidenceOptions
        - discardedOptions
        - limitations
        - assumptions
        - retrievalStats
        - omittedClaims
        - agentSteps
        - topRelevanceScore
        - meta
      properties:
        status:
          type: string
          enum: [con_evidencia, sin_evidencia]
        synthesis:
          $ref: '#/components/schemas/Synthesis'
        applicability:
          type: array
          items:
            $ref: '#/components/schemas/SourceApplicability'
        evidenceOptions:
          type: array
          maxItems: 3
          description: Ya ordenadas de forma determinista por aplicabilidad (RN-28).
          items:
            $ref: '#/components/schemas/EvidenceOption'
        discardedOptions:
          type: array
          items:
            $ref: '#/components/schemas/DiscardedOption'
        limitations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [text, origin]
            properties:
              text:
                type: string
              origin:
                type: string
                enum: [estructural, llm_verificado]
        assumptions:
          type: array
          description: Solo las propuestas por el LLM y verificadas; las de regla las agrega clinical-api.
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text:
                type: string
        retrievalStats:
          type: object
          additionalProperties: false
          required: [retrieved, aboveThreshold]
          properties:
            retrieved:
              type: integer
              minimum: 0
            aboveThreshold:
              type: integer
              minimum: 0
        omittedClaims:
          type: integer
          minimum: 0
        agentSteps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [subQuery, target, foundEvidence]
            properties:
              subQuery:
                type: string
              target:
                type: string
              foundEvidence:
                type: boolean
        topRelevanceScore:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: >-
            Metadato secundario: puntaje del reranker normalizado a [0,1] de la mejor evidencia
            recuperada. No ordena las opciones ni mide la solidez clínica ni la probabilidad de
            éxito (RN-03). null cuando ningún chunk supera el umbral (RN-02): null no es 0.0.
        meta:
          $ref: '#/components/schemas/RagMeta'
      if:
        properties:
          status:
            const: sin_evidencia
        required: [status]
      then:
        properties:
          topRelevanceScore:
            type: "null"
          evidenceOptions:
            type: array
            maxItems: 0
      else:
        properties:
          topRelevanceScore:
            type: number

    # ---- /rag/follow-up
    RagFollowUpRequest:
      type: object
      additionalProperties: false
      required:
        - traceId
        - dataClassification
        - catalogVersion
        - question
        - clinicalContext
        - analysisMemory
        - filtersApplied
      properties:
        traceId:
          $ref: '#/components/schemas/TraceId'
        dataClassification:
          $ref: '#/components/schemas/DataClassification'
        catalogVersion:
          type: string
          minLength: 1
        question:
          type: string
          minLength: 1
          maxLength: 2000
          description: Pregunta ya enmascarada (RN-11).
        clinicalContext:
          $ref: '#/components/schemas/ClinicalContext'
        analysisMemory:
          type: array
          description: >-
            Memoria rotulada del análisis al que se ancla la pregunta (misma forma que
            ClinicalContext.priorAnalyses): contexto, nunca soporte ni cita (RN-24).
          items:
            $ref: '#/components/schemas/PriorAnalysisMemory'
        filtersApplied:
          $ref: '#/components/schemas/RagFiltersApplied'

    RagFollowUpResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - answer
        - citedSources
        - omittedClaims
        - topRelevanceScore
        - meta
      properties:
        status:
          type: string
          enum: [con_evidencia, sin_evidencia, fuera_de_contexto]
          description: >-
            rag-orchestrator clasifica fuera_de_contexto cuando la pregunta no se refiere al
            análisis ni a su evidencia: no se genera respuesta.
        answer:
          type: array
          items:
            $ref: '#/components/schemas/SupportedClaim'
        citedSources:
          type: array
          description: Fuentes del turno; clinical-api calcula isNewSource al comparar sus chunkId con el análisis persistido.
          items:
            $ref: '#/components/schemas/CitedSource'
        omittedClaims:
          type: integer
          minimum: 0
        topRelevanceScore:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: >-
            Metadato secundario: puntaje del reranker normalizado a [0,1] de la mejor evidencia
            recuperada. No ordena las opciones ni mide la solidez clínica ni la probabilidad de
            éxito (RN-03). null si no hay evidencia o la pregunta está fuera de contexto (RN-02):
            null no es 0.0.
        meta:
          $ref: '#/components/schemas/RagMeta'
      if:
        properties:
          status:
            enum: [sin_evidencia, fuera_de_contexto]
        required: [status]
      then:
        properties:
          topRelevanceScore:
            type: "null"
          answer:
            type: array
            maxItems: 0
          citedSources:
            type: array
            maxItems: 0
      else:
        properties:
          topRelevanceScore:
            type: number
          answer:
            type: array
            minItems: 1

    # ---- /case/summary
    CaseSummaryInternalRequest:
      type: object
      additionalProperties: false
      required: [traceId, dataClassification, clinicalContext]
      properties:
        traceId:
          $ref: '#/components/schemas/TraceId'
        dataClassification:
          $ref: '#/components/schemas/DataClassification'
        clinicalContext:
          $ref: '#/components/schemas/ClinicalContext'

    CaseSummaryInternalResponse:
      type: object
      description: >-
        Resumen del caso. Cada afirmación referencia datos del contexto por su dataRef; las que no
        pasan el soporte se omiten.
      additionalProperties: false
      required: [claims, omittedClaims, meta]
      properties:
        claims:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [text, supportingDataRefs]
            properties:
              text:
                type: string
                minLength: 1
              supportingDataRefs:
                type: array
                minItems: 1
                description: Referencias opacas a datos del contexto.
                items:
                  $ref: '#/components/schemas/DataRef'
        omittedClaims:
          type: integer
          minimum: 0
        meta:
          $ref: '#/components/schemas/RagMeta'

    # ---- /documents/extract
    ExtractedField:
      type: object
      additionalProperties: false
      required: [value, extractionScore, extractionConfidence, sourceSpan]
      properties:
        value:
          type: string
        extractionScore:
          type: number
          minimum: 0
          maximum: 1
        extractionConfidence:
          type: string
          enum: [alta, media, baja]
        sourceSpan:
          type: object
          additionalProperties: false
          required: [page, bbox, textOffset]
          properties:
            page:
              type: integer
              minimum: 1
            bbox:
              type: [array, "null"]
              items:
                type: number
            textOffset:
              type: integer
              minimum: 0

    DocumentExtractResponse:
      type: object
      additionalProperties: false
      required: [piiScan, identityFound, sourceLab, extractedData, catalogVersion]
      properties:
        piiScan:
          type: object
          additionalProperties: false
          required: [clean, findingTypes]
          properties:
            clean:
              type: boolean
            findingTypes:
              type: array
              description: Tipos de hallazgo, nunca valores. Lista cerrada asumida; la refina ADR-40.
              items:
                type: string
                enum:
                  - nombre
                  - documento_identidad
                  - fecha
                  - direccion
                  - telefono
                  - email
                  - historia_clinica
                  - otro
        identityFound:
          type:
            - object
            - "null"
          description: >-
            Existe solo para que clinical-api verifique que el documento pertenece al paciente;
            nunca se registra en logs. Es la única excepción a la regla de no identidad de este
            contrato.
          additionalProperties: false
          required: [idType, nationalId]
          properties:
            idType:
              type: string
            nationalId:
              type: string
        sourceLab:
          type: [string, "null"]
        extractedData:
          type: object
          description: >-
            Solo las secciones que el documento contenía; cada campo es un ExtractedField. La
            forma por tipo de documento queda abierta: la cierran FEAT-01b (historia clínica) y
            FEAT-01c (registro asistido).
          x-open-owner: FEAT-01b, FEAT-01c
          properties:
            diagnosis:
              type: object
            clinicalNotes:
              type: array
              items:
                type: object
            exam:
              type: object
            biomarkers:
              type: array
              items:
                type: object
                properties:
                  biomarkerName:
                    $ref: '#/components/schemas/ExtractedField'
                  originalName:
                    type: string
                  loincCode:
                    type: [string, "null"]
                    description: Propuesto; clinical-api decide la normalización final (ADR-33).
                  mappingStatus:
                    type: string
                    enum: [mapeado, no_mapeado]
                  value:
                    $ref: '#/components/schemas/ExtractedField'
                  unit:
                    $ref: '#/components/schemas/ExtractedField'
                  normalizedUnit:
                    type: [string, "null"]
                  referenceRange:
                    $ref: '#/components/schemas/ExtractedField'
                  resultType:
                    type: string
                  clinicalSignificance:
                    type: string
                  significanceSource:
                    type: string
                    enum: [documento, regla, inferido_ia]
            events:
              type: array
              description: Eventos fechados (diagnóstico, cirugía, respuesta, progresión, toxicidad, recaída…).
              items:
                type: object
                properties:
                  eventType:
                    type: string
                  eventDate:
                    $ref: '#/components/schemas/ExtractedField'
                  datePrecision:
                    type: string
                    enum: [dia, mes, anio, incierta]
                  description:
                    $ref: '#/components/schemas/ExtractedField'
                  icd10Code:
                    type: [string, "null"]
                  cupsCode:
                    type: [string, "null"]
            attributes:
              type: array
              description: Atributos del catálogo (estado menopáusico, histología, grado, sitios metastásicos…).
              items:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    $ref: '#/components/schemas/ExtractedField'
            priorTreatments:
              type: array
              description: Líneas de tratamiento previas.
              items:
                type: object
                properties:
                  regimenName:
                    $ref: '#/components/schemas/ExtractedField'
                  atcCodes:
                    type: array
                    items:
                      type: string
                  setting:
                    type: string
                  lineNumber:
                    type: [integer, "null"]
                  startedAt:
                    $ref: '#/components/schemas/ExtractedField'
                  endedAt:
                    $ref: '#/components/schemas/ExtractedField'
                  endReason:
                    type: string
        catalogVersion:
          type: string

    # ---- Errores: código cerrado por respuesta; sin eco del valor recibido (RN-10)
    ErrorTokenServicioInvalido:
      type: object
      additionalProperties: false
      required: [error, message, traceId]
      properties:
        error: { type: string, const: TOKEN_SERVICIO_INVALIDO }
        message: { type: string }
        traceId: { type: string }
    ErrorCatalogVersionMismatch:
      type: object
      additionalProperties: false
      required: [error, message, traceId]
      properties:
        error: { type: string, const: CATALOG_VERSION_MISMATCH }
        message: { type: string }
        traceId: { type: string }
    ErrorTipoNoHabilitado:
      type: object
      additionalProperties: false
      required: [error, message, traceId]
      properties:
        error: { type: string, const: TIPO_NO_HABILITADO }
        message: { type: string }
        traceId: { type: string }
    ErrorValidacion:
      type: object
      description: >-
        Error de validación sin eco: detail lleva la ubicación, el mensaje y el tipo, nunca el
        valor recibido (sin input ni ctx).
      additionalProperties: false
      required: [error, message, traceId, detail]
      properties:
        error: { type: string, const: CUERPO_INVALIDO }
        message: { type: string }
        traceId: { type: string }
        detail:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                items:
                  type: [string, integer]
              msg: { type: string }
              type: { type: string }
    ErrorColaInferenciaLlena:
      type: object
      additionalProperties: false
      required: [error, message, traceId]
      properties:
        error: { type: string, const: COLA_INFERENCIA_LLENA }
        message: { type: string }
        traceId: { type: string }
    ErrorLlmLocalNoDisponible:
      type: object
      additionalProperties: false
      required: [error, message, traceId]
      properties:
        error: { type: string, const: LOCAL_LLM_UNAVAILABLE }
        message: { type: string }
        traceId: { type: string }
    ErrorDeadlineVencido:
      type: object
      additionalProperties: false
      required: [error, message, traceId]
      properties:
        error: { type: string, const: DEADLINE_VENCIDO }
        message: { type: string }
        traceId: { type: string }
