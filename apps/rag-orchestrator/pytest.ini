[pytest]
pythonpath = .
testpaths = tests
# Los tests con PostgreSQL y Milvus reales (perfil test del Compose, dentro de corpus-db-net) se piden con -m servicios_reales.
addopts = -m "not servicios_reales"
markers =
    ac(historia, numero): test de aceptación de un AC (US-xxx, n)
    servicios_reales: necesita el PostgreSQL de test y el Milvus de test del Compose (dentro de corpus-db-net)
