[pytest]
pythonpath = .
testpaths = tests
# Los tests con los pesos reales (MODEL_CACHE_DIR, US-231a) se piden con -m models; no son un skip: la CI no tiene pesos.
# Los tests con PostgreSQL y Milvus reales (perfil test del Compose, dentro de corpus-db-net) se piden con -m servicios_reales.
addopts = --strict-markers -m "not servicios_reales and not models"
markers =
    ac(historia, numero): test de aceptación de un AC (US-xxx, n)
    servicios_reales: necesita el PostgreSQL de test y el Milvus de test del Compose (dentro de corpus-db-net)
    sin_verificacion_de_proveedor: salida explícita de la verificación automática del proveedor (US-214); se usa con motivo en el test
    models: necesita los pesos reales de BGE-M3 y bge-reranker-v2-m3 en MODEL_CACHE_DIR (VM local y smoke de Compose)
