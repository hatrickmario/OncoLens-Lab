# Configuración de la suite `evaluate` con los MODELOS LOCALES REALES sobre FX-RN23 2 (US-249 AC-4 y AC-5; RN-12, RN-23).
# Es la de la CORRIDA NOCTURNA única del cierre del día 2 del S5 (nunca en horario de trabajo ni en la CI): `proveedor: local`,
# Ollama nativo y los pesos de ADR-39 en el MacBook de referencia. Como `local.yaml`, los pesos llegan por el entorno
# (`~/adr39-modelos/modelos.env` y `adr39-config.sh`); sin ellos la suite termina con código ≠ 0 nombrando la variable.
#   OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 ollama serve   # LLM fuera de Docker
#   python -m app.evaluation.evaluate --config eval/configs/rn23-local.yaml --suite all --salida reports/eval
# Cambiar cualquier valor cambia la huella SHA-256 que forma parte del nombre del resultado.
nombre: rn23-local
fixture: FX-RN23
dataset:
  ruta: data/eval/fx-rn23
semilla_bootstrap: 20261021
bootstrap_repeticiones: 200
rn23_tolerancia_falsos_positivos: 0 # RN-22, US-249 AC-5 (decidido, usuario, 2026-11-03): ningún rechazo legítimo más que la línea base 1.5.0
medicion:
  reloj: real
  rss_limite_mib: 4489 # mismo límite que local.yaml (RSS conjunto de ADR-39 / US-231b AC-7)
adaptadores:
  proveedor: local
  urls:
    llm: http://127.0.0.1:11434/v1 # Ollama nativo; ninguna ruta hacia la nube (lista local cerrada en código)
modelos:
  llm: gemma4:26b-a4b-it-q4_K_M # G, LLM decidido en ADR-39
umbrales:
  relevance_threshold: 0.30
  nli_entailment_threshold: 0.7
  retrieval_top_k: 40
  rerank_top_n: 10
catalogo:
  version: '2026.10.0'
  ruta_terminos: packages/clinical-catalogs
juez:
  proveedor: local
  base_url: http://127.0.0.1:11434/v1
  modelo: gemma4:26b-a4b-it-q4_K_M
  temperatura: 0
  semilla: 20261021
  timeout_s: 300
  acuerdo_minimo: 0.8
  muestra_minima: 30
