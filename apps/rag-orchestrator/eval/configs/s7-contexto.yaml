# Comparación de las variantes de CONTEXTO DEL CHUNK con los MODELOS LOCALES REALES, una colección de Milvus por brazo, sobre la ingesta
# de `l1d-119` (US-279, L1D-337 tarea 2.3 y 3.2; ADR-39, ADR-45 P1, P6, RN-12). Corre a mano en el MacBook de referencia con el stack
# limpio, en la CORRIDA FINAL del S7 con `ai-eval-runner`; la CI usa `s7-contexto-fake.yaml` (regresión de forma). El LLM solo lo usa el
# brazo `llm` al reindexar (RN-12: local, sin nube); durante la medición el LLM es el de la generación de siempre.
#   # 1. una colección por variante, UNA A LA VEZ y sin swap, desde la colección de la ingesta de l1d-119 (que no se toca):
#   MILVUS_COLLECTION_NAME=corpus_chunks__ctx_determinista_v1 CORPUS_CHUNK_CONTEXT=determinista \
#     python -m app.scripts.init_corpus_store && python -m app.scripts.ingest reindex-context --origen corpus_chunks > determinista.json
#   MILVUS_COLLECTION_NAME=corpus_chunks__ctx_llm_v1 CORPUS_CHUNK_CONTEXT=llm \
#     python -m app.scripts.init_corpus_store && python -m app.scripts.ingest reindex-context --origen corpus_chunks > llm.json
#   # 2. la comparación (`resumenes.json` = {"A0-determinista": <determinista.json>, "A0-llm": <llm.json>}; `memoria.json` = {"A0": <GB>, ...}):
#   OLLAMA_CONTEXT_LENGTH=8192 ollama serve
#   RETRIEVAL_REGRESSION_TOLERANCE=<valor de la preinscripción P1> STACK_MEMORY_LIMIT_GB=<ADR-39> \
#     python -m app.evaluation.evaluate --config eval/configs/s7-contexto.yaml --suite retrieval \
#       --resumenes-de-contexto <resumenes.json> --memoria-del-stack <memoria.json> --salida reports/eval
# Los pesos (rutas y SHA-256) y las claves de ADR-39 llegan por el entorno (`~/adr39-modelos/modelos.env`); sin ellos la suite termina con
# código ≠ 0 nombrando la variable y no escribe cifras. Cambiar cualquier valor cambia la huella SHA-256 del informe. El valor por defecto
# de CORPUS_CHUNK_CONTEXT no cambia: este informe evalúa la regla de adopción y no adopta nada (la decisión es del usuario, H-2).
nombre: s7-contexto
fixture: S7-contexto
dataset:
  ruta: data/eval/s5-corpus-ampliado # las preguntas sobre los documentos de la ingesta; los pares de `parafrasis-v1` son del mismo corpus
semilla_bootstrap: 20261122
bootstrap_repeticiones: 10000
medicion:
  reloj: real # time.perf_counter: el p95 de la consulta completa es de verdad
  rss_limite_mib: 4489 # el mismo límite de US-233a / local.yaml
adaptadores:
  proveedor: local
  urls:
    llm: http://127.0.0.1:11434/v1 # Ollama nativo; ninguna ruta hacia la nube (lista local cerrada en código)
modelos:
  llm: gemma4:26b-a4b-it-q4_K_M # G, LLM decidido en ADR-39
# Sin bloque `umbrales` (RN-22, `[S7 resp. 11]`): los tres brazos corren con los umbrales ACTUALES, que la suite lee de `Settings`
# (RELEVANCE_THRESHOLD, NLI_ENTAILMENT_THRESHOLD, RETRIEVAL_TOP_K y RERANK_TOP_N del entorno) y el informe registra. Los umbrales
# calibrados de `l1d-119` entran en la corrida final como un brazo más; este change no los mide.
catalogo:
  version: '2026.10.0'
  ruta_terminos: packages/clinical-catalogs
# `[S7 resp. 10]`: la ingesta de `l1d-119` (la misma de la corrida base) en SOLO LECTURA: `ninguno` lee la colección de `MILVUS_COLLECTION_NAME`
# (`corpus_chunks`) y los otros dos brazos, la suya propia (`indice` del brazo); el catálogo `corpus` (`CORPUS_DATABASE_URL`, rol
# `rag_corpus`) es el mismo para los tres. Sin chunks vigentes aborta; una colección que no corresponde a la variante del brazo aborta.
indice:
  fuente: milvus
corpus:
  declarado: l1d-119
comparacion:
  # tolerancia_retroceso: sin valor aquí. RETRIEVAL_REGRESSION_TOLERANCE (entorno) lo fija la preinscripción P1 (RN-22).
  conjunto_de_desarrollo: true # ADR-45 P2: el corpus ampliado y sus preguntas son de desarrollo; no hay validación ni prueba
  metas: apps/rag-orchestrator/eval/configs/metas-iniciales.yaml # el tope p95_evidence_analyses_s de la regla de adopción
  parafrasis:
    ruta: data/eval/parafrasis-v1
    pares_minimos: 10
  brazos: # la referencia es A0 = `ninguno`; el nombre de la colección lo fija `coleccion_de_la_variante` (plantilla v1)
    - {nombre: A0, RETRIEVAL_MODE: dense, CORPUS_CHUNK_CONTEXT: ninguno}
    - {nombre: A0-determinista, RETRIEVAL_MODE: dense, CORPUS_CHUNK_CONTEXT: determinista, indice: corpus_chunks__ctx_determinista_v1}
    - {nombre: A0-llm, RETRIEVAL_MODE: dense, CORPUS_CHUNK_CONTEXT: llm, indice: corpus_chunks__ctx_llm_v1}
