# Configuración de la familia `opciones` de `evaluate` con los MODELOS LOCALES REALES (US-140, L1D-246; ADR-39, RN-12).
# Corre a mano en el MacBook de referencia, en la corrida nocturna única del cierre del día 2 del S5 (junto con
# l1d-119 y l1d-305); la CI sigue con `opciones-fake.yaml`. Los pesos (rutas y SHA-256) y las claves de ADR-39 llegan por el
# entorno (`~/adr39-modelos/modelos.env` y `adr39-config.sh`); sin ellos la suite termina con código ≠ 0 nombrando la
# variable y no escribe cifras.
#   OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 ollama serve   # LLM fuera de Docker
#   python -m app.evaluation.evaluate --config eval/configs/s5.yaml --suite opciones --salida reports/eval
# Solo el corpus del dataset (verdad conocida y reproducible): no se mide sobre el corpus ampliado de l1d-119.
# Cambiar cualquier valor cambia la huella SHA-256 que forma parte del nombre del resultado.
nombre: s5-opciones-local
fixture: FX-T5a-a+FX-10c-a
dataset:
  ruta: data/evaluation/opciones
semilla_bootstrap: 20261021
bootstrap_repeticiones: 200
medicion:
  reloj: real # time.perf_counter
  rss_limite_mib: 4489 # límite de memoria para la marca de RSS: el RSS conjunto de ADR-39 (heredado de local.yaml)
adaptadores:
  proveedor: local
  urls:
    llm: http://127.0.0.1:11434/v1 # Ollama nativo; ninguna ruta hacia la nube (lista local cerrada en código)
modelos:
  llm: gemma4:26b-a4b-it-q4_K_M # G, LLM decidido en ADR-39
umbrales: # los mismos de local.yaml; si l1d-119 fija NLI_ENTAILMENT_THRESHOLD/RETRIEVAL_TOP_K antes de la medición, se actualizan aquí
  relevance_threshold: 0.30
  nli_entailment_threshold: 0.7
  retrieval_top_k: 40
  rerank_top_n: 10
catalogo:
  version: test-apl-1.0.0
  ruta_terminos: packages/clinical-catalogs
opciones:
  maxOptions: 3 # ANALYSIS_MAX_OPTIONS (FR-09)
regresion:
  # Con modelos locales el S3 no tiene reporte: el primero local es el del S4 de l1d-298 (FX-T5a-a), P1 decidido (usuario,
  # 2026-11-03, [S5 resp. 13]). DEC-07 (S6) fija la referencia definitiva.
  reporte_referencia: reports/eval/l1d-298-evaluate-modelos-locales-fx-t5a-a.json
  faithfulness_regression_tolerance: 0.05 # FAITHFULNESS_REGRESSION_TOLERANCE (RN-22; decidido, usuario, 2026-11-03)
metas_iniciales: apps/rag-orchestrator/eval/configs/metas-iniciales.yaml
