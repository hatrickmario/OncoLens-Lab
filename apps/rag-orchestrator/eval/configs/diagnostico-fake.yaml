# Configuración de la familia `diagnostico` de `evaluate` con adapters falsos (US-276, L1D-334). Es la configuración de la CI de
# esta familia (regresión de FORMA): no carga modelos, no abre sockets y es reproducible (misma configuración, mismo informe).
# Es independiente de test-fake.yaml: `--suite all` no la usa y data/evaluation/baseline.json no depende de ella.
# `diagnostico-local.yaml` es su par con los modelos locales (corrida base y final del S7). Con adapters falsos las cifras NO
# dicen nada del RAG real: ninguna se cita como resultado.
nombre: diagnostico-fake
fixture: S7-parafrasis-v1
dataset:
  ruta: data/eval/parafrasis-v1 # el corpus que mide lo declara su manifiesto: data/eval/s5-corpus-ampliado
semilla_bootstrap: 20261122
bootstrap_repeticiones: 200
medicion:
  reloj: simulado # simulado: 1 ms por lectura (reproducible); real: time.perf_counter
adaptadores:
  proveedor: fake
modelos:
  llm: fake-guion@1
umbrales: # los valores vigentes de producción ([S7 resp. 11]): RELEVANCE_THRESHOLD, RETRIEVAL_TOP_K, RERANK_TOP_N, NLI_ENTAILMENT_THRESHOLD
  relevance_threshold: 0.30
  nli_entailment_threshold: 0.7
  retrieval_top_k: 30
  rerank_top_n: 10
catalogo:
  version: '2026.10.0'
  ruta_terminos: packages/clinical-catalogs
diagnostico:
  pares_minimos: 10 # el dataset de paráfrasis tiene al menos 10 pares (US-276 AC-1)
  nli_banda_inferior: 0.5 # límite inferior de la banda de p_entailment que se cuenta bajo NLI_ENTAILMENT_THRESHOLD (US-276 AC-3)
  nli_ancho_de_tramo: 0.1 # ancho de cada tramo del histograma de p_entailment; divide [0, 1] en tramos iguales
  reranker_max_pairs: 20 # RERANKER_MAX_PAIRS de ADR-39 para los adapters falsos; con proveedor local manda el del reranker cargado
