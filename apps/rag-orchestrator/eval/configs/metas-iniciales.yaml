# Metas INICIALES de calidad y latencia (PRD §2.1: G-3, G-4, G-5; TBD-02). Solo lectura para el baseline (US-073):
# el informe las compara, nunca las modifica; las metas definitivas las fija DEC-07 (US-017) tras el baseline.
# Cada métrica declara `minimo` (valor >= minimo) o `maximo` (valor <= maximo).
clase: sintetico
version: '1'
metas:
  recall_at_10: {etiqueta: 'recall@10 (tras reranker)', minimo: 0.80}
  recall_at_10_es_a_en: {etiqueta: 'recall@10 es→en (tras reranker)', minimo: 0.70}
  mrr: {etiqueta: 'MRR', minimo: 0.60}
  fidelidad_proxy: {etiqueta: 'fidelidad (proxy)', minimo: 0.90}
  precision_citas: {etiqueta: 'precisión de citas', minimo: 0.90}
  sin_evidencia: {etiqueta: 'sin evidencia', minimo: 0.90}
  p95_evidence_analyses_s: {etiqueta: 'p95 de /platform/evidence-analyses', maximo: 20}  # 15 hasta L1D-333: tope de 20 s decidido por el usuario el 2026-11-07 (prioridad a la calidad del RAG)
  paraphrase_evidence_min_ratio: {etiqueta: 'paráfrasis con evidencia (pares atribuidos a la recuperación o al umbral)', minimo: 0.80}  # L1D-335 AC-2, inicial (RN-22): la mide la corrida final del S7, no el baseline
