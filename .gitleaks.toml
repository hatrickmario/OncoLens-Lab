# Configuración de gitleaks para la CI (US-036 AC-3, design.md D4). El repositorio es público (RN-14).
# Reglas por defecto (incluye private-key para PEM y los tokens de proveedores) más una regla propia de JWT.
# La allowlist es mínima: cada entrada combina (condition = "AND") la ruta exacta, la regla afectada y la forma del valor,
# y lleva su justificación. Toda entrada nueva se justifica en el PR (Gate 2, privacy-guardian).
title = "OncoLens"

[extend]
useDefault = true

[[rules]]
id = "jwt-con-forma"
description = "Cadena con forma de JWT (tres segmentos base64url, los dos primeros con cabecera JSON)"
regex = '''eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'''
keywords = ["eyj"]

[[allowlists]]
description = "Falso positivo: UUID sintético de ejemplo de la cabecera Idempotency-Key en un escenario de L1D-139 (no es una credencial)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''openspec/changes/l1d-139-bff-route-handler-analisis/specs/web-bff/spec\.md''']
regexes = ['''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''']

[[allowlists]]
description = "Falso positivo: en `tokenizador=tokenizador, prefijo_consulta=...` (test de US-231a, commit 33e05c9) la regla casa 'token' de 'tokenizador' y captura el nombre del argumento `prefijo_consulta`; no es una credencial"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''apps/rag-orchestrator/tests/unit/test_bge_m3\.py''']
regexes = ['''^prefijo_consulta=?$''']

# Plantilla para nuevas entradas (ruta exacta + regla + forma del valor, todo con condition = "AND"):
