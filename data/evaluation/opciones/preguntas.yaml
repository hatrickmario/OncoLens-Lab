# 12 preguntas terapéuticas sintéticas (6 mama, 6 próstata), en español completo; la `cita` de cada evidencia es literal del
# corpus del dataset (en inglés). Todo inventado. Ningún caso está revisado por un oncólogo (H-2): OP-01, OP-02, OP-07 y OP-08
# llevan `revision_provisional` (de IA, fecha 2026-11-21): mecánica verificada, nunca «validada» (S7-D1). Cuando el oncólogo
# los revise, cada caso gana `revisada_por_oncologo: {rol, fecha}` sin quitar la marca provisional.
clase: sintetico
preguntas:
