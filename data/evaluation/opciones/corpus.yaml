# Corpus de test de la familia `opciones`. La población de cada documento vive en casos.yaml (fuentes). Cada fragmento trae su
# texto en inglés (de donde se copian las citas) y una frase descriptiva en español: el recuperador falso es léxico y no cruza
# idiomas, así que las preguntas en español (S7-D3) se recuperan por esa frase; los modelos reales cruzan idiomas por sí solos.
