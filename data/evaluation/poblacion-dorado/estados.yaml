# F-20…F-24 (DEC-11): el estado lo fija un humano leyendo la regla del catálogo, no la salida del código.
casos:
- id: F-20
  criterio: estado_menopausico
  tipo_de_cancer: mama
  paciente: posmenopáusica
  valores:
  - valor: premenopausal women
    scope: elegibilidad
    chunk: ch-a
  - valor: postmenopausal women
    scope: elegibilidad
    chunk: ch-a
  esperado:
    estado: parcial
- id: F-21
  criterio: estado_menopausico
  tipo_de_cancer: mama
  paciente: premenopáusica
  valores:
  - valor: postmenopausal women
    scope: elegibilidad
    chunk: ch-a
  esperado:
    estado: desconocido
- id: F-21b
  criterio: estado_menopausico
  tipo_de_cancer: mama
  paciente: premenopáusica
