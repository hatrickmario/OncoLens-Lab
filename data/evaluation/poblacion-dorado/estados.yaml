# F-20…F-24 (DEC-11): el estado lo fija un humano leyendo la regla del catálogo, no la salida del código.
casos:
- id: F-20
  criterio: estado_menopausico
  tipo_de_cancer: mama
  paciente: posmenopáusica
  valores:
  - valor: premenopausal women
    scope: elegibilidad
    chunk: ch-a
  - valor: postmenopausal women
    scope: elegibilidad
    chunk: ch-a
  esperado:
    estado: parcial
- id: F-21
  criterio: estado_menopausico
  tipo_de_cancer: mama
  paciente: premenopáusica
  valores:
  - valor: postmenopausal women
    scope: elegibilidad
    chunk: ch-a
  esperado:
    estado: desconocido
- id: F-21b
  criterio: estado_menopausico
  tipo_de_cancer: mama
  paciente: premenopáusica
  valores:
  - valor: only postmenopausal women
    scope: elegibilidad
    chunk: ch-a
  esperado:
    estado: no_coincide
- id: F-22
  criterio: estado_menopausico
  tipo_de_cancer: mama
  paciente: posmenopáusica
  valores:
  - valor: premenopausal women
    scope: elegibilidad
    chunk: ch-a
  - valor: postmenopausal women
    scope: elegibilidad
    chunk: ch-b
  citados:
  - ch-b
  esperado:
    estado: coincide
- id: F-23
  criterio: estado_her2
  tipo_de_cancer: mama
  paciente: 3+
  valores:
  - valor: HER2-positive (IHC 3+)
    scope: elegibilidad
    chunk: ch-a
  - valor: HER2-negative (IHC 2+, ISH not amplified)
    scope: elegibilidad
    chunk: ch-b
  esperado:
    estado: desconocido
# C-3 (S7.8, Q-1): elegibilidad de un solo valor SIN «solo» frente a un paciente que no lo cumple. La regla vigente
# (DEC-11, fixture test-apl-1.2.0) no declara No coincide sin una restricción explícita: queda desconocido. La suite los
# cuenta aparte (`rendija_c3`) como medida de esa rendija, sin cambiar la regla.
- id: C-3a
  rendija: c3
  criterio: estado_menopausico
  tipo_de_cancer: mama
  paciente: premenopáusica
  valores:
  - valor: postmenopausal women
    scope: elegibilidad
    chunk: ch-a
  esperado:
    estado: desconocido
- id: C-3b
  rendija: c3
  criterio: estado_menopausico
  tipo_de_cancer: mama
  paciente: posmenopáusica
  valores:
  - valor: premenopausal women
    scope: elegibilidad
    chunk: ch-a
  esperado:
    estado: desconocido
- id: C-3c
  rendija: c3
  criterio: linea_tratamiento
  tipo_de_cancer: mama
  paciente: segunda linea
  valores:
  - valor: first line
    scope: elegibilidad
    chunk: ch-a
  esperado:
    estado: desconocido
- id: C-3d
  rendija: c3
  criterio: ecog
  tipo_de_cancer: mama
  paciente: ECOG 3
  valores:
  - valor: ECOG 0 or 1
    scope: elegibilidad
    chunk: ch-a
  esperado:
    estado: desconocido
