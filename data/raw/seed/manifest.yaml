# verificó documento por documento el 2026-10-16 (`license_verified_at`, `license_evidence`): la de PMC contra el
# registro de Europe PMC y el <license-p> del XML JATS; la de NCI contra su política de reutilización.
# `license` es el texto literal que mapea a `license_class` (CORPUS_LICENSE_CLASS_MAP). `checksum` es el SHA-256 del texto
