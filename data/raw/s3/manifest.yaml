# Manifiesto del corpus ampliado del S5 (US-120, L1D-119): superconjunto del de la semilla (`data/raw/seed/manifest.yaml`).
#
# Las diez entradas de la semilla se conservan idénticas (mismas `document_key` y `checksum`); las nuevas llevan su licencia
# verificada documento a documento el 2026-11-03 (`license_verified_at`, `license_evidence`): PMC contra el JSON de metadatos de
# PMC OA en AWS (`license_code`) y el registro de Europe PMC, NCI contra su política de reutilización y ClinicalTrials.gov contra
# sus términos de uso. Solo fuentes admitidas por ADR-36 (NCI, PMC Open Access con CC BY, ClinicalTrials.gov), sin NCCN ni ESMO
# (RN-21, D-09) y sin datos de pacientes (RN-13, RN-14). `checksum` es el SHA-256 del texto normalizado de `text_path`.
# Registros de ClinicalTrials.gov: `source_type: clinical_trial` (no son evidencia de eficacia, ADR-36 Enmienda 1);
# `original_format: html` porque el catálogo no admite JSON y `original_url` es la página pública del registro.
# Atribución completa en ATTRIBUTION.md.
