  texto: The evidence is insufficient to determine whether screening for prostate cancer with prostate-specific antigen (PSA) or digital rectal exam (DRE) reduces mortality from prostate cancer. Screening tests can detect prostate cancer at an early stage, but it is not clear whether earlier detection and consequent earlier treatment leads to any change in the natural history and outcome of the disease. Observational evidence shows a trend toward lower mortality for prostate cancer in some countries, but the relationship between these trends and intensity of screening is not clear, and associations with screening patterns are inconsistent. The observed trends may be due to screening or to other factors such as improved treatment.[1] Results from randomized trials are inconsistent.
- id: ch-nci-prostata-deteccion-hp-en-2
  documento: nci-prostata-deteccion-hp-en
  texto: The protocol, including recruitment, randomization procedures, and treatment definition and schedule, differed among countries and was developed in accordance with national regulations and standards. In Finland, Sweden, and Italy, the men in the trial were identified from population registries and were randomly assigned to the centers before written informed consent was provided. In the Netherlands, Belgium, Switzerland, and Spain, the target population was also identified from population lists, but when the men were invited to participate in the trial, only those who provided consent were randomly assigned. Randomization was 1:1 in all countries except Finland, in which it was 1:1.5. The definition of a positive test and the testing schedule also varied by country.
