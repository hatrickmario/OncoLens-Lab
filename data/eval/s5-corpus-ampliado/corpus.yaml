  texto: Immune-mediated AEs, excluding infusion reactions, of any grade were observed in 208 patients (32.8%) in the pembrolizumab‒chemotherapy arm and 45 patients (7.0%) in the placebo‒chemotherapy arm (Table ). Grade 3/4 immune-mediated AEs were reported in 45 (7.1%) and 8 patients (1.2%), respectively. The most frequently occurring immune-mediated AEs were hypothyroidism (17.5% and 1.7%, respectively), hyperthyroidism (9.0% and 0.5%, respectively) and pneumonitis (2.8% and 1.4%, respectively). No deaths were attributed to immune-mediated AEs.). Grade 3/4 immune-mediated AEs were reported in 45 (7.1%) and 8 patients (1.2%), respectively. The most frequently occurring immune-mediated AEs were hypothyroidism (17.5% and 1.7%, respectively), hyperthyroidism (9.0% and 0.5%, respectively) and pneumonitis (2.8% and 1.4%, respectively). No deaths were attributed to immune-mediated AEs.
- id: ch-pmc-mama-pembrolizumab-er-eca-4
  documento: pmc-mama-pembrolizumab-er-eca
  texto: AEs in the pembrolizumab‒chemotherapy arm were consistent with the known safety profiles of the individual agents. Similar to results from the KEYNOTE-522 study (which evaluated pembrolizumab in combination with neoadjuvant chemotherapy among patients with TNBC),,, there was no evidence that the addition of pembrolizumab to standard neoadjuvant chemotherapy exacerbated chemotherapy-associated toxicity, and the most frequently occurring events in both arms were those typically associated with cytotoxic chemotherapy, such as alopecia, nausea and anemia. Incidences of treatment-related grade ≥3 AEs and treatment-related AEs leading to treatment discontinuation were moderately higher with pembrolizumab‒chemotherapy than with placebo‒chemotherapy. As anticipated based on prior studies evaluating anti-PD-1 and anti-PD-L1 monoclonal antibodies, AEs with a potentially immune-mediated mechanism occurred more frequently among patients in the pembrolizumab‒chemotherapy arm than in the placebo‒chemotherapy arm.
- id: ch-pmc-mama-pembrolizumab-er-eca-5
  documento: pmc-mama-pembrolizumab-er-eca
  texto: Upon completion of neoadjuvant therapy, pCR was assessed according to the AJCC staging criteria (ypT0/Tis ypN0, ypT0 ypN0 and ypT0/Tis) by a local pathologist blinded to treatment assignment. EFS (defined as the time from randomization to disease progression that precluded surgery, local or distant recurrence, second primary cancer or death due to any cause, whichever occurred first) was evaluated in a blinded fashion by the investigator. PD-L1 expression in new or recent core needle biopsy samples was assessed at a central laboratory using PD-L1 IHC 22C3 pharmDx (Agilent Technologies). AEs were assessed throughout the trial and for 30 days after discontinuation of treatment (90 days for serious AEs) and graded according to Common Terminology Criteria for AEs (v4.0).
- id: ch-pmc-mama-trastuzumab-deruxtecan-eca-1
  documento: pmc-mama-trastuzumab-deruxtecan-eca
  texto: Trastuzumab deruxtecan (T-DXd) demonstrated significantly improved efficacy over trastuzumab emtansine (T-DM1) in DESTINY-Breast03 (median follow-up, 28 months). We report updated efficacy and safety analyses, including secondary and exploratory efficacy endpoints (median follow-up, 41 months) of DESTINY-Breast03. Patients with advanced HER2-positive metastatic breast cancer previously treated with taxane and trastuzumab were randomized to T-DXd (5.4 mg per kg (261 patients)) or T-DM1 (3.6 mg per kg (263 patients)). The primary endpoint was progression-free survival (PFS) by blinded independent central review and was previously reported. The key secondary endpoint was overall survival (OS). Other secondary endpoints included objective response rate, duration of response and PFS (all by investigator assessment) and safety.
- id: ch-pmc-mama-trastuzumab-deruxtecan-eca-2
  documento: pmc-mama-trastuzumab-deruxtecan-eca
  texto: In both the T-DXd and T-DM1 groups, patients had received a median of two prior lines of therapy in the metastatic setting. As of 20 November 2023, 50 patients (19.5%) in the T-DXd group and ten patients (3.8%) in the T-DM1 group remained on treatment (Fig. ). The most common reasons patients discontinued study treatment were progressive disease or clinical progression (T-DXd, 107 patients (41.6%) and five patients (1.9%); T-DM1, 183 patients (70.1%) and 16 patients (6.1%)), adverse events (T-DXd, 61 patients (23.7%); T-DM1, 24 patients (9.2%)) and withdrawal by patient (T-DXd, 22 patients (8.6%); T-DM1, 14 patients (5.4%)). Median duration of follow-up was 43.0 months (range, 0.0–62.9 months) for T-DXd and 35.4 months (range, 0.0–60.9 months) for T-DM1.).
- id: ch-pmc-mama-trastuzumab-deruxtecan-eca-3
