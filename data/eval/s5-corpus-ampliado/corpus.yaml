  texto: For chest wall recurrence, there was a paucity of events, but there seemed to be a reduced hazard of chest wall recurrence with CWI, adjusted for center and subtype; HR 0.44, 95% CI (0.19 to 1.02) but no reduction for TNBC patients, Fig. S3.5A and S3.8A-B.
- id: ch-pmc-mama-irradiacion-pared-toracica-eca-5
  documento: pmc-mama-irradiacion-pared-toracica-eca
  texto: Chest wall recurrence at 10 years was rare in SUPREMO (<3% without CWI), much lower than the 5-15% estimate for intermediate-risk disease at the time of the trial design. Other studies have also reported similarly low incidence of local recurrences with modern multi-modality therapy.(, , )) The 5-year local recurrence rate in the NSABP-B51/RTOG-1304 trial,()) which also recruited patients with 1-3 positive nodes, was <1% in unirradiated patients. This is similar to SUPREMO at 5 years. If very few patients experience loco-regional recurrence as a first event without radiotherapy, CWI is unlikely to reduce mortality.()) The apparent lack of effect of omission of CWI on disease-free and metastatis-free survival is reassuring.
- id: ch-pmc-mama-parp-neoadyuvante-eca-1
  documento: pmc-mama-parp-neoadyuvante-eca
  texto: Poly (ADP-ribose) polymerase inhibitors (PARPi) exploit DNA repair deficiency in germline BRCA1 and BRCA2 pathogenic variant (gBRCAm) cancers. Haematological toxicity limits chemotherapy-PARPi treatment combinations. In preclinical models we identified a schedule combining olaparib and carboplatin that avoids enhanced toxicity but maintains anti-tumour activity. We investigated this schedule in a neoadjuvant, phase II-III, randomised controlled trial for gBRCAm breast cancers (ClinicalTrials.gov ID:NCT03150576; PARTNER). The research arm included carboplatin (Area Under the Curve 5, 3-weekly); paclitaxel (80 mg/m2, weekly) day 1, plus olaparib (150 mg twice daily) day 3-14 (4 cycles), followed by anthracycline-containing chemotherapy (3 cycles); control arm gave chemotherapy alone. The primary endpoint, pathological complete response rate, showed no statistical difference between research 64.1% (25/39); control 69.8% (30/43) (p = 0.59).
- id: ch-pmc-mama-parp-neoadyuvante-eca-2
  documento: pmc-mama-parp-neoadyuvante-eca
  texto: PARTNER is a prospective, phase II-III, randomised controlled clinical trial, with a multi-arm multi-stage pick the winner design, which recruited patients with gBRCAm. Stage 1 examined the safety of combining olaparib with carboplatin and paclitaxel. Stages 1 and 2 compared two different schedules of olaparib and carboplatin with paclitaxel to identify optimal olaparib scheduling (randomisation 1:1:1). Stage 3 evaluated the selected olaparib schedule compared with chemotherapy alone (randomisation 1:1). The primary endpoint was pCR, and secondary endpoints included event-free survival (EFS) and overall survival (OS). Patients in the control arm received chemotherapy alone. Chemotherapy was administered on day 1; carboplatin AUC5 intravenously (i.v.) with paclitaxel 80 mg/m2 i.v.
- id: ch-pmc-mama-parp-neoadyuvante-eca-3
  documento: pmc-mama-parp-neoadyuvante-eca
  texto: 'The three most important findings from this study are: first, that combination carboplatin-containing chemotherapy plus olaparib in the gap schedule research arm is safe, tolerable and improves EFS and OS in gBRCAm patients; second, that optimal drug scheduling is critical to enable delivery of this treatment and improve outcomes; and third, in this trial there is a lack of association between pCR/non-pCR status and survival outcomes in gBRCAm patients.'
- id: ch-pmc-mama-parp-neoadyuvante-eca-4
  documento: pmc-mama-parp-neoadyuvante-eca
  texto: 'This research complies with all relevant ethical regulations. Preclinical in vivo studies complied with all relevant ethical regulations for animal testing and research, followed AstraZeneca’s global bioethics policy, and received ethical approval from the AstraZeneca ethical committee. The HBCx-17, HBCx-10 and HBCx-9 PDX model studies were carried out at XenTech, France, in accordance with French regulatory legislation concerning the protection of laboratory animals. The PARTNER trial protocol (NCT03150576 and EudraCT: 2015-002811-13) (Supplementary Note 4) was approved by Northwest—Haydock Research Ethics Committee (ref: 15/NW/0926) and the trial was performed in accordance with the Declaration of Helsinki and the European Clinical Trials Directives 2001/20/EC.'
- id: ch-pmc-mama-parp-neoadyuvante-eca-5
  documento: pmc-mama-parp-neoadyuvante-eca
  texto: Patients aged between 16 and 70 years with histologically confirmed stage T1–4, N0–3 (tumour or axillary lymph node diameter ≥10 mm) invasive breast cancer, confirmed HER2 negative, and Eastern Cooperative Oncology Group performance status (ECOG PS) 0–1 were eligible. All patients had mandatory gBRCAm testing at trial entry. Patients identified as carriers of a deleterious germline (disease-causing) mutation in the BRCA1 or BRCA2 genes were included in this cohort independently of their tumour hormonal status. Other key inclusion criteria were patient fitness to receive the trial chemotherapy regimen and availability of slides and paraffin-embedded tissue blocks from the pre-treatment biopsy.
- id: ch-pmc-mama-arx788-her2-eca-1
  documento: pmc-mama-arx788-her2-eca
  texto: 'This phase III trial aimed to compare ARX788, a site-specific, construct-homogeneous antibody-drug conjugate, with lapatinib plus capecitabine in patients with human epidermal growth factor receptor 2 (HER2)-positive advanced breast cancer (ABC) who had progressed on one line of trastuzumab based regimen. Eligible patients were randomized (1:1) to receive ARX788 (1.5 mg/kg, IV, Q3W) or lapatinib plus capecitabine (LC: lapatinib 1250 mg QD; capecitabine 1000 mg/m2 BID, days 1–14, Q3W) and stratified by prior chemotherapy lines (0-1 versus >1) and visceral metastasis (yes versus no). The primary outcome was progression-free survival (PFS) assessed by a blinded independent central review (BICR). A total of 441 patients were randomly assigned to receive either ARX788 (n = 221) or LC (n = 220).'
- id: ch-pmc-mama-arx788-her2-eca-2
  documento: pmc-mama-arx788-her2-eca
  texto: 'The data reported here are from the second interim analysis (data cutoff: December 21, 2022), conducted after 240 patients experienced disease progression or death, with a median follow-up of 11.1 months and a two-sided alpha level of 0.0162 (stopping boundary). The blinded independent central review (BICR) assessment identified 107 (48.4%) and 133 (60.5%) PFS events in the ARX788 and LC groups, respectively. The median PFS was significantly longer in the ARX788 group, at 11.3 (95% confidence interval [CI], 8.4–13.8) months, compared with 8.2 (95% CI, 6.9–8.7) months in the LC group (HR 0.64, 95% CI: 0.49–0.82, p = 0.0006 by stratified log-rank test) (Fig. ). One-year PFS rates were 49.3% (95% CI, 41.3–56.8%) and 30.7% (95% CI, 23.3–38.3%), respectively, with an absolute difference of 18.6%.'
- id: ch-pmc-mama-arx788-her2-eca-3
  documento: pmc-mama-arx788-her2-eca
  texto: Ocular toxicity related to ARX788 occurred in 74.5% of patients, manifested mainly as dry eye (55%), blurred vision (35%), and keratopathy (28.2%) (Table ). None of the patients developed perforation, ulceration, or blindness. No grade 4 events occurred. None of the patients discontinued treatment due to ocular toxicity, and ocular toxicity were mild to moderate and reversible following discontinuation of the treatment. The median time from the first dose to the onset was 29.5 days. Among the subset of patients with grade 3 toxicity (accounting for 19.1% of all patients), approximately 55% of them had self-care activity of daily life compromised, while the remaining 45% did not, and only experienced >3 lines of decreased vision from the baseline.). None of the patients developed perforation, ulceration, or blindness.
- id: ch-pmc-mama-arx788-her2-eca-4
  documento: pmc-mama-arx788-her2-eca
  texto: Grade ≥3 toxicities of ARX788 were primarily ocular and pulmonary toxicities. Ocular toxicity was an early-onset event with a median time of about a month after the first dose of ARX788, and mainly manifested as dry eye and blurred vision. There would be almost no new cases nor any case of deterioration after three months following drug administration. No primary prophylactic measures were implemented until patients had experienced any grade of ocular toxicity.
- id: ch-pmc-mama-arx788-her2-eca-5
  documento: pmc-mama-arx788-her2-eca
  texto: Patients were randomly assigned (1:1) to ARX788 or LC using a stratified permuted block method of size 4, with chemotherapy lines (0-1 versus >1) and visceral metastasis (yes versus no) as the stratification factors. The randomization statistician, independent of the sponsor and the study team (including study statistician) generated the random number tables using SAS 9.4. Eligible patients were allocated to the treatment group directly via a central interactive web response system (IWRS). Due to different administration routes of ARX788 and LC, blinding to patients or investigators was not feasible. A BICR was established to centrally perform imaging assessments. All the central reviewers were masked to the treatment assignments.
- id: ch-pmc-mama-linfocitos-her2-secundario-1
  documento: pmc-mama-linfocitos-her2-secundario
  texto: In this 10-year follow-up analysis of the ShortHER randomized clinical trial, among 866 patients with available TILs there was a statistically significant association in each 5% increase in TILs and improved overall survival. Patients with TILs 20% or higher were not exposed to excess risk of death when treated with de-escalated chemotherapy and trastuzumab.
- id: ch-pmc-mama-linfocitos-her2-secundario-2
  documento: pmc-mama-linfocitos-her2-secundario
  texto: The ShortHER trial was a phase 3 noninferiority randomized clinical trial comparing chemotherapy combined with 1 year (long arm) vs 9 weeks (short arm) of adjuvant trastuzumab in patients with ERBB2-positive early breast cancer. While the primary disease-free survival (DFS) analysis did not allow for the noninferiority of the short arm, the recently published 10-year overall survival (OS) update shows quite superimposable outcomes for the 2 arms, especially for patients with no or limited nodal involvement.
- id: ch-pmc-mama-linfocitos-her2-secundario-3
  documento: pmc-mama-linfocitos-her2-secundario
  texto: This trial was approved by local ethical committees and conducted in compliance with the principles of Good Clinical Practice and the Declaration of Helsinki. Patients provided written informed consent for tumor sample use for research purposes. The trial followed the Consolidated Standards of Reporting Trials (CONSORT) reporting guidelines.
- id: ch-pmc-mama-linfocitos-her2-secundario-4
  documento: pmc-mama-linfocitos-her2-secundario
  texto: Next, patients were stratified according to TIL levels, and survival curves were compared for patients with high and low TILs, according to different cutoffs (<20% vs ≥20%, <30% vs ≥30%, and <50% vs ≥50%). and and report Kaplan-Meier curves for DDFS and OS according to these cutoffs. In terms of DDFS, patients with high TILs experienced a statistically significant better outcome compared to patients with lower TILs at each considered cutoff. The absolute difference in both 8-year and 10-year DDFS rates was cutoff dependent, reaching 8.9% and 12.0% in DDFS and OS, respectively, at the 50% cutoff point.
