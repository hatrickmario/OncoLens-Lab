  texto: The risk of developing and dying of prostate cancer is higher among Black men (Hispanic and non-Hispanic), is of intermediate levels among White men (Hispanic and non-Hispanic), and is lowest among native Japanese men.[1,18] Conflicting data have been published regarding the etiology of these outcomes, but some evidence is available that access to health care may play a role in disease outcomes.[19] According to the Surveillance, Epidemiology, and End Results (SEER) Program, incidence of prostate cancer in African American men exceeds those of White men at all ages.[20]
- id: ch-nci-prostata-prevencion-hp-en-4
  documento: nci-prostata-prevencion-hp-en
  texto: The Prostate Cancer Prevention Trial (PCPT), a large randomized placebo-controlled trial of finasteride (an inhibitor of alpha-reductase), was performed in 18,882 men aged 55 years or older. At 7 years, the incidence of prostate cancer was 18.4% in the finasteride group versus 24.4% in the placebo group, a relative risk reduction (RRR) of 24.8% (95% confidence interval [CI], 18.6%–30.6%; P < .001). The finasteride group had more patients with Gleason grade 7 to 10, but the clinical significance of Gleason scoring is uncertain in conditions of androgen deprivation.[1] High-grade cancers (Gleason score 7–10) were noted in 6.4% of finasteride patients, compared with 5.1% of men who received placebo, yielding a relative risk (RR) of 1.27 (95% CI, 1.07–1.50).
