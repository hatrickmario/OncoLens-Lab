  texto: Agents that are used for hormonal therapy of existing prostate cancers would be unsuitable for prostate cancer chemoprevention because of the cost and wide variety of side effects including sexual dysfunction, osteoporosis, and vasomotor symptoms (hot flushes).[11] Newer antiandrogens may play a role as preventive agents in the future.[12]
- id: ch-nci-prostata-deteccion-hp-en-1
