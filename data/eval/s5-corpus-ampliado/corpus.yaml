  texto: Adjudicated drug-related ILD and/or pneumonitis occurred in 43 patients (16.7%) in the T-DXd group and in nine patients (3.4%) in the T-DM1 group during the entire study period through the 20 November 2023 data cutoff (Table ). In the T-DXd group, 11 patients (4.3%) had a grade 1 event, 30 patients (11.7%) had a grade 2 event and two patients (0.8%) had a grade 3 event. Since the previous data cutoff (25 July 2022), four new adjudicated drug-related ILD events (all grade 2) were reported with T-DXd. In the T-DM1 group, five patients (1.9%) had a grade 1 event, three patients (1.1%) had a grade 2 event and one patient (0.4%) had a grade 3 event.
- id: ch-pmc-mama-trastuzumab-deruxtecan-eca-4
  documento: pmc-mama-trastuzumab-deruxtecan-eca
  texto: With the additional follow-up since the previous analysis, four new ILD and/or pneumonitis events occurred in the T-DXd group (all grade 2). Most new events resolved or resolved with sequalae (75%) and occurred during the third year of treatment (time to onset between 832 and 961 d). As previously reported, only two patients had grade 3 events in the T-DXd group (both events resolved); no grade 4 or 5 events were observed. Consistent with a previous study, most ILD and/or pneumonitis events occurred within the first year of T-DXd treatment (Extended Data Table )). In the T-DM1 group, rates of ILD and pneumonitis increased from 3% to 3.4% at this updated data cutoff; there was only one additional grade 1 event compared with the previous data cutoff.
- id: ch-pmc-mama-trastuzumab-deruxtecan-eca-5
