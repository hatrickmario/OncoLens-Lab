  texto: Several authors have considered whether complexed PSA or percent-free PSA in conjunction with total PSA can improve total PSA sensitivity. Of special interest is the gray zone of total PSA, the range from 2.5 ng/mL to 4.0 ng/mL. A meta-analysis of 18 studies addressed the added diagnostic benefit of percent-free PSA. There was no uniformity of cutoff among these studies. For cutoffs ranging from 8% to 25% (free/total), results ranged from about 45% sensitivity/95% specificity to 95% sensitivity/15% specificity.[7]
