  texto: TheraP (A Randomised Phase 2 Trial of 177Lu-PSMA617 Theranostic Versus Cabazitaxel in Progressive Metastatic Castration Resistant Prostate Cancer [ANZUP Protocol 1603]) evaluated treatment with Lu-177 PSMA vs cabazitaxel in patients with PSMA-positive mCRPC that had progressed after chemotherapy with docetaxel. TheraP demonstrated greater activity for the serum prostate-specific antigen (PSA) response with Lu-177 PSMA compared with cabazitaxel (66% vs 37%) but similar overall survival (OS) outcomes (stratified hazard ratio [HR], 0.97 [95% CI, 0.70-1.35]); P = .99) with a median follow-up of 36 [IQR, 31-39] months.
- id: ch-pmc-prostata-lu-psma-comparadores-3
  documento: pmc-prostata-lu-psma-comparadores
  texto: Adjustment for crossover in TheraP involved 3 steps. The first step was to construct a detailed specification of the treatment effects we sought to estimate (ie, an estimand). For example, 1 estimand targeted the effect of allocation to Lu-177 PSMA vs allocation to cabazitaxel followed by no crossover after disease progression to Lu-177 PSMA. Second, we explored similarities and differences in baseline characteristics and outcomes between TheraP participants who did or did not cross over. Third, we used rank-preserving structural failure time models (RPSFTM), and inverse probability of censoring weights (IPCW), to estimate the specified estimands.,, As crossover was negligible (0.5%) in VISION, no adjustment was undertaken.
- id: ch-pmc-prostata-lu-psma-comparadores-4
  documento: pmc-prostata-lu-psma-comparadores
  texto: Both trials administered Lu-177 PSMA once every 6 weeks to a maximum of 6 cycles. TheraP used an initial dose of 8.5 gigabecquerels (GBq; 1 Bq is approximately 2.7 × 10−11 curies), reducing by 0.5 GBq each cycle, while VISION used a consistent dose of 7.4 GBq per cycle. The total prescribed dose (TheraP, 43.5 GBq vs VISION, 44.4 GBq) and dose intensity were similar.
- id: ch-pmc-prostata-lu-psma-comparadores-5
  documento: pmc-prostata-lu-psma-comparadores
  texto: The OS was similar among participants assigned to receive Lu-177 PSMA in TheraP vs VISION (HR, 0.92 [95% CI, 0.70-1.19]), with a 24-month survival probability of 31% (95% CI, 23%-42%) for TheraP vs 30% (95% CI, 26%-36%) for VISION (). The OS was longer among participants assigned to receive cabazitaxel in TheraP than PPT in VISION (HR, 0.53 [95% CI, 0.39-0.71]), with a 24-month survival probability of 36% (95% CI, 27%-48%) in TheraP vs 17% (11%-24%) in VISION (). The OS was longer among participants assigned to receive cabazitaxel in TheraP than PPT in VISION (HR, 0.53 [95% CI, 0.39-0.71]), with a 24-month survival probability of 36% (95% CI, 27%-48%) in TheraP vs 17% (11%-24%) in VISION ().).
- id: ch-pmc-prostata-cribado-personalizado-es-1
  documento: pmc-prostata-cribado-personalizado-es
  texto: La utilidad del antígeno específico de la próstata (PSA) en el cribado del cáncer de próstata (CaP) es una cuestión controvertida. Los resultados publicados son polémicos en cuanto a la consecución de una disminución de la mortalidad y al rigor metodológico. No obstante, hay coincidencia en observar la relación del cribado con un aumento del número de CaP indolentes.
- id: ch-pmc-prostata-cribado-personalizado-es-2
  documento: pmc-prostata-cribado-personalizado-es
  texto: Tanto el estudio europeo como el norteamericano coinciden en observar un aumento en el número de casos de CaP diagnosticados en el grupo que realiza cribado con PSA, resaltando que ello comporta el sobrediagnóstico y sobretratamiento de un importante número de tumores con un bajo riesgo de progresión. Así, según datos del estudio europeo el porcentaje de tumores con un bajo riesgo de progresión fue del 56,4% en el grupo que hizo cribado y del 39,1% en el grupo control [].].
- id: ch-pmc-prostata-cribado-personalizado-es-3
  documento: pmc-prostata-cribado-personalizado-es
  texto: Se abría en aquel momento una etapa en que las recomendaciones de las diversas sociedades se volvían más conservadoras y abogaban por reducir drásticamente el cribado del CaP mediante la medida de PSA. No obstante, otros autores han puesto de manifiesto que la práctica del cribado supone una reducción del número de pacientes que debutan con metástasis [], [], [], [], [] y señalan que una consecuencia derivada del riesgo de no practicar el cribado podría ser un aumento del número de muertes causadas por CaP [] y señalan que una consecuencia derivada del riesgo de no practicar el cribado podría ser un aumento del número de muertes causadas por CaP [].
- id: ch-pmc-prostata-cribado-personalizado-es-4
  documento: pmc-prostata-cribado-personalizado-es
  texto: Diferenciar entre pacientes con un bajo riesgo de progresión y pacientes que pueden beneficiarse de un tratamiento activo del tumor permitiría reducir los perjuicios inherentes al sobrediagnostico y sobretratamiento. La vigilancia activa ha sido propuesta como una herramienta útil para el manejo de pacientes con tumores con un bajo riesgo de progresión que nunca afectaran la vida del paciente []. Pacientes con un grado de Gleason menor a 7, una concentración de PSA inferior a 10 µg/L y poco material afecto por el tumor en la biopsia pueden ser incluidos en programas de vigilancia activa.
- id: ch-pmc-prostata-cribado-personalizado-es-5
  documento: pmc-prostata-cribado-personalizado-es
  texto: El CaP es una enfermedad enormemente compleja, con grandes diferencias en su pronóstico, abarcando desde tumores indolentes que nunca van a afectar la vida del paciente hasta tumores letales resistentes a la castración. Esta heterogeneidad influye decisivamente en el balance entre beneficios y riesgos que se asocian a la práctica del cribado (). Un diagnóstico precoz del tumor solo va a beneficiar a pacientes con tumores agresivos para los cuales dispongamos de un tratamiento efectivo que permita disminuir la mortalidad causada por el tumor. Por otro lado, deben considerarse los riesgos asociados al cribado, tanto por lo que respecta a la biopsia, que además en muchos casos será negativa dada la falta de especificidad del PSA, como al tratamiento en caso de que se detecte un CaP.
- id: ch-pmc-prostata-nueva-perspectiva-cribado-es-1
  documento: pmc-prostata-nueva-perspectiva-cribado-es
  texto: El cribado del cáncer de próstata mediante la medida del antígeno específico de la próstata (PSA) ha sido objeto de una intensa polémica. Los beneficios derivados en cuanto a reducción en mortalidad del cribado organizado del cáncer de próstata se han acompañado de un importante sobrediagnóstico, que se ha traducido en tratamientos innecesarios y numerosos efectos adversos. Por ello, las recomendaciones de las sociedades científicas han sido cada vez más restrictivas. En los últimos años se han hecho diversas propuestas para reconsiderar el enfoque sobre el cribado del cáncer de próstata, con objeto de superar la oposición entre cribar a todo el mundo o no cribar a nadie y a reconsiderar el PSA como una herramienta que permita un balance favorable entre beneficios y riesgos.
- id: ch-pmc-prostata-nueva-perspectiva-cribado-es-2
  documento: pmc-prostata-nueva-perspectiva-cribado-es
  texto: En todo caso deben subrayarse dos particularidades de estos dos ensayos. Por un lado, el ensayo norteamericano tiene una elevada tasa de contaminación con medidas de PSA en la rama control, que ha sido estimada entre el 42 y el 50 %, por lo que no ofrece una respuesta definitiva sobre la utilidad del cribado, como han reconocido los mismos autores del ensayo [].
- id: ch-pmc-prostata-nueva-perspectiva-cribado-es-3
  documento: pmc-prostata-nueva-perspectiva-cribado-es
  texto: Las recomendaciones contrarias al cribado han causado un retraso en el diagnóstico de la enfermedad. Así, Bandini et al. [] comunican un incremento en la incidencia de nuevos casos diagnosticados con metástasis tras analizar los datos de la base SEER (Surveillance, Epidemiology and End Results). Los autores observan que, entre 2004 y 2014, la edad de presentación de CaP diseminado disminuyó, mientras que el número de pacientes que debutó con metástasis aumentó del 1,9 a 2,4 por 100 000 habitantes.] comunican un incremento en la incidencia de nuevos casos diagnosticados con metástasis tras analizar los datos de la base SEER (Surveillance, Epidemiology and End Results).
- id: ch-pmc-prostata-nueva-perspectiva-cribado-es-4
  documento: pmc-prostata-nueva-perspectiva-cribado-es
  texto: La implementación de una estrategia personalizada de cribado del CaP en función de un PSA basal permitiría, según las evidencias disponibles, mejorar los resultados del cribado, reduciendo el sobrediagnóstico de la enfermedad al disminuir el número de determinaciones de PSA en pacientes de cierta edad, en los cuales la probabilidad de un falso positivo relacionado con patología benigna de la próstata es más frecuente. En segundo lugar, supondría un notable ahorro en cuanto a determinaciones de PSA, puesto que en muchos pacientes con una concentración basal de PSA baja se discontinuaría, en ausencia de otros datos que lo aconsejasen, la realización de determinaciones de PSA.
- id: ch-pmc-prostata-nueva-perspectiva-cribado-es-5
  documento: pmc-prostata-nueva-perspectiva-cribado-es
  texto: Los resultados comunicados para el test S3M también muestran una elevada especificidad y su relación con la agresividad del tumor. A este respecto, destaca el estudio de cribado desarrollado en Stavanger (Noruega) [], en que se observa que la sustitución de la medida de PSA por el test S3M aumenta la detección de pacientes con un CaP con un grado de Gleason 7 o superior, a la vez que disminuye el número de tumores clínicamente no significativos que se diagnostican.], en que se observa que la sustitución de la medida de PSA por el test S3M aumenta la detección de pacientes con un CaP con un grado de Gleason 7 o superior, a la vez que disminuye el número de tumores clínicamente no significativos que se diagnostican.
- id: ch-ct-mama-aphinity-1
  documento: ct-mama-aphinity
  texto: Brief summary This randomized, double-blind, placebo-controlled, two-arm study will assess the safety and efficacy of pertuzumab in addition to chemotherapy plus trastuzumab as adjuvant therapy in participants with operable HER2-positive primary breast cancer. This study will be carried out in collaboration with the Breast International Group (BIG).
- id: ch-ct-mama-aphinity-2
  documento: ct-mama-aphinity
  texto: 'Arm (EXPERIMENTAL): Pertuzumab + Trastuzumab + Chemotherapy Participants will receive pertuzumab (840 mg loading dose, then 420 mg) and trastuzumab (8 mg/kg loading dose, then 6 mg/kg) intravenously (IV) every 3 weeks (Q3W) for 1 year (maximum 18 cycles) in combination with 1 of the following IV chemotherapy regimen (anthracycline-based or nonanthracycline-based) per Investigator''s choice: 1) 3-4 cycles (Q3W) of 5-fluorouracil 500-600 mg/m\^2 + epirubicin 90-120 mg/m\^2 or doxorubicin 50 mg/m\^2 + cyclophosphamide 500-600 mg/m\^2 followed by either 3-4 cycles of docetaxel Q3W (100 mg/m\^2 for 3 cycles, 75 mg/m\^2 in first cycle and 100 mg/m\^2 in subsequent cycles, or 75 mg/m\^2 for 4 cycles) or 12 cycles of paclitaxel 80 mg/m\^2 once weekly (QW); 2) 4 cycles (Q3W) of doxorubicin 60 mg/m\^2 or epirubicin 90-120 mg/m\^2 + cyclophosphamide 500-600'
- id: ch-ct-mama-aphinity-3
  documento: ct-mama-aphinity
  texto: 'Arm (PLACEBO_COMPARATOR): Placebo + Trastuzumab + Chemotherapy Participants will receive placebo matching to pertuzumab IV Q3W and trastuzumab (8 milligrams per kilogram \[mg/kg\] loading dose, then 6 mg/kg) IV Q3W for 1 year (maximum 18 cycles) in combination with 1 of the following IV chemotherapy regimen (anthracycline-based or nonanthracycline-based) per Investigator''s choice: 1) 3-4 cycles (Q3W) of 5-fluorouracil 500-600 milligrams per square meter (mg/m\^2) + epirubicin 90-120 mg/m\^2 or doxorubicin 50 mg/m\^2 + cyclophosphamide 500-600 mg/m\^2 followed by either 3-4 cycles of docetaxel Q3W (100 mg/m\^2 for 3 cycles, 75 mg/m\^2 in first cycle and 100 mg/m\^2 in subsequent cycles, or 75 mg/m\^2 for 4 cycles) or 12 cycles of paclitaxel 80 mg/m\^2 QW; 2) 4 cycles (Q3W) of doxorubicin 60 mg/m\^2 or epirubicin 90-120 mg/m\^2 + cyclophosphamide 500-600 mg/m\^2'
- id: ch-ct-mama-aphinity-4
  documento: ct-mama-aphinity
  texto: 'Primary outcomes - Percentage of Participants With Invasive Disease-Free Survival (IDFS) Event (Excluding Second Primary Non-Breast Cancer [SPNBC]), as Assessed Using Radiologic, Histologic Examinations or Laboratory Findings (Randomization to the first occurrence of IDFS event (excluding SPNBC) (until data cut-off date 19 December 2016; median [range] follow-up: 3.8 [0-4.9] years)). Percentage of participants with IDFS events (excluding SPNBC) is reported. IDFS event was defined as the first occurrence of one of the following events: Ipsilateral invasive breast tumor recurrence (that is \[i.e.\], an invasive breast cancer involving the same breast parenchyma as the original primary lesion); ipsilateral local-regional invasive breast cancer recurrence (i.e., an invasive breast cancer in the axilla, regional lymph nodes, chest wall, and/or skin of the ipsilateral breast); distant recurrence (i.e., evidence of breast cancer in any'
- id: ch-ct-mama-aphinity-5
  documento: ct-mama-aphinity
  texto: '* Non-metastatic operable primary invasive HER2-positive carcinoma of the breast that is histologically confirmed, and adequately excised * Eastern Cooperative Oncology Group (ECOG) performance status less than or equal to (\</=) 1 * Known hormone receptor status (estrogen receptor and progesterone receptor) * The interval between definitive surgery for breast cancer and the first dose of chemotherapy must be no more than 8 weeks (56 days).'
- id: ch-ct-mama-monarche-1
  documento: ct-mama-monarche
  texto: 'Arm (EXPERIMENTAL): 150 mg Abemaciclib + Endocrine Therapy Participants received Abemaciclib orally at 150 milligrams (mg) twice daily with at least 6 hours between doses for up to 2 years or until evidence of disease recurrence or other discontinuation criteria were met, whichever occurs first. Endocrine therapy (physicians'' choice) standard-of-care was administered according to package label until discontinuation criteria were met.'
- id: ch-ct-mama-monarche-2
  documento: ct-mama-monarche
  texto: 'Primary outcomes - Invasive Disease Free Survival (IDFS) (Baseline to Recurrence or Death from Any Cause (Up to 32 Months)). IDFS, as defined by the STEEP System, was measured from the date of randomization to the date of first occurrence of one of the following events: ipsilateral invasive breast tumor recurrence, regional invasive breast cancer recurrence, distant recurrence, contralateral invasive breast cancer, second primary non-breast invasive cancer, death attributable to any cause.'
- id: ch-ct-mama-monarche-3
  documento: ct-mama-monarche
  texto: '* Women (regardless of menopausal status) or men ≥18 years of age (or per local regulations). * The participant has confirmed HR+, HER2-, early stage resected invasive breast cancer without evidence of distant metastases. * The participant must have undergone definitive surgery of the primary breast tumor. * The participant must have tumor tissue from breast (preferred) or lymph node for exploratory biomarker analysis available prior to randomization. * Pathologic lymph node involvement and at least one of the following indicating a higher risk of recurrence:'
- id: ch-ct-mama-monarche-4
  documento: ct-mama-monarche
  texto: '* Metastatic disease (including contralateral axillary lymph nodes) or node-negative disease. * Participants with inflammatory breast cancer. * Participants with a history of previous breast cancer, with the exception of ipsilateral ductal carcinoma in situ (DCIS) treated by locoregional therapy alone ≥5 years ago. Participants with a history of contralateral DCIS treated by local regional therapy at any time may be eligible. Participants with a history of any other cancer (except non-melanoma skin cancer or carcinoma in situ of the cervix), unless in complete remission with no therapy for a minimum of 5 years from the date of randomization are excluded. * Females who are pregnant or lactating. * The participant has previously received treatment with any CDK4 and CDK6 inhibitor.'
- id: ch-ct-mama-natalee-1
  documento: ct-mama-natalee
  texto: 'Title COMPLEEMENT-1: An Open-label, Multicenter, Phase IIIb Study to Assess the Safety and Efficacy of Ribociclib (LEE011) in Combination With Letrozole for the Treatment of Men and Pre/Postmenopausal Women With Hormone Receptor-positive (HR+) HER2-negative (HER2-) Advanced Breast Cancer (aBC) With no Prior Hormonal Therapy for Advanced Disease'
- id: ch-ct-mama-natalee-2
  documento: ct-mama-natalee
  texto: In the event that patients were still deriving benefit at the end of the Core phase and ribociclib was not approved or available and reimbursed, patients were transitioned to the Extension Phase and continued to receive study treatment until progression, intolerance, death or physician/patient decision. Only safety and clinical benefit (as assessed by investigator) data was collected in the Extension Phase. During the Extension Phase, if ribociclib became locally approved and reimbursed, patients were to be transitioned to prescription. Patients who completed the Extension Phase and continued to derive clinical benefit from the treatment based on the investigator's evaluation received ribociclib from prescription (if approved and reimbursed), another post-trial access program, or other drug access/support program(s).
- id: ch-ct-mama-natalee-3
  documento: ct-mama-natalee
  texto: 'Arm (EXPERIMENTAL): Ribociclib + letrozole+goserelin/leuprolide Participants received ribociclib (orally taken, 3 weeks on/1 week off) in combination with letrozole (orally taken once daily). For men and premenopausal women, either goserelin was given as an injectable subcutaneous implant or leuprolide was given as an intramuscular injection.'
- id: ch-ct-mama-natalee-4
  documento: ct-mama-natalee
  texto: 'AEs were assessed and graded according to the Common Terminology Criteria for Adverse Events (CTCAE) version 4.03. Grade 1 to 5 were used to characterize the severity of the Adverse Event. Grade 1: mild; Grade 2: moderate; Grade 3: severe; Grade 4: life-threatening and Grade 5: death related to AE.'
- id: ch-ct-mama-natalee-5
  documento: ct-mama-natalee
  texto: 'Note: For women with therapy-induced amenorrhea, serial measurements of FSH and/or estradiol were needed to ensure menopausal status. 2. Premenopausal status was defined as either: I).Patient had last menstrual period within the last 12 months OR ii). If on tamoxifen or toremifene within the past 14 days, plasma estradiol and FSH must be in the premenopausal range per local normal range OR iii). In case of therapy induced amenorrhea, plasma estradiol and/or FSH must be in the premenopausal range per local normal range. 3. Perimenopausal status was define as neither premenopausal nor postmenopausal * Patient had a histologically and/or cytologically confirmed diagnosis of estrogen-receptor positive and/or progesterone receptor positive breast cancer by local laboratory.'
- id: ch-ct-mama-destiny-breast06-1
  documento: ct-mama-destiny-breast06
  texto: Detailed description Eligible patients will be those patients who have had disease progression on at least 2 previous lines of endocrine therapies given for the treatment of metastatic disease or disease progression within 6 months of starting first line treatment for metastatic disease with an endocrine therapy combined with a CDK4/6 inhibitor. All patients must have historically confirmed HR positive (either estrogen receptor and/or progesterone receptor positive), HER2-low (defined as IHC2+/ISH- and IHC 1+) or HER2 IHC \>0 \<1+ expression, as determined by central laboratory testing results, advanced or metastatic breast cancer.
- id: ch-ct-mama-destiny-breast06-2
  documento: ct-mama-destiny-breast06
  texto: The study aims to evaluate the efficacy, safety and tolerability of trastuzumab deruxtecan compared with investigator's choice chemotherapy. This study aims to see if trastuzumab deruxtecan allows patients to live longer without the cancer getting worse, or simply to live longer, compared to patients receiving standard of care chemotherapy. This study is also looking to see how the treatment and the cancer affects patients' quality of life.
- id: ch-ct-mama-destiny-breast06-3
  documento: ct-mama-destiny-breast06
  texto: Primary outcomes - Progression-Free Survival (PFS) Assessed by Blinded Independent Central Review (BICR) in the Hormone Receptor-Positive (HR+), Human Epidermal Growth Factor Receptor 2 (HER2)-Low Population (Response evaluations performed at screening, every 6 weeks (q6w) ± 1 week from randomization for 48 weeks, and then every 9 weeks (q9w) ± 1 week, starting at Week 48 until PD, up to PCD of 18 March 2024 (maximum of approximately 43.85 months)). PFS per Response Evaluation Criteria in Solid Tumors version 1.1 (RECIST 1.1) assessed by BICR was defined as the time from the date of randomization until the date of PD, as defined or death (by any cause in the absence of progression) regardless of whether the participant withdrew from randomized therapy or received another anticancer therapy prior to progression.
- id: ch-ct-mama-destiny-breast06-4
  documento: ct-mama-destiny-breast06
  texto: '* Ineligible for all options in the investigator''s choice chemotherapy arm * Lung-specific intercurrent clinically significant illnesses * Uncontrolled or significant cardiovascular disease or infection * Prior documented interstitial lung disease (ILD)/ pneumonitis that required steroids, current ILD/ pneumonitis, or suspected ILD/ pneumonitis that cannot be ruled out by imaging at screening. * Patients with spinal cord compression or clinically active central nervous system metastases * Prior randomization or treatment in a previous trastuzumab deruxtecan study regardless of treatment arm assignment * Concurrent enrolment in another clinical study, unless it is an observational (non-interventional) clinical study during the follow up period of a prior interventional study (prescreening for this study while a patient is on treatment in another clinical study is acceptable)'
- id: ch-ct-mama-katherine-1
  documento: ct-mama-katherine
  texto: Title A Randomized, Multicenter, Open-Label Phase III Study to Evaluate the Efficacy and Safety of Trastuzumab Emtansine Versus Trastuzumab as Adjuvant Therapy for Patients With HER2-Positive Primary Breast Cancer Who Have Residual Tumor Present Pathologically in the Breast or Axillary Lymph Nodes Following Preoperative Therapy
- id: ch-ct-mama-katherine-2
  documento: ct-mama-katherine
  texto: Brief summary This 2-arm, randomized, open-label study will evaluate the efficacy and safety of trastuzumab emtansine versus trastuzumab as adjuvant therapy in patients with HER2-positive breast cancer who have residual tumor present in the breast or axillary lymph nodes following preoperative therapy. Eligible patients will be randomized to receive either trastuzumab emtansine 3.6 mg/kg or trastuzumab 6 mg/kg intravenously every 3 weeks for 14 cycles. Radiotherapy and/or hormone therapy will be given in addition if indicated.
- id: ch-ct-mama-katherine-3
  documento: ct-mama-katherine
  texto: 'Primary outcomes - Invasive Disease-free Survival (IDFS) Rate at 3 Years (At Year 3). IDFS event was defined as the first occurrence of any one of the following events: ipsilateral invasive breast tumor recurrence (i.e., an invasive breast cancer involving the same breast parenchyma as the original primary lesion); ipsilateral local-regional invasive breast cancer recurrence (i.e., an invasive breast cancer in the axilla, regional lymph nodes, chest wall and/or skin of the ipsilateral breast); distant recurrence (i.e., evidence of breast cancer in any anatomic site-other than the 2 above-mentioned sites - that has either been histologically confirmed or clinically diagnosed as recurrent invasive breast cancer); contralateral invasive breast cancer; death attributable to any cause including breast cancer, non-breast cancer or unknown cause .'
- id: ch-ct-mama-katherine-4
  documento: ct-mama-katherine
  texto: '* Adult patient, \>/= 18 years of age * HER2-positive breast cancer * Histologically confirmed invasive breast carcinoma * Clinical stage T1-4/N0-3/M0 at presentation (patients with T1a/bN0 tumors will not be eligible) * Completion of preoperative systemic chemotherapy and HER2-directed treatment consisting of at least 6 cycles of chemotherapy with a total duration of at least 16 weeks, including at least 9 weeks of trastuzumab and at least 9 weeks of taxane-based therapy * Adequate excision: surgical removal of all clinically evident disease in the breast and lymph nodes as specified in protocol * Pathological evidence of residual invasive carcinoma in the breast or axillary lymph nodes following completion of preoperative therapy * An interval of no more than 12 weeks between the date of surgery and the date of'
- id: ch-ct-mama-katherine-5
  documento: ct-mama-katherine
  texto: '* Stage IV (metastatic) breast cancer * History of any prior (ipsi- or contralateral breast cancer except lobular carcinoma in situ * Evidence of clinically evident gross residual or recurrent disease following preoperative therapy and surgery * Progressive disease during preoperative systemic therapy * Treatment with any anti-cancer investigational drug within 28 days prior to commencing study treatment * History of other malignancy within the last 5 years except for appropriately treated carcinoma in situ of the cervix, non-melanoma skin carcinoma, Stage I uterine cancer, or other non-breast malignancies with a similar outcome to those mentioned above * Patients for whom radiotherapy would be recommended for breast cancer treatment but for whom it is contraindicated because of medical reasons * Current NCI CTCAE (Version 4.0) Grade \>/= 2 peripheral neuropathy'
- id: ch-ct-prostata-arasens-1
  documento: ct-prostata-arasens
  texto: Detailed description This is a randomized, double-blind, placebo-controlled, multicenter phase III study. The study population will consist of approximately 1300 subjects with metastatic hormone sensitive prostate cancer (mHSPC), who will be randomized (1:1 ratio) to receive 600 mg (2 x 300 mg tablets) of darolutamide (ODM-201)/placebo twice daily with food, equivalent to a total daily dose of 1200 mg, in addition to standard androgen deprivation therapy (ADT) and docetaxel. Subjects will be stratified at randomization for the extent of disease and for Alkaline Phosphatase levels. All subjects will be treated with ADT as standard therapy. Six cycles of docetaxel will be administered after randomization.
- id: ch-ct-prostata-arasens-2
  documento: ct-prostata-arasens
  texto: Primary outcomes - OS From Date of Randomization Until Death From Any Cause - Number of Events (From randomization of the first participant until death from any cause up to 25 OCT 2021 cut-off date 533 OS events were reached (approximate 59 months)). Overall survival (OS) was defined as the time from the date of randomization until death from any cause.
- id: ch-ct-prostata-arasens-3
  documento: ct-prostata-arasens
  texto: Active follow-up visits from the discontinuation of the darolutamide or placebo treatment period for up to 1 year or until the patient could no longer travel to the clinic, died, was lost to follow-up, or withdrew informed consent and actively objected to collection of further data.
- id: ch-ct-prostata-arasens-4
  documento: ct-prostata-arasens
  texto: Active follow-up visits from the discontinuation of the darolutamide or placebo treatment period for up to 1 year or until the patient could no longer travel to the clinic, died, was lost to follow-up, or withdrew informed consent and actively objected to collection of further data.
- id: ch-ct-prostata-arasens-5
  documento: ct-prostata-arasens
  texto: '* Histologically or cytologically confirmed adenocarcinoma of prostate. * Metastatic disease * Candidates for ADT and docetaxel. * Started ADT with or without first generation anti androgen, but no longer than 12 weeks before randomization * An Eastern Cooperative Oncology Group (ECOG) performance status of 0 or 1 * Adequate bone marrow, liver and renal function'
- id: ch-ct-prostata-aramis-1
  documento: ct-prostata-aramis
  texto: Primary outcomes - Metastasis-Free Survival (From randomization to the time approximately 385 MFS events were observed (approximately 48 months)). Metastasis-Free Survival (MFS) is defined as the time from randomisation to evidence of metastasis or death from any cause, whichever occurs first (cut-off date 15 Nov 2019)
- id: ch-ct-prostata-aramis-2
  documento: ct-prostata-aramis
  texto: '* Histologically or cytologically confirmed adenocarcinoma of prostate without neuroendocrine differentiation or small cell features. * Castration-resistant prostate cancer (CRPC) with castrate level of serum testosterone. * Prostate-specific Antigen (PSA) doubling time of ≤ 10 months and PSA \> 2ng/ml. * Eastern Cooperative Oncology Group (ECOG) performance status of 0-1. * Blood counts at screening: haemoglobin ≥ 9.0 g/dl,absolute neutrophil count ≥ 1500/µl, platelet count ≥ 100,000/µl. * Screening values of serum alanine aminotransferase (ALT) and/or aspartate transaminase (AST) ≤ 2.5 x upper limit of normal (ULN), total bilirubin ≤ 1.5 x ULN, creatinine ≤ 2.0 x ULN.'
- id: ch-ct-prostata-aramis-3
  documento: ct-prostata-aramis
  texto: '* History of metastatic disease at any time or presence of detectable metastases. * Acute toxicities of prior treatments and procedures not resolved to grade ≤ 1 or baseline before randomisation. * Prior treatment with: second generation androgen receptor (AR) inhibitors, other investigational AR inhibitors, or CYP17 enzyme inhibitor. * Use of estrogens or 5-α reductase inhibitors or AR inhibitors. * Prior chemotherapy or immunotherapy for prostate cancer. * Use of systemic corticosteroid. * Radiation therapy within 12 weeks before randomisation. * Severe or uncontrolled concurrent disease, infection or co-morbidity. * Treatment with bisphosphonate or denosumab within 12 weeks before randomisation. * Known hypersensitivity to the study treatment or any of its ingredients. * Major surgery within 28 days before randomisation.'
- id: ch-ct-prostata-latitude-1
  documento: ct-prostata-latitude
  texto: Brief summary The purpose of this study is to determine if newly diagnosed (within previous 3 months) participants with metastatic (spread of cancer cells from one part of the body to another ) hormone-naive prostate cancer (mHNPC) who have high-risk prognostic factors will benefit from the addition of abiraterone acetate plus low-dose prednisone to androgen deprivation therapy (ADT; lutenizing hormone releasing hormone \[LHRH\] agonists or surgical castration).
- id: ch-ct-prostata-latitude-2
  documento: ct-prostata-latitude
  texto: Detailed description This is a randomized (the treatment group is assigned by chance), double-blind (neither physician nor participant knows the treatment that the participant receives), placebo (an inactive substance that is compared with a drug to test whether the drug has a real effect in a clinical trial)-controlled study designed to determine the efficacy of abiraterone acetate plus low-dose prednisone in participants with mHNPC.
- id: ch-ct-prostata-latitude-3
  documento: ct-prostata-latitude
  texto: 'Arm (EXPERIMENTAL): Abiraterone acetate + Prednisone + ADT Participants will receive abiraterone acetate tablet at a total dose of 1000 milligram (mg) plus 5 mg capsule of prednisone orally once daily until disease progression, withdrawal of consent or unacceptable toxicity. Stable regimen of androgen deprivation therapy (ADT) will be administered.'
- id: ch-ct-prostata-latitude-4
  documento: ct-prostata-latitude
  texto: Primary outcomes - Radiographic Progression-Free Survival (PFS) (Up to 44 months). Radiographic PFS was defined as the time (in months) interval from randomization to the first date of radiographic progression or death. Radiographic progression included progression by bone scan (according to modified Prostate Cancer Working Group 2 \[PCWG2\] criteria), defined as at least 2 new lesions on bone scan and progression of soft tissue lesions by computed tomography (CT) or magnetic resonance imaging (MRI) (according to Response Evaluation Criteria in Solid Tumors \[RECIST\] 1.1 criteria). As per the RECIST 1.1 guideline, progression requires a 20 percent (%) increase in the sum of diameters of all target lesions and a minimum absolute increase of 5 millimeter (mm) in the sum as compared to nadir sum of diameter.
- id: ch-ct-prostata-latitude-5
  documento: ct-prostata-latitude
  texto: '* Newly diagnosed metastatic prostate cancer within 3 months prior to randomization with histologically or cytologically confirmed adenocarcinoma of the prostate without neuroendocrine differentiation or small cell histology * Distant metastatic disease documented by positive bone scan or metastatic lesions on computed tomography (CT) or magnetic resonance imaging (MRI) scan * At least 2 of the following high-risk prognostic factors: Gleason score of greater than or equal to (\>=8); presence of 3 or more lesions on bone scan; presence of measurable visceral (excluding lymph node disease) metastasis on CT or MRI Response Evaluation Criteria in Solid Tumors (RECIST) Version 1.1 scan * Eastern Cooperative Oncology Group (ECOG) performance status grade of 0, 1 or 2 * Adequate hematologic, hepatic, and renal function * Agrees to protocol-defined use of effective contraception'
- id: ch-ct-prostata-spartan-1
  documento: ct-prostata-spartan
  texto: Detailed description This Phase 3 clinical trial is an essential step in the evaluation of an investigational medication to see if it may be useful in treating prostate cancer. The purpose of the SPARTAN study is to compare the safety and effectiveness of the investigational medication to placebo in delaying prostate cancer from spreading to other parts of the body. A placebo is a pill that looks like the investigational medication but does not contain any active medication, a dummy pill.
- id: ch-ct-prostata-spartan-2
  documento: ct-prostata-spartan
  texto: Phase 3 studies are performed after preliminary evidence suggesting effectiveness of the drug has been obtained in previous Phase 2 studies. These studies are intended to gather the additional information about effectiveness and safety that is needed to evaluate the overall benefit-risk relationship of the drug.
- id: ch-ct-prostata-spartan-3
  documento: ct-prostata-spartan
  texto: The investigational medication will be given to 2 out of every 3 study participants. Neither you nor the study staff will know which group you are in. However, in case of a medical emergency, your study doctor can quickly find out which treatment group you are in.
- id: ch-ct-prostata-spartan-4
  documento: ct-prostata-spartan
  texto: Primary outcomes - Metastasis-Free Survival (MFS) by Blinded Independent Central Review (BICR) (Up to approximately 43 Months). MFS was defined as the time from randomization to the time of first evidence of BICR-confirmed bone or soft tissue distant metastasis or death due to any cause, whichever occurred first. The MFS data for participants without metastasis or death were performed for US or ex-US regulatory purposes. Radiographic scans (bone scans and computerized tomography \[CT\] or magnetic resonance imaging \[MRI\] of the chest, abdomen, and pelvis) were performed for detection of metastasis throughout the study.
- id: ch-ct-prostata-spartan-5
  documento: ct-prostata-spartan
  texto: '* Histologically or cytologically confirmed adenocarcinoma of the prostate without neuroendocrine differentiation or small cell features with high risk for development of metastases, defined as prostate-specific antigen doubling time (PSADT) less than or equal to (\<=) 10 months. PSADT is calculated using at least 3 prostate-specific antigen (PSA) values obtained during continuous ADT (androgen deprivation therapy) * Castration-resistant prostate cancer demonstrated during continuous ADT, defined as 3 PSA rises, at least 1 week apart, with the last PSA greater than (\>) 2 nanogram per milliliter (ng/mL) * Maintain castrate levels of testosterone within 4 weeks prior to randomization and throughout the study * Patients currently receiving bone loss prevention treatment with bone-sparing agents must be on stable doses for at least 4 weeks prior to randomization * Patients who received'
- id: ch-ct-prostata-prevail-1
  documento: ct-prostata-prevail
  texto: Primary outcomes - Overall Survival (During study period (up to 3 years)). Overall survival was defined as the time from randomization to death due to any cause. For patients who were alive at the time of the analysis data cutoff, overall survival was censored at the last date the patient was known to be alive or analysis data cutoff date, whichever was first. This included patients who were known to have died after the data analysis cutoff date. Patients with no post-baseline survival information were censored on the date of randomization. - Radiographic Progression-free Survival (rPFS) (During study period (up to 20 months)).
- id: ch-ct-prostata-prevail-2
  documento: ct-prostata-prevail
  texto: '* Histologically confirmed adenocarcinoma of the prostate without neuroendocrine differentiation or small cell features * Ongoing androgen deprivation therapy with a GnRH analogue or bilateral orchiectomy * Progressive disease despite androgen deprivation therapy as defined by rising PSA levels or progressive soft tissue or bony disease * No prior treatment with cytotoxic chemotherapy * Asymptomatic or mildly symptomatic from prostate cancer'
- id: ch-ct-prostata-prevail-3
  documento: ct-prostata-prevail
  texto: '* Severe concurrent disease, infection, or co-morbidity that, in the judgment of the Investigator, would make the patient inappropriate for enrollment * Known or suspected brain metastasis or active leptomeningeal disease * History of another malignancy within the previous 5 years other than curatively treated non-melanomatous skin cancer'
- id: ch-ct-prostata-prevail-4
  documento: ct-prostata-prevail
  texto: '* Received randomized double-blind treatment in PREVAIL; * Open-label day 1 visit is within 6 months after this amendment is approved and becomes effective at the study site; * Is willing to maintain androgen deprivation therapy with a gonadotropin-releasing hormone (GnRH) agonist/antagonist or has had a bilateral orchiectomy;'
