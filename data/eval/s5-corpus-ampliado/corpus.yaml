  texto: 'These analyses were restricted to studies involving abiraterone and enzalutamide among ARPIs due to data availability. As shown in Table , ARPIs were associated with a statistically significant increase in both any grade (RR: 1.39, 95% CI: 1.10–2.22, , ARPIs were associated with a statistically significant increase in both any grade (RR: 1.39, 95% CI: 1.10–2.22, p < 0.01) and grade ≥3 (RR: 1.74, 95% CI: 1.13–2.68, p = 0.01) cardiac disorder. Significant differences in disease state were observed for any grade cardiac disorder (p = 0.03) in mCRPC (RR: 1.19, 95% CI: 0.91–1.54) and mHSPC (RR: 1.75, 95% CI: 1.39–2.22). No significant difference was observed at grade ≥3 cardiac disorder (p = 0.6) (Supplementary Table 2). Cochran’s Q test revealed no significant heterogeneity in the analyses.'
