  texto: The primary endpoint was PFS assessed by BICR,,. The key secondary endpoint was OS. Other secondary and exploratory endpoints reported in this study included ORR, DoR, PFS, PFS2 by investigator assessment and safety. PFS2 was defined as the time from the date of randomization to the first documented progression on the next line of therapy or death due to any cause, whichever occurred first. The next line of therapy was defined as the first new systemic antineoplastic therapy initiated after discontinuation of study treatment regardless of the reason for end of treatment.
- id: ch-pmc-mama-elacestrant-esr1-eca-1
  documento: pmc-mama-elacestrant-esr1-eca
  texto: Elacestrant significantly prolonged progression-free survival (PFS) with manageable safety versus standard-of-care (SOC) endocrine therapy (ET) in patients with estrogen receptor–positive (ER+), HER2− metastatic breast cancer and tumors harboring estrogen receptor 1 (ESR1) mutation following ET plus a cyclin-dependent kinase 4/6 inhibitor (ET+CDK4/6i). In patients with ESR1-mutated tumors, we evaluated the efficacy and safety of elacestrant versus SOC based on prior ET+CDK4/6i duration and in clinical subgroups with prior ET+CDK4/6i ≥12 months.
- id: ch-pmc-mama-elacestrant-esr1-eca-2
  documento: pmc-mama-elacestrant-esr1-eca
  texto: Evaluating subgroups of patients according to prior ET+CDK4/6i duration, metastatic site, and the presence of common coexisting mutations or molecular expressions with ESR1 may help identify tumors that remain endocrine-sensitive despite acquired resistance to previous ET and thus help support clinical treatment decisions. To accomplish these goals, as these analyses were not prespecified in the EMERALD protocol, we conducted two post hoc exploratory subgroup analyses.
- id: ch-pmc-mama-elacestrant-esr1-eca-3
  documento: pmc-mama-elacestrant-esr1-eca
  texto: Safety was assessed in the overall population (patients with and without ESR1-mutated tumors) according to the treatment arm and in patients with ESR1-mutated tumors by the treatment arm according to ET+CDK4/6i duration and clinically relevant subgroups among patients who had received prior ET+CDK4/6i ≥12 months.
- id: ch-pmc-mama-elacestrant-esr1-eca-4
  documento: pmc-mama-elacestrant-esr1-eca
  texto: In the overall population (patients with or without ESR1-mutated tumors), the majority of AEs that occurred were of grade 1 or 2 severity, including nausea (). Treatment discontinuations due to any treatment-related AE occurred in eight patients (3.4%) receiving elacestrant and two patients (0.9%) receiving SOC. No deaths assessed as treatment-related were reported in either arm. No hematologic safety signal was observed, and sinus bradycardia was not reported in either treatment arm.). Treatment discontinuations due to any treatment-related AE occurred in eight patients (3.4%) receiving elacestrant and two patients (0.9%) receiving SOC. No deaths assessed as treatment-related were reported in either arm. No hematologic safety signal was observed, and sinus bradycardia was not reported in either treatment arm.
- id: ch-pmc-mama-elacestrant-esr1-eca-5
  documento: pmc-mama-elacestrant-esr1-eca
  texto: Safety analyses demonstrated that elacestrant had a manageable safety profile similar to other ETs and without evidence of some of the toxicities associated with other drug classes, such as CDK4/6i and PI3K/AKT/mTOR inhibitors. CDK4/6i combinations are associated with neutropenia, leukopenia, anemia, and diarrhea, with discontinuations due to AEs in up to 19% of patients (, , ). The use of PI3K/AKT/mTOR pathway inhibitors plus ET is associated with diarrhea, rash, and hyperglycemia, resulting in discontinuations due to AEs in up to 24% of patients (). The use of PI3K/AKT/mTOR pathway inhibitors plus ET is associated with diarrhea, rash, and hyperglycemia, resulting in discontinuations due to AEs in up to 24% of patients (, , , , ).).
- id: ch-pmc-mama-capivasertib-eca-1
  documento: pmc-mama-capivasertib-eca
  texto: In the global CAPItello-291 randomized phase 3 study (NCT04305496) in patients with hormone receptor-positive/HER2-negative advanced breast cancer and progression during/after aromatase inhibitor treatment, capivasertib–fulvestrant significantly improved progression-free survival (PFS) in the overall population and patients with PIK3CA/AKT1/PTEN-altered tumors versus placebo–fulvestrant. We assessed efficacy and safety of capivasertib–fulvestrant in a prespecified exploratory analysis of a Chinese cohort (n = 24) and extended study with the same protocol (n = 110).
- id: ch-pmc-mama-capivasertib-eca-2
  documento: pmc-mama-capivasertib-eca
  texto: At the primary analysis (data cutoff 8 May 2023), 18 patients (25.4%) were continuing to receive capivasertib and 10 patients (16.1%) were continuing to receive placebo. The main reason for discontinuation of capivasertib/placebo was radiological disease progression (Supplementary Fig. 1). In the capivasertib–fulvestrant group, patients were treated with capivasertib for a median of 5.5 months and with fulvestrant for a median of 6.0 months. In the placebo–fulvestrant group, patients received placebo for a median of 2.2 months and fulvestrant for a median of 2.8 months.
- id: ch-pmc-mama-capivasertib-eca-3
  documento: pmc-mama-capivasertib-eca
  texto: Serious AEs were reported in 20 patients (28.2%) receiving capivasertib–fulvestrant and in 3 patients (4.8%) receiving placebo–fulvestrant (Supplementary Table 4). Death due to AEs was reported in one patient (1.4%) in the capivasertib-fulvestrant group and in 0 patients in the placebo–fulvestrant group; the reported death was from renal failure and was not considered by the investigator to be related to capivasertib or fulvestrant. AEs led to discontinuation of capivasertib/placebo in eight patients (11.3%) receiving capivasertib and in two patients (3.2%) receiving placebo (Supplementary Table 5), and led to dose reduction of capivasertib/placebo in 13 (18.3%) patients receiving capivasertib and in 0 patients receiving placebo (Supplementary Table 5). Dose interruptions were required for capivasertib/placebo in 36 patients (50.7%) receiving capivasertib and in 18 patients (29.0%) receiving placebo (Supplementary Table 5).
- id: ch-pmc-mama-capivasertib-eca-4
  documento: pmc-mama-capivasertib-eca
  texto: 'CAPItello-291 (ClinicalTrials.gov registration: NCT04305496) is a phase 3, double-blind, placebo-controlled, randomized study. Patients in the Chinese cohort were recruited in either the global phase 3 study or in an extended Chinese cohort with the same protocol and inclusion/exclusion criteria after recruitment to the global study had closed. The study was designed and overseen by an academic steering group that included representatives from AstraZeneca, the sponsor. An institutional review board and independent ethics committee reviewed the study protocol, amendments, and other relevant documents. A description of the protocol is in the Supplementary Information. Patients were recruited from 25 sites in mainland China and 3 NMPA-certified sites in Taiwan. The first and the last patient were enrolled in the study on 13 October 2020 and 3 January 2023, respectively.'
- id: ch-pmc-mama-capivasertib-eca-5
  documento: pmc-mama-capivasertib-eca
  texto: All statistical analyses were exploratory and performed only if sufficient numbers of events or patients were available (e.g. ≥ 20 PFS or overall survival events across both treatment groups), as prespecified in the statistical analysis plan. No formal sample size calculation was performed, no adjustment for multiplicity was performed and only descriptive statistics are presented. A cohort of approximately 134 randomized patients was planned, including patients recruited as part of the global study in mainland China and NMPA-certified sites in Taiwan.
- id: ch-pmc-mama-adn-tumoral-metastasico-rs-1
  documento: pmc-mama-adn-tumoral-metastasico-rs
  texto: In this systematic review and meta-analysis reporting data from 4264 patients in 37 studies, detection of ctDNA was associated with worse overall, progression-free, and disease-free survival in patients with metastatic breast cancer. This association remained significant irrespective of differences in study design, including ctDNA detection method and type of blood collection tubes.
- id: ch-pmc-mama-adn-tumoral-metastasico-rs-2
  documento: pmc-mama-adn-tumoral-metastasico-rs
  texto: TP53 and PIK3CA emerge as the most frequently reported driver alterations in primary breast cancer; however, in MBC, additional alterations in different metastatic sites add complexity to the overall genetic profile. Monitoring techniques currently used in practice, though, lack the capability to identify the onset of disease progression and treatment resistance at an early stage, thus hindering the timely transition to a more potent and effective treatment strategy. Therefore, using ctDNA to track the variant profile of a tumor in real time holds considerable implications for the clinical management of MBC.
- id: ch-pmc-mama-adn-tumoral-metastasico-rs-3
  documento: pmc-mama-adn-tumoral-metastasico-rs
  texto: A total of 3162 publications were identified using our comprehensive search string (eTable 1 in Supplement 2). After applying our inclusion and exclusion criteria, we included 37 publications (1.2%) reporting data from 4264 female patients aged 20 to 94 years with MBC or stage IV breast cancer ().).,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,, Of the 37 included studies, 20 (54%) were prospective,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,, and 17 (46%) were retrospective.,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,, Some studies featured multiple survival analyses,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,, each distinct in terms of survival outcomes, detected variants, or breast cancer subtype. Consequently, each of these analyses were treated as an individual study for a total of 75 studies in our meta-analysis extracted from the 37 articles. Study and patient characteristics are reported in and represented visually in and represented visually in ..
- id: ch-pmc-mama-adn-tumoral-metastasico-rs-4
  documento: pmc-mama-adn-tumoral-metastasico-rs
  texto: Given the diverse variant landscape of MBC, we evaluated the association between detection of specific ctDNA alterations and patient survival. We found that TP53 and ESR1 alterations were linked to a significantly shorter survival (hazard ratio, 1.58 [95% CI, 1.34-1.81] and 1.28 [95% CI, 0.96-1.60], respectively; P < .001) (eFigure 3 in Supplement 1). Furthermore, there was an association between diminished survival and alterations less frequently detected in breast cancer, encompassing CTCF, ERBB2, FGFR, GATA3, KRAS, MAPK, NOTCH2, PTEN, and TOP1 (hazard ratio, 1.82; 95% CI, 1.26-2.39; P < .001). Interestingly, this pattern was not evident in patients with ctDNA alterations in PIK3CA (hazard ratio, 1.19; 95% CI, 0.85-1.53).
- id: ch-pmc-mama-adn-tumoral-metastasico-rs-5
  documento: pmc-mama-adn-tumoral-metastasico-rs
  texto: The analysis of ctDNA presents a challenge due to its small fraction compared with total cfDNA in a plasma sample, making the choice of blood collection tube crucial. In recent years, several cfDNA stabilizing tubes containing solutions that prevent cfDNA degradation and white blood cell lysis, thereby reducing genomic DNA (gDNA) contamination, have been produced. Additionally, these tubes offer the convenience of room temperature storage for an extended duration (up to 14 days), unlike EDTA tubes, which require processing within a few hours.
- id: ch-pmc-mama-irradiacion-pared-toracica-eca-1
  documento: pmc-mama-irradiacion-pared-toracica-eca
  texto: We undertook a randomized phase 3 international trial investigating the omission of chest wall irradiation in women with “intermediate-risk” breast cancer (pT1-2N1; pT3N0 or pT2N0 with grade III and/or lympho-vascular invasion) treated by mastectomy, an axillary procedure and systemic therapy. Patients were randomized to 40 - 50 Gy chest wall irradiation (CWI) or no CWI. Primary endpoint was overall survival, with 10 years of follow-up. Chest wall and regional recurrence, disease-free survival, distant metastasis-free survival, causes of death and morbidity were also assessed.
- id: ch-pmc-mama-irradiacion-pared-toracica-eca-2
  documento: pmc-mama-irradiacion-pared-toracica-eca
  texto: The protocol specified guidelines for pathology, surgery, radiation and adjuvant systemic therapy. We reviewed the pathology reports of all patients in the trial to check eligibility (S 2.2). Two pathologists (JT, AH) conducted a central pathology review of histology slides from UK and EORTC patients.())
- id: ch-pmc-mama-irradiacion-pared-toracica-eca-3
  documento: pmc-mama-irradiacion-pared-toracica-eca
  texto: The consort diagram and patient characteristics in the ITT population are shown in and and . Additional tumor and treatment details are provided in . Additional tumor and treatment details are provided in table S3.1. In the ITT population, 808 patients were randomized to CWI and 799 to no CWI (August 4, 2006 - April 29, 2013). Supraclavicular fossa was irradiated in 97/808 patients with CWI and 12/799 patients without CWI. Internal mammary chain was irradiated in 12/808 patients with CWI, and 7/799 patients without CWI. In total 85% of patients received chemotherapy (87% delivered per local protocol), 79% endocrine therapy and 19% trastuzumab. Median follow up was 9.6 years. The trial database was locked on June 19, 2024.
