  texto: 'Data for TALA + ENZA was provided by Pfizer at the time of review given the efficacy and safety of TALA + ENZA were still being evaluated. Since the last SLR update (October 2022), results for the TALAPRO-2 trial have been published (DCO: 16/08/22). Updated OS data (DCO: 28/03/23) used in the present analysis were provided by Pfizer. Thus, a total of 39 unique RCTs were considered for NMAs and were the primary focus of this analysis.'
