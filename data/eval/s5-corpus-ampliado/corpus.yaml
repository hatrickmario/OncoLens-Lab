  texto: As indicated above, the intention-to-screen analysis of this trial showed no detectable difference in prostate cancer mortality between the two groups. However, the investigators focused on as-screened analyses. They observed that there were 4 prostate cancer deaths (0.056%) among the 7,155 men who were screened and 44 prostate cancer deaths (0.31%) among the 14,255 men who were not screened, an RR of 5.5. Based on exposure times, the investigators attributed the 67.1% reduction in prostate cancer death rate to screening.[22] This conclusion is flawed, as pointed out by other investigators.[25] (see above)
