- id: ch-nci-prostata-tratamiento-pac-en-1
  documento: nci-prostata-tratamiento-pac-en
  texto: The prostate is a gland in the male reproductive system. It lies just below the bladder (the organ that collects and empties urine) and in front of the rectum (the lower part of the intestine). It is about the size of a walnut and surrounds part of the urethra (the tube that empties urine from the bladder). The prostate gland makes fluid that is part of the semen.
- id: ch-nci-prostata-tratamiento-pac-en-2
  documento: nci-prostata-tratamiento-pac-en
  texto: To give the cancer a grade, the pathologist checks the prostate tissue samples to see how much the tumor tissue is like the normal prostate tissue and to find the two main cell patterns. The primary pattern describes the most common tissue pattern, and the secondary pattern describes the next most common pattern. Each pattern is given a grade from 3 to 5, with grade 3 looking the most like normal prostate tissue and grade 5 looking the most abnormal. The two grades are then added to get a Gleason score.
