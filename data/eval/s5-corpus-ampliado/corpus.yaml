  texto: Additionally, there are opportunities to potentially improve outcomes for focal brachytherapy. The consistent use of multi-parametric MRI and saturation biopsies may optimize patient selection and target volume identification. In the salvage setting, the use of increasingly sensitive PSMA PET scans may rule out patients with small-volume regional or distant disease. There is an increasing trend and potential advantages to using HDR-BT brachytherapy for focal treatments, as mentioned above. The use of fractioned regimens, rather than single fraction treatment, will likely improve outcomes given the inferior outcomes seen with single fraction HDR-BT brachytherapy in the whole-gland setting.
- id: ch-pmc-prostata-eventos-cardiovasculares-nma-1
  documento: pmc-prostata-eventos-cardiovasculares-nma
  texto: In August 2023, we queried PubMed, Scopus, and Web of Science databases to identify randomized controlled studies (RCTs) that analyze PCa patients treated with abiraterone, apalutamide, darolutamide, and enzalutamide. The primary outcomes of interest were the incidence of cardiac disorder, heart failure, ischemic heart disease (IHD), atrial fibrillation (AF), and hypertension. Network meta-analyses (NMAs) were conducted to compare the differential outcomes of each ARPI plus androgen deprivation therapy (ADT) compared to standard of care (SOC).
- id: ch-pmc-prostata-eventos-cardiovasculares-nma-2
  documento: pmc-prostata-eventos-cardiovasculares-nma
  texto: All RCTs assessing the AEs of ARPI, such as abiraterone, enzalutamide, apalutamide, and darolutamide are included. We utilized the PICO framework []. Included studies must have evaluated patients with metastatic/advanced HSPC, nmCRPC, mCRPC, or BCR (Population), treated with ARPI plus ADT (Intervention), and compared to those treated with SOC (Comparison) to assess the risk of cardiovascular events (Outcome). The primary outcome of interest was the overall proportion of cardiac disorders, which are defined according to the National Cancer Institute’s Common Terminology Criteria for Adverse Events (CTCAE). The secondary outcomes included the proportion of heart failure, ischemic heart disease (IHD), atrial fibrillation (AF), and hypertension.
