- id: ch-pmc-prostata-enzalutamida-abiraterona-ma-5
  documento: pmc-prostata-enzalutamida-abiraterona-ma
  texto: This study had several strengths. It is among the first to compare enzalutamide and abiraterone across multiple RWE studies, including those that adjusted for baseline patient characteristics and those that did not. In addition, this study benefits from its inclusion of data from multiple countries and datasets, including the most recent and largest RWE studies available. The inclusion of these data permitted the meta-analysis of OS, which was not previously possible. In addition, because a large number of studies were available for the analysis of OS, multiple sensitivity analyses could be conducted, lending credibility to our findings. Finally, the majority of studies reporting OS data adjusted for baseline patient characteristics, permitting more robust conclusions to be drawn from the head-to-head comparison of enzalutamide and abiraterone.
- id: ch-pmc-prostata-braquiterapia-focal-rs-1
  documento: pmc-prostata-braquiterapia-focal-rs
  texto: Recent advances in image-guided brachytherapy have allowed for treatment volume reduction in the treatment of prostate cancer, with the aim to optimize disease control and reduce toxicities. This systematic review reports on the efficacy and safety of focal brachytherapy for treatment of patients with localized prostate cancer.
- id: ch-pmc-prostata-braquiterapia-focal-rs-2
  documento: pmc-prostata-braquiterapia-focal-rs
  texto: A comprehensive literature search was performed in Medline, Embase, Cochrane Central Register of Controlled Trials, Cochrane Database of Systematic Reviews, and Web of Science from the inception of each database to July 2023. Search strategy was developed to identify studies reporting on patients with prostate cancer and brachytherapy. The search strategy included a combination of controlled vocabulary terms and text words, adapting the database-specific search syntax. The search was limited to human studies and articles published in English, excluding book, conferences, and preprints (Supplementary Material 1A and B).
