- id: ch-pmc-prostata-enzalutamida-abiraterona-ma-1
  documento: pmc-prostata-enzalutamida-abiraterona-ma
  texto: Androgen-receptor pathway inhibitors such as abiraterone and enzalutamide have demonstrated clinical benefit in patients with metastatic castration-resistant prostate cancer (mCRPC). The aim of this study was to conduct a meta-analysis of published real-world evidence studies comparing outcomes among patients treated with enzalutamide or abiraterone in the first-line setting.
