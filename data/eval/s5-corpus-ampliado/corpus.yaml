- id: ch-pmc-prostata-niraparib-abiraterona-eca-4
  documento: pmc-prostata-niraparib-abiraterona-eca
  texto: Our study has some limitations. Only the BRCA and HRR effector gene subgroups were powered for formal statistical testing, as the number of patients in each of the other seven individual gene subgroups was too small. Further assessment of individual gene alteration effects could be achieved by combined analyses with other trials and clinical datasets. Our study allowed only limited previous androgen receptor pathway inhibition, namely up to 45 days of abiraterone plus prednisone prior to randomization. Due to the timelines for obtaining genetic test results in the setting of a trial, a proportion of HRR-positive patients who were prescreened for AMPLITUDE were not eligible to proceed.
- id: ch-pmc-prostata-niraparib-abiraterona-eca-5
  documento: pmc-prostata-niraparib-abiraterona-eca
  texto: The primary outcome measure was investigator-assessed radiographic progression-free survival, defined as time from randomization to radiographic progression or death, whichever occurred first. Soft tissue progression was defined in Response Evaluation Criteria in Solid Tumors version 1.1, and bone disease progression was based on Prostate Cancer Working Group 3 criteria, requiring confirmation by a second scan ≥6 weeks later. Secondary outcomes were time to symptomatic progression, overall survival, time to subsequent therapy and safety. Time to symptomatic progression was defined as the time from randomization to a clinically relevant cancer-related symptom event that required an intervention, including radiation for bone pain, nephrostomy for urinary obstruction, cord compression or the start of a new subsequent treatment.
- id: ch-pmc-prostata-inhibidores-ar-taxanos-eca-1
  documento: pmc-prostata-inhibidores-ar-taxanos-eca
  texto: ProBio is the first outcome-adaptive platform trial in prostate cancer utilizing a Bayesian framework to evaluate efficacy within predefined biomarker signatures across systemic treatments. Prospective circulating tumor DNA and germline DNA analysis was performed in patients with metastatic castration-resistant prostate cancer before randomization to androgen receptor pathway inhibitors (ARPIs), taxanes or a physician’s choice control arm. The primary endpoint was the time to no longer clinically benefitting (NLCB). Secondary endpoints included overall survival and (serious) adverse events. Upon reaching the time to NLCB, patients could be re-randomized. The primary endpoint was met after 218 randomizations. ARPIs demonstrated ~50% longer time to NLCB compared to taxanes (median, 11.1 versus 6.9 months) and the physician’s choice arm (median, 11.1 versus 7.4 months) in the biomarker-unselected or ‘all’ patient population.
- id: ch-pmc-prostata-inhibidores-ar-taxanos-eca-2
  documento: pmc-prostata-inhibidores-ar-taxanos-eca
  texto: Clinical patient characteristics at baseline were evenly distributed between the physician’s choice control and the investigational arms with comparable utilization rates of androgen deprivation therapy (ADT) monotherapy and ADT intensification (that is, either with docetaxel or ARPIs) before metastatic castration-resistant disease (Table ). The lines of systemic therapy that were initiated for mCRPC after randomization were comparable across all treatment arms. The type of progressive disease at trial entry was comparable with bone (with or without nodal disease) progression most commonly observed in 104/151 (68.9%) patients. However, the systemic therapy class(es) to which the patients had been exposed before ProBio differed at randomization.
- id: ch-pmc-prostata-inhibidores-ar-taxanos-eca-3
  documento: pmc-prostata-inhibidores-ar-taxanos-eca
  texto: We further provided randomized-controlled insights into the treatment-predictive potential of the selected biomarker signatures and proposed novel ctDNA-defined patient subpopulations with differential treatment outcomes. Specifically, our data suggest that AR (SNV/GSR)-negative and TP53 wild-type patients, or TMPRSS2–ERG fusion-positive patients, may derive greater benefits from ARPIs compared to taxanes. The results for AR (SNV/GSR)-negative and TP53 wild-type patients were consistent with prior retrospective studies that reported superior outcomes on ARPIs––. However, for AR (SNV/GSR)-negative and TP53 wild-type patients, no difference in overall survival between ARPIs and taxanes was observed at the time of analysis. Longer follow-up will show whether the extended time to NLCB with ARPIs compared to taxanes for AR (SNV/GSR)-negative and TP53 wild-type patients ultimately also translates into better overall survival.
- id: ch-pmc-prostata-inhibidores-ar-taxanos-eca-4
  documento: pmc-prostata-inhibidores-ar-taxanos-eca
  texto: Our results demonstrate that, on average, ARPIs outperform taxanes in all ctDNA-positive patients with mCRPC who are ARPI-naive and with or without prior docetaxel exposure. This may be particularly the case in AR (SNV/GSR)-negative and TP53 wild-type patients or TMPRSS2–ERG fusion-positive patients. Conversely, new treatment strategies might be relevant to TP53-altered patients considering their poor and similar short-term outcomes, irrespective of a treatment with ARPIs or taxanes. Furthermore, ProBio’s biomarker-driven and outcome-adaptive design shows the feasibility of using ctDNA for treatment personalization and may represent a new model for precision medicine trials in oncology.
- id: ch-pmc-prostata-inhibidores-ar-taxanos-eca-5
  documento: pmc-prostata-inhibidores-ar-taxanos-eca
  texto: Additionally, randomization takes into account prior systemic therapy exposure and avoids sequencing or rechallenging with second-generation ARPIs (for example, no randomization to enzalutamide when the patient was previously treated with abiraterone acetate). However, sequencing with taxanes was allowed (that is, cabazitaxel after prior therapy with docetaxel). To facilitate this, randomization probabilities for non-permitted treatment sequences were set to zero.
- id: ch-pmc-prostata-darolutamida-japon-eca-1
  documento: pmc-prostata-darolutamida-japon-eca
  texto: In the global ARASENS study (NCT02799602), darolutamide plus androgen‐deprivation therapy (ADT) and docetaxel significantly reduced risk of death by 32.5% versus placebo plus ADT and docetaxel (hazard ratio [HR] 0.68; 95% confidence interval [CI] 0.57–0.80; p < 0.0001), with a favorable safety profile in patients with metastatic hormone‐sensitive prostate cancer (mHSPC). We investigated outcomes in Japanese participants.
- id: ch-pmc-prostata-darolutamida-japon-eca-2
  documento: pmc-prostata-darolutamida-japon-eca
  texto: Over the past few years, the international standard of care for mHSPC has evolved to combine ADT with either docetaxel or an androgen receptor pathway inhibitor (ARPI; abiraterone acetate, enzalutamide, or apalutamide),, , , , based on significantly increased survival and delayed progression versus ADT alone. based on significantly increased survival and delayed progression versus ADT alone., , , , , , , , , , , , , , , , , , , , , , , , , , , , In 2022, the phase 3 ARASENS and PEACE‐1 studies demonstrated significant survival benefits from ADT in combination with an ARPI (darolutamide or abiraterone acetate, respectively) plus docetaxel versus ADT plus docetaxel alone.
- id: ch-pmc-prostata-darolutamida-japon-eca-3
  documento: pmc-prostata-darolutamida-japon-eca
  texto: Efficacy was assessed in the full analysis set, which comprised all randomized patients available for analysis, assessed according to the treatment to which they were randomized. Secondary endpoints were tested with a hierarchical gatekeeping procedure, in the order described above, only if the primary endpoint and each preceding secondary endpoint in the hierarchy reached statistical significance. Differences between treatment groups were analyzed using a stratified log‐rank test, using randomization stratification factors. HRs (darolutamide vs. placebo) and 95% CIs were calculated using the Cox model stratified by randomization stratification factors. Two‐sided p‐values are reported for the overall population. Statistical analyses for the Japanese subgroup are exploratory.
- id: ch-pmc-prostata-darolutamida-japon-eca-4
  documento: pmc-prostata-darolutamida-japon-eca
  texto: Despite longer treatment with darolutamide versus placebo (43.3 vs. 15.4 months), the incidences of TEAEs of any grade and severe TEAEs (grade ≥3) were generally similar between treatment groups in the Japanese subgroup (Table ). The incidence of TEAEs leading to treatment discontinuation was low in both groups. The safety profile in the Japanese subgroup was generally similar to that of the overall ARASENS population, with a few exceptions. In the Japanese subgroup, both treatment groups had a higher incidence of grade 4 TEAEs and the darolutamide group had a higher incidence of serious TEAEs compared with the overall ARASENS population. Febrile neutropenia was the only individual serious TEAE that occurred in >5% of patients and was reported in more placebo recipients than darolutamide recipients (14% vs. 8%).).
- id: ch-pmc-prostata-darolutamida-japon-eca-5
  documento: pmc-prostata-darolutamida-japon-eca
  texto: Interpretation of the findings in Japanese patients must take into account that the study was not powered for this subgroup analysis, and results are descriptive only. Nevertheless, darolutamide showed trends of improved efficacy over placebo, with similar tolerability and no new safety concerns, which support the use of darolutamide in combination with ADT and docetaxel in Japanese patients with mHSPC. These results are consistent with the overall ARASENS population, suggesting that darolutamide in combination with ADT and docetaxel should be considered as one of the new standards of care for the treatment of patients with mHSPC, including Japanese patients.
- id: ch-pmc-prostata-hormonoterapia-radioterapia-ma-1
  documento: pmc-prostata-hormonoterapia-radioterapia-ma
  texto: Adding hormone therapy to definitive radiotherapy in localised prostate cancer improves overall survival, but whether it similarly improves overall survival in the context of postoperative radiotherapy (PORT) after radical prostatectomy is unclear. Herein, we report an individual patient data (IPD) meta-analysis of randomised trials aimed at quantifying the benefit of adding hormonal therapy to PORT.
- id: ch-pmc-prostata-hormonoterapia-radioterapia-ma-2
  documento: pmc-prostata-hormonoterapia-radioterapia-ma
  texto: To identify all relevant randomised, phase 3 trials investigating the addition of hormone therapy to PORT, or the prolongation from short-term to long-term hormone therapy with PORT, we did a systematic literature review. This study was reported in accordance with the PRISMA guidelines. Our statistical analysis plan and a completed checklist is provided in the appendix (pp 3–8). A systematic literature search was done in the English language by use of MEDLINE (1966–2025), Embase (1982–2025), trial registries (Cochrane Central Register of Controlled Trials and ClinicalTrials.gov), the Web of Science, Scopus, and major urology and oncology conference proceedings (1990–2025) to retrieve relevant studies.
- id: ch-pmc-prostata-hormonoterapia-radioterapia-ma-3
  documento: pmc-prostata-hormonoterapia-radioterapia-ma
  texto: The primary efficacy analysis used a one-stage meta-analysis framework. Data from all patients were analysed by use of a univariable Cox proportional hazards model (for overall survival, MFS, and event-free survival) or a univariable Fine–Gray subdistribution hazard model (for biochemical recurrence) assuming a common treatment effect, stratified by trial. This stratification allows the baseline hazard function to vary between trials, thereby absorbing heterogeneity in event definitions, follow-up duration, and era-specific risks; treatment effects were thus estimated by comparing patients strictly with concurrent controls within the same trial stratum.
- id: ch-pmc-prostata-hormonoterapia-radioterapia-ma-4
  documento: pmc-prostata-hormonoterapia-radioterapia-ma
  texto: The NNTs to prevent one death at 10 years by adding hormone therapy to radiotherapy were negative for PSA values between 0·0 and 0·5 ng/mL, reflecting point estimates that numerically favoured PORT alone; these estimates are imprecise and should be interpreted cautiously. For patients with pre-PORT PSAs of 0·51–1·00 ng/mL and greater than 1·00 ng/mL, the NNTs were 22 and 12, respectively. Adjusted cubic splines evaluating non-linear associations between pre-PORT PSA concentration and overall survival and MFS are shown in ––. For both endpoints, the upper bounds of the 95% CI for the HR cross 1·0 (ie, ln[HR] crosses 0) for all pre-PORT PSAs.
- id: ch-pmc-prostata-hormonoterapia-radioterapia-ma-5
  documento: pmc-prostata-hormonoterapia-radioterapia-ma
  texto: To our knowledge, this is the first individual patient data meta-analysis of randomised trials evaluating the effect of adding hormone therapy to PORT in prostate cancer, with several immediately clinically relevant results. First, the addition of hormone therapy to PORT does not clearly provide relative benefits in overall survival, particularly for patients receiving radiotherapy at pre-PORT PSA values of 0·5 ng/mL or less, with a small absolute benefit. Second, the treatment effects observed from short-term and long-term hormone therapy appear more similar than different, with a possible exception in men with pre-PORT PSA levels greater than 1·6 ng/mL. Finally, although adding hormone therapy does appear to improve MFS, the magnitude of this benefit was small, implying a small effect on overall survival until pre-PORT PSA levels exceed 2·0 ng/mL.
- id: ch-pmc-prostata-talazoparib-enzalutamida-nma-1
  documento: pmc-prostata-talazoparib-enzalutamida-nma
  texto: Talazoparib plus enzalutamide (TALA + ENZA) has demonstrated antitumor activity in the phase 3 clinical trial (TALAPRO-2; NCT03395197) as first-line (1L) therapy in men with asymptomatic or mildly symptomatic metastatic castration-resistant prostate cancer (mCRPC). Although many active interventions are available, randomized controlled trials (RCTs) involving talazoparib have only been conducted to assess its efficacy and safety compared to enzalutamide. To estimate comparisons between all relevant interventions, indirect comparisons are needed.
