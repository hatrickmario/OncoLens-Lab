  texto: Most studies investigated prostate brachytherapy in the context of monotherapy. At 60 months, the estimated BC is 78%. These oncologic outcomes are typically lower than typically reported 5-year rates of 90%+ in LDR-BT and HDR-BT whole-gland series. However, most monotherapy studies in our series reported no grade 3 toxicities in their series with only one study reporting 3.3% rate of grade 3 GU toxicity. This compares favourably to other whole-gland series which have reported higher rates of grade 3+ toxicity. This compares favourably to other whole-gland series which have reported higher rates of grade 3+ toxicity. As expected there appears to be a trade-off between efficacy and toxicity with volume-based treatment intensification. Most studies did not report on detailed patterns of recurrence.
