  texto: The extraordinarily high rate of clinically occult prostate cancer in the general population compared with the 20-fold lower likelihood of death from the disease indicates that many of these cancers have low biological risk. Concordant with this observation are the many series of patients with lower-risk (i.e., Gleason grade 6 and some low-volume Gleason grade 7 tumors) prostate cancer managed by surveillance alone with high survival rates at 5 and 10 years of follow-up.[6] Data demonstrate, however, that with longer follow-up, higher-grade cancers are associated with a greater risk of prostate cancer death.[7,8]
