- id: ch-nci-mama-prevencion-hp-en-1
  documento: nci-mama-prevencion-hp-en
  texto: Besides female sex, advancing age is the biggest risk factor for breast cancer. Reproductive factors that increase exposure to endogenous estrogen, such as early menarche and late menopause, increase risk, as does the use of combination estrogen-progesterone hormones after menopause. Nulliparity and alcohol consumption also are associated with increased risk.
- id: ch-nci-mama-prevencion-hp-en-2
  documento: nci-mama-prevencion-hp-en
  texto: Breast cancer develops when a series of genetic mutations occurs.[1] Some cancer-associated mutations are inherited, but most are somatic mutations that occur as random events during a woman’s lifetime. Initially, mutations do not change the histological appearance of the tissue, but accumulated mutations will result in hyperplasia, dysplasia, carcinoma in situ, and eventually, invasive cancer.[2] The longer a woman lives, the more somatic mutations occur, and the more likely it is that these mutations will produce populations of cells that may eventually become malignancies. Estrogen and progestin hormones, whether endogenous or exogenous, stimulate growth and proliferation of breast cells, perhaps via growth factors such as transforming growth factor-alpha.[3] The stimulation by these hormones can promote the development and proliferation of breast cancer cells.
- id: ch-nci-mama-prevencion-hp-en-3
  documento: nci-mama-prevencion-hp-en
  texto: Women treated for Hodgkin lymphoma with mantle radiation by age 16 years have a subsequent risk up to 35% of developing breast cancer by age 40 years.[13-15] Higher radiation doses (median dose, 40 Gy in breast cancer cases) and treatment between the ages of 10 and 16 years are associated with higher risk.[13] Unlike the risk for secondary leukemia, the risk of treatment-related breast cancer does not abate with duration of follow-up, persisting more than 25 years after treatment.[13,15,16] In these studies, most patients (85%–100%) who developed breast cancer did so either within the field of radiation or at the margin.[13,14,16] A Dutch study examined 48 women who developed breast cancer at least 5 years after treatment for Hodgkin disease and compared them with 175 matched female Hodgkin disease patients
- id: ch-nci-mama-prevencion-hp-en-4
  documento: nci-mama-prevencion-hp-en
  texto: The above-referenced clinical trials assessed tamoxifen use at a dose of 20 mg per day taken for 5 years. Because of the toxicity associated with tamoxifen and low adherence rates, several recent studies have examined the effects of lower-dose tamoxifen. In a double-blind, placebo-controlled, randomized controlled trial, researchers at the Karolinska Institutet found that a lower dose of 2.5 mg was similarly effective in reducing breast density as was a 20 mg dose. This effect was most pronounced in premenopausal women. In addition, vasomotor symptoms declined as the dose of tamoxifen decreased. The authors postulated that decreased mammographic density may be a surrogate for response to tamoxifen therapy and that adherence may improve with less severe symptoms.[22]
- id: ch-nci-mama-prevencion-hp-en-5
  documento: nci-mama-prevencion-hp-en
  texto: Oral contraceptives have been associated with a small increased risk of breast cancer in current users that diminishes over time.[1] A well-conducted case-control study did not observe an association between breast cancer risk and oral contraceptive use for ever use, duration of use, or recent use.[2]
- id: ch-nci-mama-deteccion-hp-en-1
  documento: nci-mama-deteccion-hp-en
  texto: Mammography is the most widely used screening modality for the detection of breast cancer. There is evidence that it decreases breast cancer mortality in women aged 50 to 69 years and that it is associated with harms, including the detection of clinically insignificant cancers that pose no threat to life (overdiagnosis). The benefit of mammography for women aged 40 to 49 years is uncertain.[1,2] Randomized trials in India, Iran, and Egypt have studied the use of clinical breast examination (CBE) as a screening test . Some of these studies suggested a shift in late-stage disease; however, there is still insufficient evidence to conclude a mortality benefit.[3-8]Breast self-examination has been shown to have no mortality benefit .
- id: ch-nci-mama-deteccion-hp-en-2
  documento: nci-mama-deteccion-hp-en
  texto: Tumor detection has not been validated as a proper surrogate outcome measure for breast cancer mortality, and novel screening methods that simply increase tumor detection rates may not necessarily reduce the risk of dying from breast cancer. Nonetheless, there are numerous studies demonstrating improvements in breast tumor detection rates with modern imaging technology, with the absence of mortality data. Between 1963 and 1990, screening mammography was assessed in nine randomized trials with breast cancer-specific mortality as the primary end point, and screening mammography recommendations were largely based on the results of these trials. However, in more recent years, novel breast screening technologies have often been assessed in clinical trials and observational studies with end points that have not been validated as proper surrogate outcome measures for breast cancer mortality.[7]
- id: ch-nci-mama-deteccion-hp-en-3
  documento: nci-mama-deteccion-hp-en
  texto: Interval cancers are cancers that are diagnosed in the interval between a normal screening examination and the anticipated date of the next screening mammogram. One study found interval cancers occurred more often in women younger than 50 years, and had mucinous or lobular histology, high histological grade, high proliferative activity with relatively benign mammographic features, and no calcifications. Conversely, screen-detected cancers often had tubular histology, small size, low stage, hormone sensitivity, and a major component of DCIS.[40] Overall, interval cancers have characteristics of rapid growth,[40,41] are diagnosed at an advanced stage, and carry a poor prognosis.[42]
- id: ch-nci-mama-deteccion-hp-en-4
  documento: nci-mama-deteccion-hp-en
  texto: A well-conducted ecological study compared three pairs of neighboring European countries that were matched on similarity in health care systems and population structure, one of which had started a national screening program some years earlier than the others. The investigators found that each country had experienced a reduction in breast cancer mortality, with no difference between matched pairs that could be attributed to screening. The authors suggested that improvements in breast cancer treatment and/or health care organizations were more likely responsible for the reduction in mortality than was screening.[102]
- id: ch-nci-mama-deteccion-hp-en-5
  documento: nci-mama-deteccion-hp-en
  texto: A prospective cohort study of community-based screening found that a greater proportion of women undergoing annual screening had at least one false-positive screen after 10 years than did women undergoing biennial screening, regardless of breast density. For women with scattered fibroglandular densities, the difference was 68.9% (annual) versus 46.3% (biennial) for women in their 40s. For women aged 50 to 74 years, the difference for this density group was 49.8% (annual) versus 30.7% (biennial).[106]
- id: ch-nci-mama-hombre-hp-en-1
  documento: nci-mama-hombre-hp-en
  texto: 'Major inheritance susceptibility: Increased male breast cancer risk has been reported in families with BRCA pathogenic variants, although risk appears to be higher with inherited BRCA2 variants than with BRCA1 variants.[7,8] At age 70 years, men have an estimated cumulative breast cancer risk of 1.2% if they have BRCA1 pathogenic variants and 6.8% if they have BRCA2 pathogenic variants.[9] Other genes may be involved in male breast cancer predisposition, including pathogenic variants in the PTEN tumor suppressor gene, TP53 (Li-Fraumeni syndrome), PALB2, and in mismatch repair genes associated with Lynch syndrome (also called hereditary nonpolyposis colorectal cancer).[10-12] For more information, see the sections on High-Penetrance Breast and/or Gynecologic Cancer Susceptibility Genes in Genetics of Breast and Gynecologic Cancers, and Male Breast Cancer Screening and Surveillance for BRCA1/2 Carriers in BRCA1'
- id: ch-nci-mama-hombre-hp-en-2
  documento: nci-mama-hombre-hp-en
  texto: Infiltrating ductal cancer is the most common tumor type of breast cancer in men, while invasive lobular carcinoma is very rare.[16] Breast cancer in men is almost always hormone receptor positive. In a male breast cancer series, 99% of the tumors were estrogen receptor positive, 82% were progesterone receptor positive, 9% were HER2 positive, and 0.3% were triple negative.[16]
- id: ch-nci-mama-hombre-hp-en-3
  documento: nci-mama-hombre-hp-en
  texto: The approach to the treatment of men with breast cancer is similar to that for women. Because male breast cancer is rare, there is a lack of randomized data to support specific treatment modalities. Treatment options for men with breast cancer are described in Table 1.
- id: ch-nci-mama-hombre-hp-en-4
  documento: nci-mama-hombre-hp-en
  texto: Use our advanced clinical trial search to find NCI-supported cancer clinical trials that are now enrolling patients. The search can be narrowed by location of the trial, type of treatment, name of the drug, and other criteria. General information about clinical trials is also available.
- id: ch-nci-mama-hombre-hp-en-5
  documento: nci-mama-hombre-hp-en
  texto: The management of metastatic hormone receptor–positive male breast cancer relies on the same treatment options used in women. However, data regarding the activity of AIs with GnRH agonists and fulvestrant in men are limited to case series.[1-4] The administration of an AI in conjunction with a GnRH agonist is recommended on the basis of the adjuvant data. There are no data comparing the activity of fulvestrant alone with fulvestrant in combination with a GnRH agonist.
- id: ch-nci-mama-prevencion-pac-es-1
  documento: nci-mama-prevencion-pac-es
  texto: La prevención del cáncer consiste en las medidas que se toman para reducir la probabilidad de enfermar de cáncer. Con la prevención del cáncer, se reduce el número de casos nuevos en un grupo o población. Se espera que esto reduzca la carga del cáncer y el número de muertes causadas por esta enfermedad.
- id: ch-nci-mama-prevencion-pac-es-2
  documento: nci-mama-prevencion-pac-es
  texto: Evitar los factores de riesgo del cáncer, como fumar, tener sobrepeso y no hacer suficiente ejercicio quizá ayude a prevenir ciertos tipos de cáncer. Es posible que aumentar los factores de protección, como dejar de fumar y hacer ejercicio, también ayude a prevenir algunos tipos de cáncer. Consulte con su médico u otro profesional de atención de la salud sobre las formas de disminuir el riesgo de cáncer.
- id: ch-nci-mama-prevencion-pac-es-3
  documento: nci-mama-prevencion-pac-es
  texto: 'Mayor edad en el momento del parto del primer hijo o nunca haber tenido partos: el embarazo reduce el número de ciclos menstruales que una mujer tiene durante la vida. El tejido de la mama está expuesto a mayor estrógeno por más tiempo en las mujeres que quedan embarazadas por primera vez después de los 35 años o que nunca quedaron embarazadas.'
- id: ch-nci-mama-prevencion-pac-es-4
  documento: nci-mama-prevencion-pac-es
  texto: El tratamiento con tamoxifeno disminuye el riesgo de cáncer de mama positivo para el receptor de estrógeno (ER+) y de carcinoma ductal in situ (CDIS) en las mujeres premenopáusicas y posmenopáusicas en riesgo alto. El tamoxifeno también se usa para el tratamiento del cáncer de mama metastásico y para prevenir que el cáncer recidive después de una cirugía para extirpar tumores de mama. El tratamiento con raloxifeno también disminuye el riesgo de cáncer de mama en mujeres posmenopáusicas. Con cualquiera de estos medicamentos, la reducción del riesgo dura varios años luego de suspenderse el tratamiento. Se han observado tasas más bajas de fracturas de huesos en las pacientes que toman raloxifeno.
- id: ch-nci-mama-prevencion-pac-es-5
  documento: nci-mama-prevencion-pac-es
  texto: Los anticonceptivos hormonales contienen estrógeno o estrógeno y progestina. En algunos estudios se observó que las mujeres que consumen anticonceptivos hormonales en la actualidad o que recién empezaron a tomarlos tienen un ligero aumento de riesgo de presentar cáncer de mama. En otros estudios no se observó un aumento de riesgo de cáncer de mama en mujeres que usan anticonceptivos hormonales.
- id: ch-nci-mama-deteccion-pac-es-1
  documento: nci-mama-deteccion-pac-es
  texto: Los exámenes de detección verifican la presencia de signos de enfermedad, como el cáncer de mama, antes de que la persona tenga síntomas. El propósito de los exámenes de detección es encontrar el cáncer en un estadio más temprano cuando se puede tratar y quizá se cure. A veces, durante los exámenes de detección se encuentra cáncer que es muy pequeño o de crecimiento muy lento. Estos cánceres no suelen provocar la muerte ni enfermedad a lo largo de la vida de la persona.
- id: ch-nci-mama-deteccion-pac-es-2
  documento: nci-mama-deteccion-pac-es
  texto: El cáncer de mama tiene mayor probabilidad de presentarse a medida que la mujer envejece. Se presenta con más frecuencia en las mujeres blancas que en las mujeres negras, pero las mujeres negras mueren por cáncer de mama más a menudo que las mujeres blancas. Sin embargo, esta diferencia podría explicarse por factores como la calidad del examen de detección, el tiempo que la mujer espera antes del seguimiento de un resultado anormal, la calidad del tratamiento y el tipo de tumor.
- id: ch-nci-mama-deteccion-pac-es-3
  documento: nci-mama-deteccion-pac-es
  texto: La mamografía bidimensional sintetizada es un procedimiento en el que se usan rayos X para tomar imágenes del interior de la mama, por lo general, desde dos ángulos diferentes. Se utiliza una computadora o una película radiográfica para crear imágenes de la mama en dos dimensiones. También se llama mamografía 2D.
- id: ch-nci-mama-deteccion-pac-es-4
  documento: nci-mama-deteccion-pac-es
  texto: Mujeres mayores que, si se diagnostican con cáncer de mama mediante exámenes de detección, en general morirán por otras causas. En las mamografías de detección para aquellas mujeres que tienen entre 66 y 79 años, a veces se encuentra cáncer en un porcentaje pequeño de ellas; sin embargo, la mayoría de estos cánceres son de riesgo bajo.
- id: ch-nci-mama-deteccion-pac-es-5
  documento: nci-mama-deteccion-pac-es
  texto: Es más probable que una mamografía dé un resultado positivo falso en la primera mamografía de detección que en los exámenes posteriores. De cada 10 mujeres que se realizan un solo mamograma, 1 de ellas tendrá un resultado positivo falso. Cuantos más mamogramas se realiza la mujer, mayor es la probabilidad de tener un resultado positivo falso. Comparar un mamograma reciente con uno previo disminuye el riesgo de un resultado positivo falso.
- id: ch-nci-prostata-prevencion-hp-en-1
  documento: nci-prostata-prevencion-hp-en
  texto: 'Magnitude of Effect: In the Prostate Cancer Prevention Trial (PCPT), absolute reduction in incidence for more than 7 years with finasteride as compared with placebo was 6% (18.4% with finasteride and 24.4% with placebo); relative risk reduction (RRR) for incidence was 24.8% (95% confidence interval [CI], 18.6%–30.6%). With long-term follow-up (median, 18.4 years), prostate cancer mortality was not statistically different between men in the placebo and finasteride groups of PCPT (hazard ratio [HR], finasteride vs. placebo, 0.75; 95% CI, 0.50–1.12). Long-term follow-up (median, 16 years) of PCPT participants found that with 7 years of finasteride therapy, there was a 21.1% relative reduction in risk of prostate cancer.[1]'
