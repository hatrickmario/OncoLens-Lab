  documento: pmc-prostata-enzalutamida-abiraterona-ma
  texto: Over the past decade, multiple RWE studies have been conducted to compare the safety and effectiveness of abiraterone and enzalutamide across outcomes and geographies. While some RWE studies have favored enzalutamide in the first-line setting (––), others have favored abiraterone (), others have favored abiraterone (). Unfortunately, previous efforts to synthesize these findings via meta-analysis have been limited by insufficient data, heterogeneous patient populations, and inconsistent outcome definitions (). Unfortunately, previous efforts to synthesize these findings via meta-analysis have been limited by insufficient data, heterogeneous patient populations, and inconsistent outcome definitions (––).).
