  texto: 'Implementation and reporting of the systematic literature review (SLR) was conducted in accordance with the Preferred Reporting Items for Systematic Literature Reviews and Meta-Analyses (PRISMA) statement.,, The review protocol was developed in accordance with the PRISMA for systematic review protocols (PRISMA-P) statement,, and registered with the International Prospective Register of Systematic Reviews a priori (registration number: CRD[registro PROSPERO omitido]). Additional SLR material and methods, including the search strategy (Supplementary Table S1), Population, Intervention, Comparator, Outcome, Study design (PICOS) criteria (Supplementary Table S2), the sources searched (Supplementary Figure S1) and a list of excluded studies (Supplementary Table S3) are provided in Supplementary Appendix A.'
