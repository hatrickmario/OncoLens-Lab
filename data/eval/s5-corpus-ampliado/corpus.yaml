chunks:
- id: ch-nci-mama-hp-en-1
  documento: nci-mama-hp-en
  texto: 'Incidence and Mortality Estimated new cases and deaths from breast cancer (women only) in the United States in 2025:[ 1 ] New cases: 316,950. Deaths: 42,170. Breast cancer is the most common noncutaneous cancer in U.S. women, with an estimated 59,080 cases of female breast ductal carcinoma in situ (DCIS) and 316,950 cases of invasive disease in 2025.[ 1 ] About 42,170 women diagnosed with breast cancer—fewer than one in eight—will die of the disease. By comparison, about 60,540 American women will die of lung cancer in 2025.[ 1 ] Men account for 1% of breast cancer cases and breast cancer deaths. For more information, see the Special Populations section in Breast Cancer Screening.'
- id: ch-nci-mama-hp-en-2
  documento: nci-mama-hp-en
  texto: Post–Breast-Conserving Surgery For women who have breast-conserving surgery without radiation therapy, the risk of recurrence in the conserved breast is substantial (>20%) even in women with confirmed axillary lymph node–negative disease.[ 2 ] Although all trials assessing the role of radiation therapy in breast-conserving therapy have shown highly statistically significant reductions in local recurrence rate, no single trial has demonstrated a statistically significant reduction in mortality. However, a large meta-analysis demonstrated a significant reduction in risk of recurrence and breast cancer death.[ 3 ] Overall, evidence supports the use of whole-breast radiation therapy after breast-conserving surgery.
- id: ch-nci-mama-hp-en-3
  documento: nci-mama-hp-en
  texto: Bone-Modifying Therapy for Stages I, II, and III Breast Cancer Both bisphosphonates and denosumab have been evaluated as adjuvant therapies for early-stage breast cancer; however, their role is unclear. Compared with denosumab, the amount of evidence supporting bisphosphonates is greater, and there is evidence supporting a reduction in breast cancer mortality—an end point that is more clinically relevant. The optimal duration of bisphosphonate therapy is uncertain.
- id: ch-nci-mama-hp-en-4
  documento: nci-mama-hp-en
  texto: Treatment of Metastatic Breast Cancer Treatment of metastatic disease is palliative in intent. Goals of treatment include prolonging life and improving quality of life. The 5-year relative survival rate for women with metastatic breast cancer is 31.9%.[ 1 ] The longest median survival outcomes have been observed in patients with human epidermal growth factor receptor 2 (HER2)-positive and hormone receptor–positive metastatic breast cancer, and less favorable outcomes have been observed in patients with metastatic triple-negative breast cancer (TNBC).[ 2 ]
- id: ch-nci-mama-hp-en-5
  documento: nci-mama-hp-en
  texto: 'Margetuximab Margetuximab is an Fc-engineered anti-HER2 immunoglobulin G monoclonal antibody that targets the same epitope as trastuzumab, with similar antiproliferative effects. Compared with trastuzumab, margetuximab was designed to increase binding affinity ( in vitro ) for the activating Fc-gamma receptor and decrease binding affinity for the inhibitory Fc-gamma receptor. Evidence (margetuximab): The primary PFS analysis from the phase III SOPHIA study (NCT02492711) led to the FDA approval of margetuximab with chemotherapy in patients with HER2-positive metastatic breast cancer who have received as least two previous anti-HER2 regimens, at least one of which was for metastatic disease. The open-label SOPHIA trial randomly assigned 536 patients in the ITT population to receive either margetuximab or trastuzumab. Both groups received investigator''s choice of chemotherapy (capecitabine, eribulin, gemcitabine, or vinorelbine).'
- id: ch-nci-mama-pac-es-1
  documento: nci-mama-pac-es
  texto: Tipos de tratamiento del cáncer de mama Hay diferentes tipos de tratamiento para los pacientes de cáncer de mama. El equipo de atención del cáncer le ayudará a decidir el plan de tratamiento que suele incluir varias opciones. Se tendrán en cuenta muchos factores, como el estadio y el grado del cáncer, si están presentes determinados biomarcadores, su estado general de salud y sus preferencias personales. El plan incluirá información sobre el tipo de cáncer, además de las opciones, objetivos, posibles efectos secundarios y la duración esperada del tratamiento. Hablar con el equipo de atención del cáncer antes de comenzar el tratamiento para saber qué sucederá puede ser útil.
- id: ch-nci-mama-pac-es-2
  documento: nci-mama-pac-es
  texto: Terapia dirigida En la terapia dirigida se utilizan medicamentos u otras sustancias a fin de identificar y atacar células cancerosas específicas. El equipo médico puede recomendar pruebas de biomarcadores para ayudar a predecir su respuesta a determinados medicamentos de terapia dirigida. Para obtener más información, consulte Pruebas de biomarcadores para el tratamiento de cáncer . Se usan distintos tipos de terapia dirigida para tratar el cáncer de mama. Los anticuerpos monoclonales son proteínas del sistema inmunitario que se producen en el laboratorio para el tratamiento de muchas enfermedades, incluso el cáncer. Como tratamiento del cáncer, estos anticuerpos se adhieren a dianas específicas en las células cancerosas o en otras células que ayudan a que se formen células cancerosas.
- id: ch-nci-mama-pac-es-3
  documento: nci-mama-pac-es
  texto: 'Tratamiento del cáncer de mama en estadio temprano, localizado u operable Para obtener información de los tratamientos que se mencionan a continuación, consulte la sección Tipos de tratamiento del cáncer de mama . El tratamiento del cáncer de mama en estadio temprano , localizado u operable incluye las siguientes opciones:'
- id: ch-nci-mama-pac-es-4
  documento: nci-mama-pac-es
  texto: 'Tratamiento del cáncer de mama inflamatorio o localmente avanzado Para obtener información de los tratamientos que se mencionan a continuación, consulte la sección Tipos de tratamiento del cáncer de mama . El tratamiento del cáncer de mama inflamatorio o localmente avanzado es combinación de terapias que incluye las siguientes opciones: Cirugía ( cirugía de conservación de la mama o mastectomía total ) con disección de ganglios linfáticos . Quimioterapia , antes o después de la cirugía. Radioterapia después de la cirugía. Terapia con hormonas después de la cirugía para tumores positivos para el receptor de estrógeno o para los cuales se desconoce el estado del receptor de estrógeno. Terapia dirigida ( trastuzumab y pertuzumab ).'
- id: ch-nci-mama-pac-es-5
  documento: nci-mama-pac-es
  texto: Cirugía Mastectomía total para las mujeres con lesiones abiertas o dolorosas en la mama. Es posible que se administre radioterapia después de la cirugía. Cirugía para extirpar el cáncer que se diseminó al encéfalo o la columna vertebral . A veces se administra radioterapia después de la cirugía. Cirugía para extirpar el cáncer que se diseminó al pulmón . Cirugía para reparar o ayudar a sostener huesos débiles o fracturados. A veces se administra radioterapia después de la cirugía. Cirugía para extraer líquido que se acumuló alrededor de los pulmones o el corazón.
- id: ch-nci-prostata-hp-en-1
  documento: nci-prostata-hp-en
  texto: General Information About Prostate Cancer Go to Patient Version The median age at diagnosis of prostate cancer is 67 years.[ 1 ] Prostate cancer may be cured when localized, and it frequently responds to treatment when widespread. The rate of tumor growth varies from very slow to moderately rapid, and some patients may have prolonged survival even after the cancer has metastasized to distant sites, such as bone. The 5-year relative survival rate for men diagnosed in the United States from 2014 to 2020 with local or regional disease was greater than 99%, and the rate for distant disease was 37%; a 97% survival rate was observed for all stages combined.[ 2 ] The approach to treatment is influenced by age and coexisting medical problems.
- id: ch-nci-prostata-hp-en-2
  documento: nci-prostata-hp-en
  texto: Pelvic lymph node dissection (PLND) PLND remains the most accurate method to assess metastasis to the pelvic nodes, and laparoscopic PLND has been shown to accurately assess pelvic nodes as effectively as an open procedure.[ 16 ] The determining factor in deciding whether any type of PLND is indicated is when definitive therapy may be altered. For example, radical prostatectomy is generally reserved for men without lymph node metastasis.
- id: ch-nci-prostata-hp-en-3
  documento: nci-prostata-hp-en
  texto: 'Luteinizing hormone-releasing hormone (LH-RH) agonist therapy LH-RH agonists, such as leuprolide, goserelin, and buserelin, lower testosterone to castrate levels. Like orchiectomy and estrogens, LH-RH agonists cause impotence, hot flashes, and loss of libido. Tumor flare reactions may occur transiently but can be prevented by antiandrogens or short-term estrogens at a low dose for several weeks. There is some evidence that LH-RH agonists are associated with increased risk of cardiovascular morbidity or mortality, although the results are conflicting.[ 103 - 107 ] Evidence (LH-RH agonists and cardiovascular disease): In a population-based study within the Department of Veterans Affairs'' system, LH-RH agonists were associated with an increased risk of diabetes as well as cardiovascular disease, including coronary heart disease, myocardial infarction, sudden death, and stroke.[ 103 - 105 ] A systematic evidence'
- id: ch-nci-prostata-hp-en-4
  documento: nci-prostata-hp-en
  texto: External-beam radiation therapy (EBRT) with or without hormonal therapy EBRT is another treatment option often used with curative intent.[ 22 - 26 ] Definitive radiation therapy should be delayed 4 to 6 weeks after TURP to reduce the incidence of stricture.[ 27 ] Adjuvant hormonal therapy should be considered for patients with bulky T2b to T2c tumors.[ 28 ] The role of adjuvant hormonal therapy in patients with locally advanced disease has been analyzed by the Agency for Health Care Policy and Research (now the Agency for Healthcare Research and Quality). Most patients had more advanced disease, but patients with bulky T2b to T2c tumors were included in the studies that were re-evaluating the role of adjuvant hormonal therapy in patients with locally advanced disease.
- id: ch-nci-prostata-hp-en-5
  documento: nci-prostata-hp-en
  texto: Hormonal manipulations with chemotherapy The addition of chemotherapy has been shown in randomized trials to improve OS compared with ADT alone, with efficacy that appears to be comparable with hormonal therapy, which includes ADT plus abiraterone acetate. However, the two approaches have not been directly compared in a randomized study. The addition of docetaxel has been tested in combination with long-term hormone therapy in the first-line management of metastatic prostate cancer and has been shown to improve results more than hormone therapy alone.
- id: ch-nci-prostata-pac-es-1
  documento: nci-prostata-pac-es
  texto: Puntos importantes El cáncer de próstata es un tipo de cáncer que se forma en los tejidos de la próstata. Los signos de cáncer de próstata incluyen tener un flujo débil de orina u orinar con más frecuencia. Para diagnosticar el cáncer de próstata, se utilizan pruebas que examinan la próstata y la sangre. La biopsia se hace para diagnosticar el cáncer de próstata y determinar el grado del cáncer (puntaje de Gleason). Ciertos factores afectan el pronóstico (probabilidad de recuperación) y las opciones de tratamiento.
- id: ch-nci-prostata-pac-es-2
  documento: nci-prostata-pac-es
  texto: 'El cáncer se disemina en el cuerpo de tres maneras. El cáncer se puede diseminar a través del tejido , el sistema linfático y la sangre : Tejido. El cáncer se disemina desde donde comenzó y se extiende hacia las áreas cercanas. Sistema linfático. El cáncer se disemina desde donde comenzó y entra en el sistema linfático. El cáncer se desplaza a través de los vasos linfáticos a otras partes del cuerpo. Sangre. El cáncer se disemina desde donde comenzó y entra en la sangre. El cáncer se desplaza a través de los vasos sanguíneos a otras partes del cuerpo.'
- id: ch-nci-prostata-pac-es-3
  documento: nci-prostata-pac-es
  texto: Hay diferentes tipos de tratamientos para las personas de cáncer de próstata. Hay diferentes tipos de tratamiento disponibles para los pacientes de cáncer de próstata . Algunos tratamientos son estándar (tratamiento que se usa en la actualidad) y otros se están probando en ensayos clínicos . Un ensayo clínico de un tratamiento es un estudio de investigación con el fin de mejorar los tratamientos actuales u obtener información sobre tratamientos nuevos para los pacientes de cáncer . A veces, cuando en los ensayos clínicos se demuestra que un tratamiento nuevo es mejor que el tratamiento estándar, el tratamiento nuevo se convierte en el tratamiento estándar. Los pacientes podrían considerar la participación en un ensayo clínico. En algunos ensayos clínicos solo se aceptan pacientes que no comenzaron el tratamiento.
- id: ch-nci-prostata-pac-es-4
  documento: nci-prostata-pac-es
  texto: Terapia con bisfosfonatos Los bisfosfonatos , como el clodronato o el zoledronato , disminuyen la enfermedad en los huesos cuando el cáncer se diseminó a estos. Los hombres que recibieron antiandrógenos o se sometieron a una orquiectomía tienen un riesgo más alto de pérdida ósea. En estos hombres, los bisfosfonatos disminuyen el riesgo de fractura ósea. El uso de bisfosfonatos para prevenir o retrasar las metástasis en el hueso se estudia en ensayos clínicos.
- id: ch-nci-prostata-pac-es-5
  documento: nci-prostata-pac-es
  texto: Los pacientes pueden ingresar en los ensayos clínicos antes, durante o después de comenzar el tratamiento para el cáncer. En algunos ensayos clínicos solo se aceptan a pacientes que aún no recibieron tratamiento. En otros ensayos se prueban terapias en pacientes de cáncer que no mejoraron. También hay ensayos clínicos en los que se prueban formas nuevas de impedir que el cáncer recidive (vuelva) o de disminuir los efectos secundarios del tratamiento del cáncer. Los ensayos clínicos se realizan en muchas partes del país. La información en inglés sobre los ensayos clínicos patrocinados por el Instituto Nacional del Cáncer (NCI) se encuentra en la página de Internet clinical trials search . Para obtener información en inglés sobre ensayos clínicos patrocinados por otras organizaciones, consulte el portal de Internet ClinicalTrials.gov .
- id: ch-pmc-mama-cdk46-guia-1
  documento: pmc-mama-cdk46-guia
  texto: Resumen Simple SummaryBreast cancer is one of the most common cancers, and some patients remain at risk of recurrence even after surgery and hormone therapy. Treatment with cyclin-dependent kinase 4/6 inhibitors, when added to standard hormone treatment, can further reduce this risk. Clinical studies with two of these treatments, abemaciclib and ribociclib, have shown improved outcomes for patients at higher risk of recurrence. As more patients may soon be eligible for these treatments, coordinated care among medical oncologists, surgeons, nurses, and pharmacists is essential to select appropriate patients, monitor for side effects, and support treatment adherence. This article offers expert recommendations on integrating cyclin-dependent kinase 4/6 inhibitors into routine practice, including patient selection, side effect management, and consideration of individual factors such as other medications and quality of life.
- id: ch-pmc-mama-cdk46-guia-2
  documento: pmc-mama-cdk46-guia
  texto: Resumen AbstractCyclin-dependent kinase (CDK)4/6 inhibitors have become a key component of adjuvant treatment for patients with hormone receptor-positive (HR+), human epidermal growth factor receptor 2-negative (HER2−) early breast cancer who are at high risk of recurrence. The addition of abemaciclib and ribociclib to standard endocrine therapy has demonstrated clinically meaningful improvements in invasive disease-free survival, supported by the monarchE and NATALEE trials, respectively. With expansion of patient eligibility for CDK4/6 inhibitors, multidisciplinary coordination among medical oncologists, surgeons, nurses, pharmacists, and other health care providers is critical to optimizing patient identification, monitoring, and management of adverse events. This expert guidance document provides practical recommendations for implementing adjuvant CDK4/6 inhibitor therapy in routine clinical practice, incorporating insights from multiple specialties and with patient advocacy representation.
- id: ch-pmc-mama-tamoxifeno-eca-1
  documento: pmc-mama-tamoxifeno-eca
  texto: Resumen AbstractBackgroundPatients with estrogen receptor–positive breast cancer have a substantial late risk of distant recurrence, but the long-term subtype-specific tamoxifen benefit remains poorly understood.MethodsA secondary analysis of the Stockholm Tamoxifen randomized trials (1976-1997, n = 3930) with 20-year follow-up was conducted. Formalin-fixed, paraffin-embedded blocks were available for 2250 patients. A total of 952 patients with estrogen receptor–positive and HER2-negative tumors, classified as luminal A (n = 688) and luminal B (n = 264) using Agilent microarrays, were analyzed. Patients were randomly assigned to at least 2 years of tamoxifen therapy or no endocrine therapy.
- id: ch-pmc-mama-tamoxifeno-eca-2
  documento: pmc-mama-tamoxifeno-eca
  texto: Introduction IntroductionPatients with estrogen receptor–positive breast cancer have a substantial long-term risk of distant recurrence, even after several decades, with approximately half of all events occurring more than 5 years after diagnosis. 1-6 Adjuvant endocrine therapy, commonly tamoxifen, is the standard treatment for estrogen receptor–positive breast cancer and is administered to virtually all patients with estrogen receptor–positive tumors. 7 In addition to estrogen receptor positivity, treatment decisions are based on the patient’s clinical risk during the first 5-10 years after diagnosis, as estimated from the clinically used tumor characteristics, including tumor size, histological grade, lymph node status, and progesterone receptor status. 8-11 Breast cancer is a heterogeneous disease, and molecular subtyping has identified at least 5 distinct subtypes that inform treatment strategies in clinical practice.
- id: ch-pmc-mama-tamoxifeno-eca-3
  documento: pmc-mama-tamoxifeno-eca
  texto: Methods MethodsThe STO trialsThe STO trials enrolled patients with invasive breast cancer between 1976 and 1997, and premenopausal and postmenopausal patients at low and high clinical risk were included. 17-21 In total the trials included 3930 patients; formalin-fixed, paraffin-embedded tumor blocks were available for 2250 patients. Of the patients with available formalin-fixed, paraffin-embedded blocks, 1878 had annotated Agilent gene-expression profiling, and 1359 patients had estrogen receptor–positive and HER2-negative tumors. Of these patients, 1218 had tumors that were classified as luminal A or B subtype, and 952 of these patients were randomly assigned to tamoxifen or control, excluding patients who only received goserelin or were not randomly assigned to endocrine treatment (see Figure 1). At inclusion, patients were stratified by lymph node status and tumor size.
- id: ch-pmc-mama-tamoxifeno-eca-4
  documento: pmc-mama-tamoxifeno-eca
  texto: Results ResultsThe study included 952 estrogen receptor–positive and HER2-negative breast cancer patients with luminal A or luminal B tumors from the STO trials (Figure 1). Of the 952 patients in the cohort, 458 (48%) received tamoxifen therapy alone, 82 (9%) received tamoxifen plus goserelin, and 412 (43%) received no endocrine therapy (control). Patients receiving tamoxifen alone included 79 (8%) premenopausal patients and 379 (40%) postmenopausal patients. Patients receiving tamoxifen plus goserelin included 82 (9%) premenopausal patients and 0 (0%) postmenopausal patients. The control group included 82 (9%) premenopausal patients and 330 (35%) postmenopausal patients. Tumors were classified as luminal A in 688 (72%) patients and luminal B in 264 (28%) patients.
- id: ch-pmc-mama-tamoxifeno-eca-5
  documento: pmc-mama-tamoxifeno-eca
  texto: Discussion DiscussionThis secondary analysis of the STO randomized trials with 20 years of follow-up demonstrates improvements in distant recurrence-free interval from tamoxifen therapy for patients with luminal A and luminal B tumor subtypes. However, the timing of benefit differed by subtype. An early sustained benefit was seen in patients with luminal B tumors, whereas in patients with luminal A tumors the early benefit was modest but increased over time. Despite tamoxifen therapy, patients had a substantial risk of distant recurrence that persisted well beyond 10 years after diagnosis, underscoring the need for long-term follow-up to assess late distant recurrence risk and tamoxifen benefit.The importance of tamoxifen therapy for patients with estrogen receptor–positive disease is well established; however, little is known about the long-term, subtype-specific benefit.
- id: ch-pmc-mama-antraciclinas-rs-1
  documento: pmc-mama-antraciclinas-rs
  texto: 'Resumen Background: Anthracyclines have historically remained a cornerstone of treatment for early HER2-positive breast cancer. However, the emergence of dual HER2 blockade, antibody–drug conjugates, and response-adapted treatment strategies has changed the clinical context in which anthracycline use is considered. Whether anthracyclines continue to provide sufficient oncologic benefit to justify their additional cardiovascular toxicity remains uncertain. Objectives: This study aims to evaluate the contemporary role of anthracyclines in early HER2-positive breast cancer by synthesizing direct comparative evidence and contextual evidence from prospective de-escalation studies. Design: It involves a systematic review with narrative synthesis. Data Sources and Methods: PubMed, the Web of Science, and CENTRAL were searched for prospective studies published from January 2000 to 31 May 2026.'
- id: ch-pmc-prostata-mhsp-nma-1
  documento: pmc-prostata-mhsp-nma
  texto: Resumen AbstractPurpose:The therapeutic landscape of metastatic hormone-sensitive prostate cancer (mHSPC) has expanded rapidly with the introduction of intensified combination regimens. The aim of this updated systematic review and network meta-analysis was to compare the efficacy and safety of first-line systemic combination therapies for mHSPC.Materials and Methods:We systematically searched MEDLINE, Embase, and Web of Science in March 2026 to identify randomized controlled trials evaluating first-line combination therapies for mHSPC. The outcomes of interest were progression-free survival and/or overall survival (OS) and severe adverse events. We conducted frequentist random-effects network meta-analyses, specifically limited to randomized controlled trials involving the all-comer population, and a systematic review for targeted and biomarker-driven strategies.
- id: ch-pmc-prostata-mhsp-nma-2
  documento: pmc-prostata-mhsp-nma
  texto: DISCUSSION DISCUSSIONThis study provides a comprehensive evaluation of the rapidly evolving mHSPC treatment landscape by integrating an updated NMA of all-comer populations with an SR of the latest biomarker-driven and targeted strategies.In the NMA for the all-comer population, docetaxel + ARPI + ADT demonstrated a clinically relevant effect size for rPFS compared with ARPI + ADT, although it did not reach statistical significance, with moderate CoE. PARPi + ARPI + ADT showed a similar trend, but with low certainty. For OS, no regimen significantly improved outcomes compared with ARPI + ADT. However, in the high-volume subgroup, docetaxel + ARPI + ADT demonstrated both clinically and statistically significant benefit with high certainty.
- id: ch-pmc-prostata-mhsp-nma-3
  documento: pmc-prostata-mhsp-nma
  texto: CONCLUSIONS CONCLUSIONSIn this comprehensive NMA and SR, the combinations of docetaxel + ARPI + ADT and PARPi + ARPI + ADT showed clinically relevant but not statistically significant improvements in PFS for mHSPC. However, none of these intensified regimens demonstrated a statistically significant OS benefit over ARPI plus ADT in the all-comer population, although docetaxel + ARPI + ADT significantly improved OS in the high-volume subgroup. While our NMA did not identify a statistically significant increase in severe AEs for these triplets compared with ARPI + ADT, the low CoE and distinct toxicity profiles necessitate a cautious, patient-centered approach. These findings support a more selective, biomarker-driven strategy for treatment intensification, balancing potential oncological gains against toxicity.
- id: ch-pmc-prostata-mhsp-nma-4
  documento: pmc-prostata-mhsp-nma
  texto: Cuerpo The therapeutic landscape for metastatic hormone-sensitive prostate cancer (mHSPC) has expanded substantially over the past decade. Current international guidelines recommend treatment intensification with androgen deprivation therapy (ADT) combined with an androgen receptor pathway inhibitor (ARPI), with or without docetaxel, as the standard of care for most patients. 1-3 More recently, the AMPLITUDE, PSMAddition, and CAPItello-281 trials have introduced additional layers of complexity by demonstrating that incorporation of emerging agents—such as poly(ADP-ribose) polymerase inhibitors (PARPis), prostate-specific membrane antigen (PSMA)–directed theranostic therapies, and AKT inhibitors—may further improve clinically relevant outcomes. 4-6 However, the relative magnitude of benefit among these increasingly diverse treatment strategies remains uncertain.
- id: ch-pmc-prostata-volumen-nma-1
  documento: pmc-prostata-volumen-nma
  texto: Resumen AbstractContextWith new treatment strategies approved in metastatic hormone-sensitive prostate cancer (mHSPC), heterogeneity across trials hinders the physicians’ choice for first-line treatment.ObjectiveWe conducted a systematic review and network meta-analysis to assess the efficacy of currently approved treatments for mHSPC stratifying patients according to their disease burden (high- vs. low-volume as per CHAARTED criteria) and onset of metastatic disease (synchronous vs. metachronous).InterventionEleven randomized controlled trials (RCTs) published until October 30, 2024 were included. Treatment regimens were grouped as triplets for combinations of docetaxel, androgen receptor pathway inhibitors (ARPIs) and androgen-deprivation therapy (ADT), separate doublets for docetaxel plus ADT, ARPI plus ADT, or monotherapy for ADT alone.Outcome Measurements and Statistical AnalysisOverall survival (OS) and radiographic progression-free survival (rPFS) outcomes were collected.
- id: ch-pmc-prostata-volumen-nma-2
  documento: pmc-prostata-volumen-nma
  texto: Introduction IntroductionOver the last decade, new evidence has dramatically changed the therapeutic landscape for patients with advanced prostate cancer. In 2015, two randomized phase III studies, CHAARTED and STAMPEDE (arm C), marked a paradigm shift as they reported a survival benefit of adding docetaxel to androgen deprivation therapy (ADT), which was longstanding standard of care in metastatic hormone-sensitive prostate cancer (mHSPC). 1 , 2 Upfront doublet treatment improved both progression-free (PFS) and overall survival (OS). 3 , 4 Shortly after, second-generation androgen receptor pathway inhibitors (ARPIs) were assessed in combination with ADT in the mHSPC setting. Abiraterone acetate first demonstrated a survival benefit in combination with ADT over ADT alone in the LATITUDE and STAMPEDE (arm G) trials.
- id: ch-pmc-prostata-volumen-nma-3
  documento: pmc-prostata-volumen-nma
  texto: Materials and methods Materials and methodsData retrieval strategiesWe conducted a systematic review and network meta-analysis adhering to the Preferred Reporting Items for Systematic Reviews guidelines (PRISMA) and National Institute for Clinical Excellence (NICE) Decision Support Unit guidelines. 21 , 22 (Figure S1). Embase, PubMed, and Web of Sciences databases were searched for randomized controlled trials (RCTs) on first-line systemic treatment of mHSPC (Table S1). Abstracts from scientific conferences, including the American Society of Clinical Oncology (ASCO), the ASCO Genitourinary Cancers Symposium (ASCO-GU), and the European Society for Medical Oncology (ESMO), were also screened to identify relevant results not yet fully published. Publications available up to October 30, 2024, were analyzed.
- id: ch-pmc-prostata-volumen-nma-4
  documento: pmc-prostata-volumen-nma
  texto: Results ResultsSearch results and characteristics of the included studiesThe electronic search identified 940 references from the aforementioned databases and conference abstracts. After duplicate removal, 871 manuscripts were screened overall, with 11 studies fulfilling the inclusion criteria and included in the network meta-analysis at the end of the selection process (Figure S2).All included studies were phase III RCTs (Table 1).
- id: ch-pmc-prostata-volumen-nma-5
  documento: pmc-prostata-volumen-nma
  texto: Discussion DiscussionDespite recent advances in the treatment of mHSPC, which were mainly derived from intensification of upfront combination treatment at onset of metastatic disease, questions remain regarding the optimal management in order to achieve best possible outcomes with the lowest possible treatment burden. Considering the lack of direct comparisons of the newest emerging combinations, for example, triplet regimens versus doublets with ADT plus ARPI, the aim of this project was to investigate the efficacy of all prospectively assessed systemic treatment options in the mHSPC setting, which were grouped as 4 different treatment strategies and stratified by uniformly available clinical characteristics, that is, disease volume (high vs. low) and onset of metastatic disease (synchronous vs. metachronous).
- id: ch-pmc-prostata-darolutamida-rs-1
  documento: pmc-prostata-darolutamida-rs
  texto: Resumen AbstractBackgroundDarolutamide is the next-generation androgen receptor inhibitor approved for the treatment of advanced prostate cancer, including non-metastatic castration-resistant prostate cancer (nmCRPC) and metastatic hormone-sensitive prostate cancer (mHSPC). However, the efficacy and safety of darolutamide are nonetheless worthy of further clinical studies. The objective of this meta-analysis was to evaluate the overall survival, metastasis-free survival and various specific adverse events of darolutamide combination therapy in patients with mHSPC or nmCRPC.MethodsThis meta-analysis was performed on PubMed, EMBASE, Web of Science, ClinicalTrials.gov, and the Cochrane Library for English-language articles to collect randomized clinical trials of darolutamide combination therapy in mHSPC and nmCRPC from the start of the database to 15 January 2026. The primary efficacy outcomes were overall survival and metastasis-free survival.
- id: ch-pmc-prostata-darolutamida-rs-2
  documento: pmc-prostata-darolutamida-rs
  texto: Introduction 1.IntroductionAdvanced prostate cancer, with androgen deprivation therapy (ADT) by medical or surgical castration as the mainstay of treatment, is categorized into non-metastatic castration-resistant prostate cancer (nmCRPC), metastatic hormone-sensitive prostate cancer (mHSPC), and metastatic castration-resistant prostate cancer (mCRPC) based on sensitivity to ADT and the occurrence of distant metastasis (Scher et al., 2016). Although patients initially robustly respond to first-line ADT, nearly all with advanced prostate cancer eventually progress to lethal CRPC (Luo et al., 2018). Among them, those in whom traditional imaging examinations did not detect metastatic lesions were classified as having nmCRPC, with the median overall survival period of nearly 5 years (Heiss et al., 2024).
- id: ch-pmc-prostata-darolutamida-rs-3
  documento: pmc-prostata-darolutamida-rs
  texto: Results 3.Results3.1.Literature search process and resultsOur initial search identified 1,525 records, and after removing duplicates, 874 remained (Figure 1). A total of 769 articles were excluded after screening the titles and abstracts, and a full-text review was performed for 105 articles. Based on the selection criteria, we identified eight articles from three independent phase III trials (Fizazi et al., 2019; Smith et al., 2022; Saad et al., 2024; Hussain et al., 2023; Shore et al., 2024; Fizazi et al., 2020; Uemura et al., 2021; Shore et al., 2022).
- id: ch-pmc-prostata-darolutamida-rs-4
  documento: pmc-prostata-darolutamida-rs
  texto: Conclusion 5.ConclusionIn conclusion, our systematic review and meta-analysis have shown that the addition of darolutamide in ADT with/without docetaxel significantly prolongs survival compared with placebo in both patients with mHSPC and nmCRPC. Simultaneously, the consistent efficacy across subgroups highlights the promising potential of darolutamide for patients with different clinical and biological characteristics. Due to its efficacy and safety, darolutamide can be considered as an alternative option.
- id: ch-pmc-prostata-darolutamida-rs-5
  documento: pmc-prostata-darolutamida-rs
