- id: ch-nci-prostata-tratamiento-pac-en-4
  documento: nci-prostata-tratamiento-pac-en
  texto: Internal radiation therapy uses a radioactive substance sealed in needles, seeds, wires, or catheters that are placed directly into or near the cancer. In early-stage prostate cancer, the radioactive seeds are placed in the prostate using needles that are inserted through the skin between the scrotum and rectum. The placement of the radioactive seeds in the prostate is guided by images from transrectal ultrasound or computed tomography (CT). The needles are removed after the radioactive seeds are placed in the prostate.
- id: ch-nci-prostata-tratamiento-pac-en-5
  documento: nci-prostata-tratamiento-pac-en
  texto: A cancer treatment that uses a drug and a certain type of laser light to kill cancer cells. A drug that is not active until it is exposed to light is injected into a vein. The drug collects more in cancer cells than in normal cells. Fiberoptic tubes are then used to carry the laser light to the cancer cells, where the drug becomes active and kills the cells. Photodynamic therapy causes little damage to healthy tissue. It is used mainly to treat tumors on or just under the skin or in the lining of internal organs.
- id: ch-nci-prostata-prevencion-pac-en-1
  documento: nci-prostata-prevencion-pac-en
  texto: Some risk factors for cancer can be avoided, but many cannot. For example, both smoking and inheriting certain genes are risk factors for some types of cancer, but only smoking can be avoided. Regular exercise and a healthy diet may be protective factors for some types of cancer. Avoiding risk factors and increasing protective factors may lower your risk but it does not mean that you will not get cancer.
- id: ch-nci-prostata-prevencion-pac-en-2
  documento: nci-prostata-prevencion-pac-en
  texto: As men age, the prostate may get bigger. A bigger prostate may block the flow of urine from the bladder and cause problems with sexual function. This condition is called benign prostatic hyperplasia (BPH). BPH is not cancer, but surgery may be needed to correct it. The symptoms of BPH or of other problems in the prostate may be like symptoms of prostate cancer.
- id: ch-nci-prostata-prevencion-pac-en-3
  documento: nci-prostata-prevencion-pac-en
  texto: Folate is a kind of vitamin B that occurs naturally in some foods, such as green vegetables, beans, and orange juice. Folic acid is a man-made form of folate that is found in vitamin supplements and fortified foods, such as whole-grain breads and cereals. A 10-year study showed that the risk of prostate cancer was increased in men who took 1 milligram (mg) supplements of folic acid. However, the risk of prostate cancer was lower in men who had enough folate in their diets.
- id: ch-nci-prostata-prevencion-pac-en-4
  documento: nci-prostata-prevencion-pac-en
  texto: The Prostate Cancer Prevention Trial (PCPT) studied whether the drug finasteride can prevent prostate cancer in healthy men 55 years of age and older. This prevention study showed there were fewer prostate cancers in the group of men that took finasteride compared with the group of men that did not. The number of deaths from prostate cancer was the same in both groups. Men who took finasteride reported more side effects compared with the group of men that did not, including erectile dysfunction, loss of desire for sex, and enlarged breasts. In the PCPT, the men who took finasteride who did have prostate cancer had more aggressive tumors, but a follow-up analysis of the PCPT found that these men did not have more aggressive tumors.
- id: ch-nci-prostata-prevencion-pac-en-5
  documento: nci-prostata-prevencion-pac-en
  texto: The Selenium and Vitamin E Cancer Prevention Trial (SELECT) studied whether taking vitamin E and selenium (a mineral) will prevent prostate cancer. The selenium and vitamin E were taken separately or together by healthy men 55 years of age and older (50 years of age and older for African American men). The study showed that taking selenium alone or selenium and vitamin E together did not decrease the risk of prostate cancer.
- id: ch-nci-prostata-deteccion-pac-en-1
  documento: nci-prostata-deteccion-pac-en
  texto: Screening is looking for cancer before a person has any symptoms. This can help find cancer at an early stage. When abnormal tissue or cancer is found early, it may be easier to treat. By the time symptoms appear, cancer may have begun to spread.
- id: ch-nci-prostata-deteccion-pac-en-2
  documento: nci-prostata-deteccion-pac-en
  texto: The prostate is a gland in the male reproductive system. It lies just below the bladder (the organ that collects and empties urine) and in front of the rectum (the lower part of the intestine). It is about the size of a walnut and surrounds part of the urethra (the tube that empties urine from the bladder). The prostate gland makes fluid that is part of the semen.
- id: ch-nci-prostata-deteccion-pac-en-3
  documento: nci-prostata-deteccion-pac-en
  texto: Prostate cancer is most common in older men. In the United States, about one out of every eight men will be diagnosed with prostate cancer. Most men diagnosed with this disease do not die from it. Prostate cancer causes more deaths in men than any other cancer except lung cancer. Prostate cancer occurs more often in Black men than in White men. Black men with prostate cancer are more likely to die from the disease than White men with prostate cancer.
- id: ch-nci-prostata-deteccion-pac-en-4
  documento: nci-prostata-deteccion-pac-en
  texto: If a man had a high PSA level and a biopsy of the prostate did not show cancer and the PSA level remains high after the biopsy, a PCA3 RNA test may be done. This test measures the amount of PCA3 RNA in the urine after a DRE. If the PCA3 RNA level is higher than normal, another prostate biopsy may be needed to help diagnose prostate cancer.
- id: ch-nci-prostata-deteccion-pac-en-5
  documento: nci-prostata-deteccion-pac-en
  texto: Some prostate cancers never cause symptoms or become life-threatening, but if found by a screening test, the cancer may be treated. Finding these cancers is called overdiagnosis. It is not known if treatment of these cancers would help you live longer than if no treatment were given.
- id: ch-nci-prostata-prevencion-pac-es-1
  documento: nci-prostata-prevencion-pac-es
  texto: La prevención del cáncer consiste en las medidas que se toman para reducir la probabilidad de enfermar de cáncer. Con la prevención del cáncer, se reduce el número de casos nuevos en un grupo o población. Se espera que esto reduzca el número de muertes causadas por el cáncer.
- id: ch-nci-prostata-prevencion-pac-es-2
  documento: nci-prostata-prevencion-pac-es
  texto: La próstata es una glándula en el aparato reproductor masculino. La próstata está justo debajo de la vejiga (el órgano que recoge y vacía la orina) y en frente del recto (la parte inferior del intestino). Es casi del tamaño de una nuez y rodea parte de la uretra (el tubo que vacía la orina de la vejiga). La glándula prostática produce un líquido que forma parte del semen.
- id: ch-nci-prostata-prevencion-pac-es-3
  documento: nci-prostata-prevencion-pac-es
  texto: En el Selenium and Vitamin E Cancer Prevention Trial (SELECT) (Ensayo de prevención del cáncer con selenio y vitamina E), se encontró que tomar vitamina E sola aumenta el riesgo de cáncer de próstata. El riesgo se mantuvo incluso después de que los hombres dejaran de tomar vitamina E.
- id: ch-nci-prostata-prevencion-pac-es-4
  documento: nci-prostata-prevencion-pac-es
  texto: En el Prostate Cancer Prevention Trial (PCPT) (Ensayo de prevención del cáncer de próstata), se estudió si el medicamento finasterida puede prevenir el cáncer de próstata en hombres sanos de 55 años o más. En este estudio de prevención, se mostró que hubo menos casos de cáncer de próstata en el grupo de hombres que tomó finasterida, en comparación con el grupo de hombres que no la tomó. El número de muertes por cáncer de próstata fue el mismo en ambos grupos. Los hombres que tomaron finasterida informaron sobre más efectos secundarios, en comparación con el grupo de hombres que no lo hicieron, incluso disfunción eréctil, pérdida del deseo sexual y mamas agrandadas.
- id: ch-nci-prostata-prevencion-pac-es-5
  documento: nci-prostata-prevencion-pac-es
  texto: No se ha probado que el consumo regular de los multivitamínicos aumente el riesgo de cáncer de próstata temprano o localizado. Sin embargo, en un estudio grande se mostró un aumento de riesgo de cáncer de próstata avanzado en los hombres que tomaron multivitamínicos más de siete veces por semana.
- id: ch-nci-prostata-deteccion-pac-es-1
  documento: nci-prostata-deteccion-pac-es
  texto: Los exámenes de detección verifican la presencia del cáncer antes de que la persona tenga síntomas. Es posible que esto ayude a encontrar el cáncer en un estadio temprano. Si se descubre temprano el tejido anormal o el cáncer, es más fácil tratarlos. Cuando aparecen los síntomas, quizás el cáncer se haya empezado a diseminar.
- id: ch-nci-prostata-deteccion-pac-es-2
  documento: nci-prostata-deteccion-pac-es
  texto: A medida que los hombres envejecen, la próstata se suele agrandar. Una próstata más grande puede obstruir el flujo de orina de la vejiga y causar problemas del funcionamiento sexual. Esta afección se conoce como hiperplasia prostática benigna (HPB). La HPB no es cáncer, pero es posible que se necesite una cirugía para corregirla. Los síntomas de la HPB u otros problemas de la próstata podrían ser similares a los del cáncer de próstata.
- id: ch-nci-prostata-deteccion-pac-es-3
  documento: nci-prostata-deteccion-pac-es
  texto: El examen digital del recto (EDR) es un examen del recto. El médico o enfermero introducen un dedo cubierto por un guante lubricado en la parte inferior del recto para palpar la próstata y detectar si hay masas o cualquier otra cosa que parezca extraña, como el agrandamiento de la próstata.
- id: ch-nci-prostata-deteccion-pac-es-4
  documento: nci-prostata-deteccion-pac-es
  texto: A veces es difícil decidir sobre los exámenes de detección. No todos los exámenes de detección son útiles y la mayoría presenta riesgos. Antes de hacerse las pruebas, converse con su médico acerca de los exámenes de detección. Es importante que conozca los riesgos de cada prueba y sepa si está comprobado que reduce el riesgo de morir de cáncer.
- id: ch-nci-prostata-deteccion-pac-es-5
  documento: nci-prostata-deteccion-pac-es
  texto: Los resultados del examen de detección podrían ser normales, aunque haya cáncer de próstata. Un hombre que recibe un resultado negativo falso de una prueba (que muestra que no hay cáncer cuando en realidad lo hay) podría tardar en ir al médico aunque tenga síntomas.
- id: ch-pmc-mama-pembrolizumab-er-eca-1
  documento: pmc-mama-pembrolizumab-er-eca
  texto: Addition of pembrolizumab to neoadjuvant chemotherapy followed by adjuvant pembrolizumab improved outcomes in patients with high-risk, early-stage, triple-negative breast cancer. However, whether the addition of neoadjuvant pembrolizumab to chemotherapy would improve outcomes in high-risk, early-stage, estrogen receptor-positive/human epidermal growth factor receptor 2-negative (ER+/HER2−) breast cancer remains unclear. We conducted a double-blind, placebo-controlled phase 3 study (KEYNOTE-756) in which patients with previously untreated ER+/HER2− grade 3 high-risk invasive breast cancer (T1c-2 (≥2 cm), cN1–2 or T3–4, cN0–2) were randomly assigned (1:1) to neoadjuvant pembrolizumab 200 mg or placebo Q3W given with paclitaxel QW for 12 weeks, followed by four cycles of doxorubicin or epirubicin plus cyclophosphamide Q2W or Q3W. After surgery (with/without adjuvant radiation therapy), patients received adjuvant pembrolizumab or placebo for nine cycles plus adjuvant endocrine therapy.
- id: ch-pmc-mama-pembrolizumab-er-eca-2
  documento: pmc-mama-pembrolizumab-er-eca
  texto: At the first interim analysis (data cutoff, 25 May 2023; median duration of follow-up, 33.2 (range = 9.7–51.8) months), 1,275 patients had received the first neoadjuvant treatment, 1,210 patients had started the second neoadjuvant treatment, 1,245 patients had documented surgery and 1,002 patients had started adjuvant treatment (Fig. ). Median duration of treatment in the neoadjuvant phase was 4.9 months (range = 0.0–6.9 months) in the pembrolizumab–chemotherapy arm and 4.9 months (range = 0.0–7.8 months) in the placebo–chemotherapy arm (Extended Data Table ). Median duration of treatment in the neoadjuvant phase was 4.9 months (range = 0.0–6.9 months) in the pembrolizumab–chemotherapy arm and 4.9 months (range = 0.0–7.8 months) in the placebo–chemotherapy arm (Extended Data Table ). Both groups received a similar median number of chemotherapy cycles.).
