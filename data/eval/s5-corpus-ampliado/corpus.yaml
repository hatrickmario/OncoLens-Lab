- id: ch-pmc-prostata-eventos-cardiovasculares-nma-5
  documento: pmc-prostata-eventos-cardiovasculares-nma
  texto: 'We found that adding enzalutamide to ADT increases the risk of IHD by 138% and hypertension by 108% compared to SOC. Due to data availability limitations, our analysis of IHD was limited to only apalutamide and enzalutamide. Within these limitations, our findings indicated that enzalutamide was almost equivalent to apalutamide in terms of IHD risk. Regarding myocardial infarction (MI), a condition often considered a severe manifestation of IHD, enzalutamide did not show a significant increase in MI (RR: 1.53, 95% CI: 0.64–3.62), but had a higher likelihood at SUCRA ranking for MI (44%) compared to abiraterone (76%) (Supplementary Table 5). The impact of enzalutamide on the cardiovascular system may be attributed to its role in blocking androgen activity, which could explain its cardiovascular effects.'
- id: ch-pmc-prostata-cirugia-citorreductora-ma-1
  documento: pmc-prostata-cirugia-citorreductora-ma
  texto: The management of oligometastatic prostate cancer, defined by its few metastatic sites, poses distinct clinical dilemmas. Debates persist regarding the most effective treatment approach, with both cytoreductive surgery and radiotherapy being key contenders. The purpose of this research is to thoroughly evaluate and compare the effectiveness of these two treatments in managing patients with oligometastatic prostate cancer.
- id: ch-pmc-prostata-cirugia-citorreductora-ma-2
  documento: pmc-prostata-cirugia-citorreductora-ma
  texto: This study contributes to the growing body of knowledge surrounding the management of oligometastatic prostate cancer, shedding light on the practical effectiveness and potential benefits of cytoreductive surgery and radiotherapy. The insights gained from this research are poised to inform clinical decision-making and guide the development of personalized treatment strategies for patients at this intermediate stage of disease progression. Furthermore, the findings may underscore the importance of considering real-world evidence in shaping treatment guidelines and optimizing patient outcomes in the context of oligometastatic prostate cancer.
