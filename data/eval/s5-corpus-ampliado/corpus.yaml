  texto: In this comparative effectiveness study using data from 2 randomized clinical trials involving 200 patients in TheraP and 831 patients in VISION, differences in the observed effect on OS was primarily associated with the choice of comparator treatments (cabazitaxel in TheraP vs protocol-permitted treatment [eg, hormonal treatments such as abiraterone and enzalutamide, bisphosphonates or denosumab] without cabazitaxel) in VISION.
- id: ch-pmc-prostata-lu-psma-comparadores-2
