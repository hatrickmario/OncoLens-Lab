  documento: pmc-mama-linfocitos-her2-secundario
  texto: The prognostic role of TILs in early ERBB2-positive breast cancer is supported by growing evidence.,, In the neoadjuvant setting, high levels of TILs are associated with increased rates of pathological complete responses and reduced risk of relapse.,,,,,,,,,, In the adjuvant setting, TIL density is associated with improved outcomes, though previous studies have focused on surrogate end points rather than OS.,,,, Recently, a large individual data meta-analysis by the Early Breast Cancer Trialists’ Collaborative Group, including 4168 patients from 5 randomized pivotal trials of adjuvant trastuzumab with chemotherapy vs chemotherapy alone, confirmed the important prognostic role of TILs in terms of time to first recurrence, but no OS data were reported.
- id: ch-pmc-prostata-niraparib-abiraterona-eca-1
  documento: pmc-prostata-niraparib-abiraterona-eca
  texto: Inhibition of poly(ADP-ribose) polymerase (PARP) after relapse on hormone therapy is well established for patients with prostate cancer with homologous recombination repair (HRR) gene alterations, but resistance often develops. We hypothesized that PARP inhibition within 6 months of starting androgen deprivation therapy for metastatic castration-sensitive prostate cancer (mCSPC) could be effective and improve radiographic progression-free survival when added to standard-of-care treatments. The double-blind AMPLITUDE trial evaluated combining niraparib, a potent and specific PARP inhibitor, with abiraterone acetate and prednisone (AAP) versus placebo and AAP in mCSPC with HRR gene alterations. Patients (n = 696) were randomized in a 1:1 ratio (348 per group). Median age was 68 years; 56% had BRCA1 or BRCA2 alterations; 78% had high-volume metastases; and 16% had received docetaxel.
- id: ch-pmc-prostata-niraparib-abiraterona-eca-2
  documento: pmc-prostata-niraparib-abiraterona-eca
  texto: 'In the first hierarchical test for efficacy, in the BRCA subgroup, treatment with niraparib and abiraterone resulted in significant improvement in the primary endpoint of investigator-assessed radiographic progression-free survival compared to abiraterone (hazard ratio = 0.52 (95% confidence interval: 0.37–0.72); P < 0.0001) (Fig. ). Median radiographic progression-free survival in the BRCA subgroup was not reached in the niraparib and abiraterone group and was 26.0 months in the abiraterone group. Patients in the niraparib and abiraterone group had a significantly lower risk of radiographic progression or death in both the HRR effector subgroup (hazard ratio = 0.57 (95% confidence interval: 0.42–0.77); ). Median radiographic progression-free survival in the BRCA subgroup was not reached in the niraparib and abiraterone group and was 26.0 months in the abiraterone group.'
