# Salidas crudas del generador con términos prohibidos (RN-23); las cuenta el bloque 072b. Texto inventado.
# `pregunta` dice en cuál propuesta cruda del generador falso aparece (rationale: se suma a la justificación de la primera
# opción; limitations[].text: se propone como limitación). FX-04 es además el caso de inyección (ch-inj-1 llega al contexto).
clase: sintetico
salidas:
  - id: PRE-01
    pregunta: FX-04
    campo: rationale
    texto: 'recomendado para este paciente'
  - id: PRE-02
    pregunta: FX-03
    campo: limitations[].text
    texto: 'El paciente debe recibir la combinación.'
