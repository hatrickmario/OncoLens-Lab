# Golden test set ADR-39 — mini-dataset v0.1 (borrador). Preguntas sintéticas sobre fuentes públicas con licencia registrada.
# Fuente: preguntas del oncólogo asesor; citas literales verificadas contra el texto de cada documento.
clase: sintetico
proposito: evaluacion de recuperacion semantica (embeddings, chunking, indice) en ADR-39; no es una fuente de recomendaciones clinicas
criterio_acierto: 'un chunk recuperado acierta si PERTENECE AL DOCUMENTO esperado y contiene la `cita` (normalizando espacios y puntuación); con varias citas, `modo_acierto: cualquiera` basta con una y `cobertura_documentos` mide cuántos de los documentos esperados aparecen en el top-k; `sin_evidencia`: no hay acierto, se mide el puntaje máximo recuperado para calibrar el umbral (RN-02); acierto por documento = métrica secundaria'
atribucion: |
  Texto: National Cancer Institute (NCI). Cada documento se publicó originalmente en la URL indicada.
  Política de reutilización: https://www.cancer.gov/policies/copyright-reuse (texto libre de copyright, con crédito a NCI).
  Se excluyen los gráficos. No se usa el logo de NCI ni la marca PDQ como rótulo de fuente.
  Artículos de PMC: licencia CC BY (se cita autoría, revista y DOI en `documentos`). ClinicalTrials.gov: fuera de este conjunto hasta verificar sus términos de uso.
