preguntas:
- id: Q-M01
  id_original: B01
  cancer: mama
  idioma: es
  tipo: comparacion
  pregunta: ¿Qué diferencia hay entre la estadificación pronóstica clínica y la patológica en cáncer de mama?
  respuesta_esperada: La clínica se asigna antes de cirugía con historia, examen, imágenes y biopsia. La patológica se usa cuando la cirugía fue el primer tratamiento e incorpora la información clínica, biomarcadores y resultados del tejido mamario y ganglios extirpados.
  documentos:
  - M11
  evidencia:
  - documento: M11
    cita: Clinical prognostic stage is used first to assign a stage for anyone diagnosed with breast cancer.
    verificada: true
  - documento: M11
    cita: Pathological prognostic stage is used only for people who have surgery as their first treatment for breast cancer.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M02
  id_original: B02
  cancer: mama
  idioma: es
  tipo: lista
  pregunta: Además de TNM, ¿qué dos tipos de información intervienen en la estadificación del cáncer de mama?
  respuesta_esperada: El grado tumoral y el estado de biomarcadores; en algunos cánceres también pueden contribuir resultados de pruebas multigénicas.
  documentos:
  - M11
  evidencia:
  - documento: M11
    cita: 'This number is determined by a combination of three factors: TNM (tumor node metastasis) value, grade, and biomarker status'
    verificada: true
  - documento: M11
    cita: Results from multigene tests may be used to help stage some breast cancers.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M03
  id_original: B03
  cancer: mama
  idioma: es
  tipo: definicion
  pregunta: ¿Qué representa cada letra de TNM en mama?
  respuesta_esperada: T describe tamaño y localización del tumor primario; N, los ganglios regionales comprometidos y la extensión en ellos; M, la diseminación a otras partes del cuerpo.
  documentos:
  - M11
  evidencia:
  - documento: M11
    cita: 'Tumor (T): The size and location of the tumor.'
    verificada: true
  - documento: M11
    cita: 'Lymph node (N): The location of the lymph nodes where cancer has spread and the size of the cancer in the lymph nodes.'
    verificada: true
  - documento: M11
    cita: 'Metastasis (M): The spread of cancer to other parts of the body.'
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M04
  id_original: B04
  cancer: mama
  idioma: es
  tipo: hecho
  pregunta: ¿Cuál es la única forma segura de diagnosticar cáncer de mama según el documento?
  respuesta_esperada: La biopsia, porque permite que patología examine células o tejido al microscopio.
  documentos:
  - M12
  evidencia:
  - documento: M12
    cita: A biopsy is the only sure way to diagnose breast cancer.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M05
  id_original: B05
  cancer: mama
  idioma: es
  tipo: condicion
  pregunta: ¿En qué situación se usa con frecuencia una biopsia guiada por imagen de mama?
  respuesta_esperada: Cuando el área anormal está profunda o no se palpa; puede guiarse con ecografía, mamografía o resonancia magnética.
  documentos:
  - M12
  evidencia:
  - documento: M12
    cita: It is often used when the abnormal area is deep inside the breast or when the doctor cannot feel a lump or mass.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M06
  id_original: B06
  cancer: mama
  idioma: es
  tipo: lista
  pregunta: ¿Qué biomarcadores deben evaluarse en todos los cánceres de mama según la fuente?
  respuesta_esperada: Receptores hormonales —ER y PR— y HER2. La fuente los vincula con estadificación y planificación terapéutica.
  documentos:
  - M12
  evidencia:
  - documento: M12
    cita: All breast cancers are tested for the presence of certain biomarkers, such as hormone receptors (estrogen receptors and progesterone receptors) and HER2.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M07
  id_original: B07
  cancer: mama
  idioma: es
  tipo: comparacion
  pregunta: ¿Qué expresa un grado 1 frente a un grado 3 en cáncer de mama?
  respuesta_esperada: 'Grado 1: células y tejido más parecidos a lo normal y menos propensos a diseminarse. Grado 3: más anormales y con mayor probabilidad de crecer y diseminarse rápidamente.'
  documentos:
  - M12
  evidencia:
  - documento: M12
    cita: Grade 1 (well-differentiated) cancer cells look more like normal cells.
    verificada: true
  - documento: M12
    cita: The higher the grade number, the more the cancer cells look like abnormal cells and the more likely they will grow and spread
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M08
  id_original: B08
  cancer: mama
  idioma: es
  tipo: definicion
  pregunta: ¿Qué caracteriza al estadio 0 de mama?
  respuesta_esperada: 'Es una lesión no invasiva, como el carcinoma ductal in situ: hay células anormales en la mama sin evidencia de diseminación desde el sitio de origen. Puede tener cualquier grado o estado de HER2, ER y PR.'
  documentos:
  - M11
  evidencia:
  - documento: M11
    cita: Stage 0 is a noninvasive breast cancer, such as ductal carcinoma in situ (DCIS).
    verificada: true
  - documento: M11
    cita: In stage 0, abnormal cells are found in the breast, but there is no evidence that these cells have spread from where they first formed.
    verificada: true
  - documento: M11
    cita: Stage 0 breast cancers can be any grade and have any biomarker (HER2, ER, PR) status.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M09
  id_original: B09
  cancer: mama
  idioma: es
  tipo: comparacion
  pregunta: ¿Qué determina la diferencia entre los estadios IIA e IIB de cáncer de mama?
  respuesta_esperada: La combinación del tamaño tumoral y la afectación de ganglios linfáticos cercanos.
  documentos:
  - M11
  evidencia:
  - documento: M11
    cita: 'This stage is divided into groups: Stage IIA and Stage IIB. The difference is determined by the size of the tumor and whether the breast cancer has spread to the lymph nodes.'
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M10
  id_original: B10
  cancer: mama
  idioma: es
  tipo: secuencia
  pregunta: ¿Qué secuencia general describe la fuente para cáncer de mama localmente avanzado?
  respuesta_esperada: Con frecuencia empieza con quimioterapia, seguida de cirugía y radioterapia.
  documentos:
  - M14
  evidencia:
  - documento: M14
    cita: Treatment of locally advanced breast cancer, which includes some stage IIB breast cancers and stages IIIA, IIIB, and IIIC, often begins with chemotherapy, followed by surgery and radiation.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M11
  id_original: B11
  cancer: mama
  idioma: es
  tipo: condicion
  pregunta: ¿Qué puede ocurrir antes de cirugía si un tumor mamario es grande?
  respuesta_esperada: La fuente indica que puede administrarse quimioterapia o terapia dirigida antes de cirugía para reducir el tumor y facilitar su extirpación.
  documentos:
  - M14
  evidencia:
  - documento: M14
    cita: If the tumor is large, chemotherapy or targeted therapy may be given before surgery to make the tumor smaller and easier to remove.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M12
  id_original: B12
  cancer: mama
  idioma: es
  tipo: condicion
  pregunta: ¿Qué información de un tumor ayuda a decidir si puede beneficiar de terapia dirigida en mama?
  respuesta_esperada: Las pruebas de biomarcadores o características tumorales realizadas tras el diagnóstico.
  documentos:
  - M15
  evidencia:
  - documento: M15
    cita: These tests can help determine if you are likely to benefit from targeted cancer therapy.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M13
  id_original: B13
  cancer: mama
  idioma: es
  tipo: secuencia
  pregunta: ¿En qué momentos del recorrido terapéutico puede administrarse terapia dirigida para mama?
  respuesta_esperada: Puede iniciarse antes o después de la cirugía, y también puede administrarse cuando no se recomienda cirugía.
  documentos:
  - M15
  evidencia:
  - documento: M15
    cita: It might be started before or after surgery. It can also be given even if surgery is not recommended for you.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M14
  id_original: B14
  cancer: mama
  idioma: es
  tipo: causal
  pregunta: ¿Por qué las terapias dirigidas a HER2 no actúan contra un cáncer de mama HER2 negativo?
  respuesta_esperada: Porque esos tumores no tienen niveles altos de HER2; por ello las terapias que atacan HER2 no destruyen esas células.
  documentos:
  - M15
  evidencia:
  - documento: M15
    cita: Some breast cancers do not have higher-than-normal levels of HER2, so therapies that target HER2 do not work to kill these cancer cells.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-M15
  id_original: B15
  cancer: mama
  idioma: es
  tipo: definicion
  pregunta: ¿Cómo define la fuente el cáncer de mama triple negativo?
  respuesta_esperada: Es negativo para receptor de estrógeno, receptor de progesterona y HER2.
  documentos:
  - M15
  evidencia:
  - documento: M15
    cita: Triple-negative breast cancer is estrogen receptor (ER) negative, progesterone receptor (PR) negative, and HER2 negative.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-P01
  id_original: P01
  cancer: prostata
  idioma: es
  tipo: lista
  pregunta: ¿Qué condiciones no malignas pueden elevar el PSA en sangre?
  respuesta_esperada: La hiperplasia prostática benigna y la prostatitis; el PSA también es producido por células prostáticas normales.
  documentos:
  - P13
  evidencia:
  - documento: P13
    cita: Both prostate cancer and several benign conditions (particularly benign prostatic hyperplasia, or BPH, and prostatitis) can cause PSA levels in the blood to rise.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-P02
  id_original: P02
  cancer: prostata
  idioma: es
  tipo: hecho
  pregunta: ¿Existe un valor único de PSA que separe de forma definitiva un resultado normal de uno anormal?
  respuesta_esperada: No existe un umbral único que confirme cáncer de próstata. En general, un PSA mayor de 4,0 ng/mL se considera anormal y puede motivar biopsia, pero el punto de corte puede ajustarse por edad y uso de fármacos que reducen PSA.
  documentos:
  - P13
  evidencia:
  - documento: P13
    cita: There is no single threshold that distinguishes a normal versus an abnormal PSA result.
    verificada: true
  - documento: P13
    cita: In general, a PSA level above 4.0 ng/mL is considered abnormal and may result in a recommendation for prostate biopsy.
    verificada: true
  - documento: P13
    cita: However, because PSA levels increase with age, some doctors apply a higher cutoff (such as 5 ng/ml) for older men and a lower cutoff (such as 2.5 ng/mL) for younger men
    verificada: true
  - documento: P13
    cita: In addition, a lower cutoff for abnormal is used in men taking certain drugs, including finasteride and dutasteride, which are used to treat BPH.
    verificada: true
  revision_oncologo: aprobada_con_cambios
  modo_acierto: cualquiera
- id: Q-P03
  id_original: P03
  cancer: prostata
  idioma: es
  tipo: valor
  pregunta: Tras un PSA elevado en una persona asintomática, ¿qué intervalo menciona la fuente para repetir la prueba y confirmar el hallazgo?
  respuesta_esperada: Entre 6 y 8 semanas.
  documentos:
  - P13
  evidencia:
  - documento: P13
    cita: the doctor may recommend another PSA test in 6 to 8 weeks to confirm the original finding.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-P04
  id_original: P04
  cancer: prostata
  idioma: es
  tipo: lista
  pregunta: ¿Qué actividades o situaciones transitorias pueden elevar el PSA?
  respuesta_esperada: Infección o inflamación prostática, biopsia prostática reciente, ejercicio vigoroso como ciclismo y eyaculación.
  documentos:
  - P13
  evidencia:
  - documento: P13
    cita: An infection or inflammation of the prostate or having had a recent prostate biopsy can cause PSA levels to be raised for a month or two. Vigorous exercise (such as cycling) and ejaculation can also increase the PSA level transiently.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-P05
  id_original: P05
  cancer: prostata
  idioma: es
  tipo: causal
  pregunta: Después de tratamiento de próstata, ¿por qué un único PSA elevado no confirma por sí solo recurrencia?
  respuesta_esperada: Porque una medición aislada puede no representar recurrencia; la fuente describe valorar repetición de PSA y la tendencia ascendente en el tiempo, junto con otros hallazgos.
  documentos:
  - P13
  evidencia:
  - documento: P13
    cita: However, a single elevated PSA measurement in someone who has a history of prostate cancer does not always mean that the cancer has come back.
    verificada: true
  - documento: P13
    cita: A rising trend in PSA level over time in combination with other findings, such as an abnormal result on imaging tests, may lead the doctor to recommend further cancer treatment.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-P06
  id_original: P06
  cancer: prostata
  idioma: es
  tipo: procedimiento
  pregunta: ¿Cómo se construye el puntaje de Gleason en una biopsia de próstata?
  respuesta_esperada: 'Patología identifica los dos patrones celulares principales: el primario, más frecuente, y el secundario, siguiente en frecuencia. Cada uno se gradúa de 3 a 5 y ambos se suman.'
  documentos:
  - P11
  evidencia:
  - documento: P11
    cita: The primary pattern describes the most common tissue pattern, and the secondary pattern describes the next most common pattern. Each pattern is given a grade from 3 to 5, with grade 3 looking the most like normal prostate tissue and grade 5 looking the most abnormal. The two grades are then added to get a Gleason score.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-P07
  id_original: P07
  cancer: prostata
  idioma: es
  tipo: definicion
  pregunta: ¿Qué significa la notación Gleason 3+4=7?
  respuesta_esperada: El patrón más común es 3 y el siguiente es 4; al sumarlos se obtiene 7. La fuente lo clasifica como grado intermedio.
  documentos:
  - P11
  evidencia:
  - documento: P11
    cita: if the most common tissue pattern is grade 3 and the secondary pattern is grade 4, it means that most of the cancer is grade 3 and less of the cancer is grade 4. The grades are added for a Gleason score of 7, and it is a medium-grade cancer.
    verificada: true
  revision_oncologo: aprobada
  modo_acierto: cualquiera
- id: Q-P08
  id_original: P08
  cancer: prostata
  idioma: es
  tipo: lista
  pregunta: ¿Qué variables, además de la extensión anatómica, influyen en el pronóstico y las opciones de tratamiento del cáncer de próstata según la fuente?
  respuesta_esperada: PSA, puntaje de Gleason, Grade Group, proporción de próstata afectada, presencia de diseminación, edad, recurrencia, comorbilidades, efectos adversos esperados, tratamientos previos y preferencias del paciente.
  documentos:
  - P11
  evidencia:
  - documento: P11
    cita: The stage of the cancer (level of PSA, Gleason score, Grade Group, how much of the prostate is affected by the cancer, and whether the cancer has spread to other places in the body).
    verificada: true
  - documento: P11
    cita: The patient's age.
    verificada: true
  - documento: P11
    cita: Whether the cancer has just been diagnosed or has recurred (come back).
    verificada: true
  - documento: P11
    cita: Whether the patient has other health problems.
    verificada: true
  - documento: P11
    cita: The expected side effects of treatment.
    verificada: true
  - documento: P11
    cita: Past treatment for prostate cancer.
    verificada: true
  - documento: P11
    cita: The wishes of the patient.
    verificada: true
  revision_oncologo: aprobada
