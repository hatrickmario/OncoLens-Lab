# Pares NLI ADR-39 — v0.1 (revisados por el oncólogo asesor)
clase: sintetico
proposito: pares afirmación–fragmento para medir el NLI (US-012 AC-9; ADR-39). El fragmento es una cita literal del corpus; la afirmación es sintética. No es una fuente de recomendaciones clínicas.
etiquetas:
  entailment: el fragmento respalda la afirmación por sí solo
  neutral: el fragmento no la confirma ni la contradice
  contradiction: el fragmento afirma lo contrario o la excluye
criterio: la etiqueta se decide SOLO con el fragmento, no con el resto del documento ni con conocimiento externo
idiomas: fragmentos en inglés (el corpus está en inglés); afirmaciones en inglés (mismo idioma) y en español (mezcla es/en), con la variante en el otro idioma en cada par
atribucion: Fragmentos tomados de las fuentes indicadas en golden.yaml (NCI y artículos de PMC con licencia CC BY). ClinicalTrials.gov no está incluido.
