descripcion: 'Mini-dataset de la fase A de ADR-39 (US-012, L1D-102): preguntas de recuperación (golden) y pares NLI. Las preguntas y afirmaciones son sintéticas; los fragmentos son citas literales de fuentes públicas.'
archivos:
