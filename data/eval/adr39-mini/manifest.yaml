regla_de_acierto: 'un chunk recuperado acierta si PERTENECE AL DOCUMENTO esperado y contiene la `cita` (normalizando espacios y puntuación); con varias citas, `modo_acierto: cualquiera` basta con una y `cobertura_documentos` mide cuántos de los documentos esperados aparecen en el top-k; `sin_evidencia`: no hay acierto, se mide el puntaje máximo recuperado para calibrar el umbral (RN-02); acierto por documento = métrica secundaria'
