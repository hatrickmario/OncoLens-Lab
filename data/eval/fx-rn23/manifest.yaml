# FX-RN23 (ARR-03 / L1D-279 AC-3 y AC-4; versión 2 de US-249 AC-3 y AC-5): fixture sintético de la suite `evaluate` para los
# casos de RN-23 que el filtro de producción no cubría o que el corpus citado trae en sus propias palabras. Ningún dato real
# ni de paciente.
clase: sintetico
nombre: fx-rn23
version: '2'
descripcion: 'Corpus mínimo con una guía que «recomienda» (nivel B), un texto con «standard of care» y «recommended treatment» (nivel A), controles descriptivos y un resumen en español; 15 preguntas con propuestas guionadas que reproducen, parafrasean, hablan en voz propia, atribuyen o citan textualmente. Todo es inventado.'
archivos:
  corpus: corpus.yaml
  preguntas: preguntas.yaml
  propuestas: propuestas.yaml
  pii: pii.yaml
  prescriptivas: prescriptivas.yaml
  conformidad: conformidad.yaml
linea_base_de_lenguaje: linea-base/terminos-prohibidos-1.5.0.json
