# CI de OncoLens (US-036, docs/process/ci.md). Un único check requerido por la protección de main: `ci-ok`.
# Sin secretos del repositorio, sin pull_request_target, acciones fijadas por SHA. Los pasos llaman a scripts de
# scripts/ y npm (los mismos comandos que ejecutan los fixtures de ci/tests/), nunca a lógica en línea.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Base contra la que se comparan contratos y commits: la base del PR o, en push, el commit anterior.
  BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            apps/rag-orchestrator/requirements.txt
            apps/rag-orchestrator/requirements-dev.txt
            apps/rag-orchestrator/requirements-eval.txt
      - name: Instalar dependencias de Node
        run: npm ci
      - name: Herramientas de la CI (oasdiff, que usa el test de contracts-breaking.sh)
        run: scripts/ci/install-tools.sh
      - name: Build de los workspaces
        run: npm run build --workspaces --if-present
      - name: Test de build de web (US-060 AC-5)
        run: npm run test:build --workspace apps/web
      - name: Tests de los workspaces
        run: npm test --workspaces --if-present
      - name: Validación del catálogo clínico (catalog:validate, RN-29, US-001)
        run: npm run catalog:validate
      - name: Base del catálogo para el guardián de versión (solo el commit base, sin credenciales)
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"
      - name: Una versión publicada del catálogo no cambia de contenido (catalog:version-guard, L1D-126)
        run: npm run catalog:version-guard -- --base "$BASE_REF"
      - name: La allowlist del modelo commiteada coincide con el esquema de Prisma (US-001 AC-4)
        run: npm run catalog:allowlist:check
      - name: Dependencias de rag-orchestrator (dev, ruff para ci/tests/quality, y eval, que importan tests/evaluation y test_settings_modelos)
        run: pip install -r apps/rag-orchestrator/requirements.txt -r apps/rag-orchestrator/requirements-dev.txt -r apps/rag-orchestrator/requirements-eval.txt
      - name: Vitest raíz (scripts, infra y fixtures de la CI)
        run: npx vitest run
      - name: Pytest de rag-orchestrator (con Node, el helper empaqueta el spec con bundle-json.mjs)
        run: python -m pytest --cov=app --cov-report=xml:coverage/coverage.xml
        working-directory: apps/rag-orchestrator
      - name: Publicar la Cobertura XML de rag-orchestrator (insumo del job quality, US-213 AC-11)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-rag-orchestrator
          path: apps/rag-orchestrator/coverage/coverage.xml
          if-no-files-found: ignore
          retention-days: 1
      - name: Verificación del proveedor de rag-orchestrator, estricta (contracts:verify-provider, US-214)
        run: npm run contracts:verify-provider -- --proveedor rag-orchestrator
      - name: Tests de secretos (L1D-165)
        run: npm run test:secrets

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/contracts/requirements-codegen.txt
      - name: Instalar dependencias de Node
        run: npm ci
      - name: Herramientas de la CI (oasdiff, versión y suma de ci/tools.lock)
        run: scripts/ci/install-tools.sh
      - name: Entorno virtual del generador de Pydantic
        run: |
          python -m venv .venv-codegen
          .venv-codegen/bin/pip install -r scripts/contracts/requirements-codegen.txt
      - name: contracts:check
        run: npm run contracts:check
      - name: contracts:generate:check
        run: npm run contracts:generate:check
        env:
          CODEGEN_PYTHON: .venv-codegen/bin/python
      - name: Los tipos de web compilan con lo generado (consumidor de citedSources; caso ac2-cited-sources-build, ARR-09 AC-4)
        run: npm run contracts:generate && npm run typecheck -w apps/web
        env:
          CODEGEN_PYTHON: .venv-codegen/bin/python
      - name: Cambios incompatibles contra la base (oasdiff, nivel ERR)
        run: scripts/ci/contracts-breaking.sh "$BASE_REF"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Herramientas de la CI (gitleaks, versión y suma de ci/tools.lock)
        run: scripts/ci/install-tools.sh
      - name: gitleaks sobre el árbol y sobre los commits del PR
        run: scripts/ci/secret-scan.sh "$BASE_REF"

  data-scan:
    name: data-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias de Node
        run: npm ci
      - name: PII en los archivos versionados
        run: node scripts/ci/pii-scan.mjs
      - name: Clase de datos de los datasets de evaluación
        run: node scripts/ci/dataset-class-check.mjs

  stack-smoke:
    name: stack-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias de Node
        run: npm ci
      - name: Smoke del stack de Compose (secretos ficticios, sin LLM real)
        run: npm run smoke:compose
        env:
          LLM_PROVIDER: fake

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias de Node
        run: npm ci
      - name: Integración de clinical-api contra PostgreSQL real de test con verificación del proveedor (US-038, US-214)
        run: scripts/ci/integracion-clinical-api.sh

  integration-rag:
    name: integration-rag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias de Node
        run: npm ci
      - name: Integración de rag-orchestrator contra PostgreSQL y Milvus reales de test (L1D-277, pytest -m servicios_reales)
        run: scripts/ci/integracion-rag-orchestrator.sh

  quality:
    name: quality
    # La cobertura de rag-orchestrator la produce el Pytest completo de build-test (US-213 AC-11); sin ella no hay medición de Python.
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # origin/main completo: la cobertura de líneas cambiadas compara contra el ancestro común (US-213 AC-11).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/rag-orchestrator/requirements-dev.txt
      - name: Instalar dependencias de Node
        run: npm ci
      - name: Ruff (formato de Python)
        run: pip install -r apps/rag-orchestrator/requirements-dev.txt
      - name: Lint (ESLint, sin advertencias)
        run: npm run lint
      - name: Formato (Prettier y ruff format)
        run: npm run format:check
      - name: format no modifica lo generado ni los openapi.yaml
        run: node scripts/quality/format-no-toca-generados.mjs
      - name: Compilar clinical-language (lo importan los tests de web y clinical-api)
        run: npm run build -w @oncolens/clinical-language
      - name: Cobertura XML de rag-orchestrator (la publicó build-test)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura-rag-orchestrator
          path: apps/rag-orchestrator/coverage
      - name: Cobertura LCOV de clinical-api (insumo de la cobertura de líneas cambiadas)
        run: npm run test:coverage -w apps/clinical-api
      - name: Cobertura LCOV de web (insumo de la cobertura de líneas cambiadas)
        run: npm run test:coverage -w apps/web
      - name: Calidad de capas, umbrales, higiene de tests, AC y cobertura de líneas cambiadas (escribe reports/quality/latest.json)
        run: npm run quality:report
      - name: Subir el reporte de calidad
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: reports/quality/latest.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Tests de lint, formato, capas y umbrales (fixtures)
        run: npm run test:quality

  lint-lenguaje:
    name: lint-lenguaje
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias de Node
        run: npm ci
      - name: lint:lenguaje (mensajes de la UI sin términos prohibidos de RN-23)
        run: npm run lint:lenguaje
      - name: Fixtures de lint:lenguaje (US-068 AC-5)
        run: npm run test:lenguaje

  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/ci/requirements-audit.txt
      - name: pip-audit (versión fijada en scripts/ci/requirements-audit.txt)
        run: pip install -r scripts/ci/requirements-audit.txt
      - name: Auditoría de npm y pip con excepciones vigentes (US-217, security/audit-exceptions.json)
        run: scripts/ci/auditar-dependencias.sh

  # US-074 (L1D-237): siempre corre y decide en su script si el diff toca un disparador (scripts/ci/eval-trigger-paths.yaml);
  # así su check nunca queda «pendiente». Adapters falsos, sin red ni modelos pesados; compara con data/evaluation/baseline.json
  # y con los mínimos de apps/rag-orchestrator/eval/configs/regression.yaml.
  eval-required:
    name: eval-required
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Defensa en profundidad (RN-12): ninguna librería descarga modelos durante la suite.
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            apps/rag-orchestrator/requirements.txt
            apps/rag-orchestrator/requirements-eval.txt
      - name: Instalar dependencias de Node
        run: npm ci
      - name: Dependencias de la suite evaluate (rag-orchestrator y requirements-eval)
        run: pip install -r apps/rag-orchestrator/requirements.txt -r apps/rag-orchestrator/requirements-eval.txt
      - name: Suite evaluate si el PR cambia modelo, prompt, umbral, catálogo o corpus, y regresión contra el baseline y regression.yaml (US-074)
        run: node scripts/ci/eval-required.mjs --base "$BASE_REF"
      - name: Publicar el reporte de evaluate (agregados y configuración, sin datos)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-reporte
          path: apps/rag-orchestrator/eval/results/ci
          retention-days: 3
          include-hidden-files: false
          if-no-files-found: ignore

  ci-ok:
    name: ci-ok
    if: always()
    needs: [build-test, contracts, secret-scan, data-scan, stack-smoke, integration, integration-rag, quality, lint-lenguaje, dependencies, eval-required]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Todos los jobs en success (un job omitido o cancelado no cuenta como verde)
        run: node scripts/ci/verificar-needs.mjs
        env:
          NEEDS: ${{ toJSON(needs) }}
