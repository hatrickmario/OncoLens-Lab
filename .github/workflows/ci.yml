# CI de OncoLens (US-036, docs/process/ci.md). Un único check requerido por la protección de main: `ci-ok`.
# Sin secretos del repositorio, sin pull_request_target, acciones fijadas por SHA. Los pasos llaman a scripts de
# scripts/ y npm (los mismos comandos que ejecutan los fixtures de ci/tests/), nunca a lógica en línea.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Base contra la que se comparan contratos y commits: la base del PR o, en push, el commit anterior.
  BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  # ARR-11 (D-12.1): decide si el PR solo cambia documentación (scripts/ci/detectar-cambios.mjs, reglas en
  # scripts/ci/cambios-paths.yaml). `omitibles` es la ÚNICA fuente de los jobs que un PR de documentación no ejecuta: cada
  # uno la lee en su `if` y `ci-ok` solo acepta como omitido lo que figura en ella. Los escáneres (secret-scan, data-scan),
  # lint-lenguaje y higiene-proceso nunca son omitibles. Necesita node_modules: eval-trigger.mjs importa `yaml`.
  cambios:
    name: cambios
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      documentacion: ${{ steps.detectar.outputs.documentacion }}
      omitibles: ${{ steps.detectar.outputs.omitibles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historial completo: el diff se calcula contra `git merge-base` y sin él el detector pide la CI completa.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restaurar node_modules (clave exacta por .nvmrc y package-lock.json, sin claves parciales)
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Instalar dependencias de Node
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - name: Detector de cambios (PR de documentación → jobs omitibles)
        id: detectar
        run: node scripts/ci/detectar-cambios.mjs --base "$BASE_REF"

  build-test-node:
    name: build-test-node
    needs: cambios
    if: ${{ !contains(fromJSON(needs.cambios.outputs.omitibles || '[]'), 'build-test-node') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            apps/rag-orchestrator/requirements.txt
            apps/rag-orchestrator/requirements-dev.txt
            apps/rag-orchestrator/requirements-eval.txt
      - name: Restaurar node_modules (clave exacta por .nvmrc y package-lock.json, sin claves parciales)
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Instalar dependencias de Node
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - name: Restaurar el venv de Python (clave exacta por .python-version y los requirements que instala este job)
        id: cache-venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv-ci
          key: venv-${{ runner.os }}-${{ hashFiles('.python-version', 'apps/rag-orchestrator/requirements.txt', 'apps/rag-orchestrator/requirements-dev.txt', 'apps/rag-orchestrator/requirements-eval.txt') }}
      - name: Entorno virtual de rag-orchestrator (dev, ruff para ci/tests/quality, y eval, que importan tests/evaluation y test_settings_modelos; el Vitest raíz ejecuta evaluate)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/pip install -r apps/rag-orchestrator/requirements.txt -r apps/rag-orchestrator/requirements-dev.txt -r apps/rag-orchestrator/requirements-eval.txt
      - name: Activar el venv (python y pip del PATH son los de .venv-ci)
        run: echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Herramientas de la CI (oasdiff, que usa el test de contracts-breaking.sh)
        run: scripts/ci/install-tools.sh
      - name: Build de los workspaces
        run: npm run build --workspaces --if-present
      - name: Test de build de web (US-060 AC-5)
        run: npm run test:build --workspace apps/web
      - name: Tests de los workspaces
        run: npm test --workspaces --if-present
      - name: Validación del catálogo clínico (catalog:validate, RN-29, US-001)
        run: npm run catalog:validate
      - name: Base del catálogo para el guardián de versión (solo el commit base, sin credenciales)
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"
      - name: Una versión publicada del catálogo no cambia de contenido (catalog:version-guard, L1D-126)
        run: npm run catalog:version-guard -- --base "$BASE_REF"
      - name: La allowlist del modelo commiteada coincide con el esquema de Prisma (US-001 AC-4)
        run: npm run catalog:allowlist:check
      - name: Vitest raíz (scripts, infra y fixtures de la CI)
        run: npx vitest run
      - name: Tests de secretos (L1D-165)
        run: npm run test:secrets

  # Pytest y la verificación del proveedor de rag-orchestrator, en paralelo con build-test-node (ARR-11, D-12.2).
  # Publica la cobertura XML que consume cobertura-rag (US-213 AC-11).
  build-test-rag:
    name: build-test-rag
    needs: cambios
    if: ${{ !contains(fromJSON(needs.cambios.outputs.omitibles || '[]'), 'build-test-rag') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            apps/rag-orchestrator/requirements.txt
            apps/rag-orchestrator/requirements-dev.txt
            apps/rag-orchestrator/requirements-eval.txt
      - name: Restaurar node_modules (clave exacta por .nvmrc y package-lock.json, sin claves parciales)
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Instalar dependencias de Node
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - name: Restaurar el venv de Python (clave exacta por .python-version y los requirements que instala este job)
        id: cache-venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv-ci
          key: venv-${{ runner.os }}-${{ hashFiles('.python-version', 'apps/rag-orchestrator/requirements.txt', 'apps/rag-orchestrator/requirements-dev.txt', 'apps/rag-orchestrator/requirements-eval.txt') }}
      - name: Entorno virtual de rag-orchestrator (dev, ruff para ci/tests/quality, y eval, que importan tests/evaluation y test_settings_modelos)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/pip install -r apps/rag-orchestrator/requirements.txt -r apps/rag-orchestrator/requirements-dev.txt -r apps/rag-orchestrator/requirements-eval.txt
      - name: Activar el venv (python y pip del PATH son los de .venv-ci)
        run: echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Pytest de rag-orchestrator (con Node, el helper empaqueta el spec con bundle-json.mjs)
        run: python -m pytest --cov=app --cov-report=xml:coverage/coverage.xml
        working-directory: apps/rag-orchestrator
      - name: Publicar la Cobertura XML de rag-orchestrator (insumo del job cobertura-rag, US-213 AC-11)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-rag-orchestrator
          path: apps/rag-orchestrator/coverage/coverage.xml
          if-no-files-found: ignore
          retention-days: 1
      - name: Verificación del proveedor de rag-orchestrator, estricta (contracts:verify-provider, US-214)
        run: npm run contracts:verify-provider -- --proveedor rag-orchestrator

  contracts:
    name: contracts
    needs: cambios
    if: ${{ !contains(fromJSON(needs.cambios.outputs.omitibles || '[]'), 'contracts') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/contracts/requirements-codegen.txt
      - name: Restaurar node_modules (clave exacta por .nvmrc y package-lock.json, sin claves parciales)
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Instalar dependencias de Node
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - name: Herramientas de la CI (oasdiff, versión y suma de ci/tools.lock)
        run: scripts/ci/install-tools.sh
      - name: Entorno virtual del generador de Pydantic
        run: |
          python -m venv .venv-codegen
          .venv-codegen/bin/pip install -r scripts/contracts/requirements-codegen.txt
      - name: contracts:check
        run: npm run contracts:check
      - name: contracts:generate:check
        run: npm run contracts:generate:check
        env:
          CODEGEN_PYTHON: .venv-codegen/bin/python
      - name: Los tipos de web compilan con lo generado (consumidor de citedSources; caso ac2-cited-sources-build, ARR-09 AC-4)
        run: npm run contracts:generate && npm run typecheck -w apps/web
        env:
          CODEGEN_PYTHON: .venv-codegen/bin/python
      - name: Cambios incompatibles contra la base (oasdiff, nivel ERR)
        run: scripts/ci/contracts-breaking.sh "$BASE_REF"
      # D5-02 (ARR-11): el merge ref del PR queda fijo al disparar el evento; si main cambió después, esto revalida sus ejemplos
      # y specs contra la punta actual. Solo en pull_request, sin credenciales; vuelve a ejecutar `contracts` antes del merge si main avanzó.
      - name: Ejemplos y specs del PR contra la punta actual de main (contracts:check sobre main fusionado, D5-02)
        if: github.event_name == 'pull_request'
        run: scripts/ci/contracts-contra-main.sh "$BASE_REF"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Herramientas de la CI (gitleaks, versión y suma de ci/tools.lock)
        run: scripts/ci/install-tools.sh
      - name: gitleaks sobre el árbol y sobre los commits del PR
        run: scripts/ci/secret-scan.sh "$BASE_REF"

  data-scan:
    name: data-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restaurar node_modules (clave exacta por .nvmrc y package-lock.json, sin claves parciales)
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Instalar dependencias de Node
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - name: PII en los archivos versionados
        run: node scripts/ci/pii-scan.mjs
      - name: Clase de datos de los datasets de evaluación
        run: node scripts/ci/dataset-class-check.mjs

  stack-smoke:
    name: stack-smoke
    needs: cambios
    if: ${{ !contains(fromJSON(needs.cambios.outputs.omitibles || '[]'), 'stack-smoke') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restaurar node_modules (clave exacta por .nvmrc y package-lock.json, sin claves parciales)
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Instalar dependencias de Node
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - name: Smoke del stack de Compose (secretos ficticios, sin LLM real)
        run: npm run smoke:compose
        env:
          LLM_PROVIDER: fake

  integration:
    name: integration
    needs: cambios
    if: ${{ !contains(fromJSON(needs.cambios.outputs.omitibles || '[]'), 'integration') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restaurar node_modules (clave exacta por .nvmrc y package-lock.json, sin claves parciales)
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Instalar dependencias de Node
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - name: Integración de clinical-api contra PostgreSQL real de test con verificación del proveedor (US-038, US-214)
        run: scripts/ci/integracion-clinical-api.sh

  integration-rag:
    name: integration-rag
    needs: cambios
    if: ${{ !contains(fromJSON(needs.cambios.outputs.omitibles || '[]'), 'integration-rag') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restaurar node_modules (clave exacta por .nvmrc y package-lock.json, sin claves parciales)
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Instalar dependencias de Node
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - name: Integración de rag-orchestrator contra PostgreSQL y Milvus reales de test (L1D-277, pytest -m servicios_reales)
        run: scripts/ci/integracion-rag-orchestrator.sh

  # ARR-11 (D-12.3): corre en paralelo con los builds. La cobertura de líneas cambiadas de Python (US-213 AC-11) la mide el job
  # cobertura-rag con el informe de build-test-rag; aquí `COBERTURA_INFORMES_XML` vacío deja solo los LCOV de web y clinical-api.
  quality:
    name: quality
    needs: cambios
    if: ${{ !contains(fromJSON(needs.cambios.outputs.omitibles || '[]'), 'quality') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # origin/main completo: la cobertura de líneas cambiadas compara contra el ancestro común (US-213 AC-11).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/rag-orchestrator/requirements-dev.txt
      - name: Restaurar node_modules (clave exacta por .nvmrc y package-lock.json, sin claves parciales)
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Instalar dependencias de Node
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - name: Ruff (formato de Python)
        run: pip install -r apps/rag-orchestrator/requirements-dev.txt
      - name: Lint (ESLint, sin advertencias)
        run: npm run lint
      - name: Formato (Prettier y ruff format)
        run: npm run format:check
      - name: format no modifica lo generado ni los openapi.yaml
        run: node scripts/quality/format-no-toca-generados.mjs
      - name: Compilar clinical-language (lo importan los tests de web y clinical-api)
        run: npm run build -w @oncolens/clinical-language
      - name: Cobertura LCOV de clinical-api (insumo de la cobertura de líneas cambiadas)
        run: npm run test:coverage -w apps/clinical-api
      - name: Cobertura LCOV de web (insumo de la cobertura de líneas cambiadas)
        run: npm run test:coverage -w apps/web
      - name: Calidad de capas, umbrales, higiene de tests, AC y cobertura de líneas cambiadas de web y clinical-api (escribe reports/quality/latest.json)
        run: npm run quality:report
        env:
          COBERTURA_INFORMES_XML: ''
      - name: Subir el reporte de calidad
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: reports/quality/latest.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Tests de lint, formato, capas y umbrales (fixtures)
        run: npm run test:quality

  # ARR-11 (D-12.3, US-213 AC-11): cobertura de líneas cambiadas de rag-orchestrator con el informe XML de build-test-rag y la
  # misma función que `quality` (scripts/quality/cobertura.mjs). Una cobertura baja es alerta, nunca error; un informe ausente
  # es un paso roto. Sin dependencias de Node: el script solo usa módulos del propio repositorio.
  cobertura-rag:
    name: cobertura-rag
    needs: [cambios, build-test-rag]
    if: ${{ !contains(fromJSON(needs.cambios.outputs.omitibles || '[]'), 'cobertura-rag') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # origin/main completo: la cobertura de líneas cambiadas compara contra el ancestro común.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Cobertura XML de rag-orchestrator (la publicó build-test-rag)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura-rag-orchestrator
          path: apps/rag-orchestrator/coverage
      - name: Cobertura de líneas cambiadas de rag-orchestrator (escribe reports/quality/cobertura-rag.json)
        run: node scripts/quality/cobertura.mjs --solo-xml --salida reports/quality/cobertura-rag.json
      - name: Subir el reporte de cobertura de rag-orchestrator
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report-rag
          path: reports/quality/cobertura-rag.json
          if-no-files-found: ignore
          retention-days: 14

  lint-lenguaje:
    name: lint-lenguaje
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restaurar node_modules (clave exacta por .nvmrc y package-lock.json, sin claves parciales)
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Instalar dependencias de Node
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - name: lint:lenguaje (mensajes de la UI sin términos prohibidos de RN-23)
        run: npm run lint:lenguaje
      - name: Fixtures de lint:lenguaje (US-068 AC-5)
        run: npm run test:lenguaje

  dependencies:
    name: dependencies
    needs: cambios
    if: ${{ !contains(fromJSON(needs.cambios.outputs.omitibles || '[]'), 'dependencies') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/ci/requirements-audit.txt
      - name: pip-audit (versión fijada en scripts/ci/requirements-audit.txt)
        run: pip install -r scripts/ci/requirements-audit.txt
      - name: Auditoría de npm y pip con excepciones vigentes (US-217, security/audit-exceptions.json)
        run: scripts/ci/auditar-dependencias.sh

  # US-074 (L1D-237): corre en todo PR y decide en su script si el diff toca un disparador (scripts/ci/eval-trigger-paths.yaml);
  # así su check nunca queda «pendiente». Solo lo omite el detector `cambios` en un PR de documentación pura, y nunca si un
  # disparador casa con un .md (ARR-11, D-12.1). Adapters falsos, sin red ni modelos pesados; compara con data/evaluation/baseline.json
  # y con los mínimos de apps/rag-orchestrator/eval/configs/regression.yaml.
  eval-required:
    name: eval-required
    needs: cambios
    if: ${{ !contains(fromJSON(needs.cambios.outputs.omitibles || '[]'), 'eval-required') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Defensa en profundidad (RN-12): ninguna librería descarga modelos durante la suite.
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            apps/rag-orchestrator/requirements.txt
            apps/rag-orchestrator/requirements-eval.txt
      - name: Restaurar node_modules (clave exacta por .nvmrc y package-lock.json, sin claves parciales)
        id: cache-node
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Instalar dependencias de Node
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci
      - name: Restaurar el venv de la suite evaluate (clave propia, solo requirements.txt y requirements-eval.txt)
        id: cache-venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv-ci
          key: venv-eval-${{ runner.os }}-${{ hashFiles('.python-version', 'apps/rag-orchestrator/requirements.txt', 'apps/rag-orchestrator/requirements-eval.txt') }}
      - name: Dependencias de la suite evaluate (rag-orchestrator y requirements-eval; sin torch ni transformers, D-11)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/pip install -r apps/rag-orchestrator/requirements.txt -r apps/rag-orchestrator/requirements-eval.txt
      - name: Activar el venv (python y pip del PATH son los de .venv-ci)
        run: echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Suite evaluate si el PR cambia modelo, prompt, umbral, catálogo o corpus, y regresión contra el baseline y regression.yaml (US-074)
        run: node scripts/ci/eval-required.mjs --base "$BASE_REF"
      - name: Publicar el reporte de evaluate (agregados y configuración, sin datos)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-reporte
          path: apps/rag-orchestrator/eval/results/ci
          retention-days: 3
          include-hidden-files: false
          if-no-files-found: ignore

  # Retro S4 (M4b, M5): higiene del proceso en los PR de historia. Siempre corre y decide en sus scripts si aplica (título
  # `[L1D-nn]`, evento pull_request), así su check nunca queda «omitido» en ci-ok. El título del PR entra por una variable
  # de entorno, nunca interpolado en el script.
  higiene-proceso:
    name: higiene-proceso
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Tareas abiertas de tasks.md con destino nombrado (rules.tasks de openspec/config.yaml)
        run: node scripts/ci/tasks-destino.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - name: Trailers Test-Removal visibles y orden contract → test → feat de los commits del PR
        run: node scripts/ci/verificar-commits-tdd.mjs --base "$BASE_REF"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [cambios, build-test-node, build-test-rag, contracts, secret-scan, data-scan, stack-smoke, integration, integration-rag, quality, cobertura-rag, lint-lenguaje, dependencies, eval-required, higiene-proceso]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Todos los jobs en success (un job omitido solo cuenta si el detector `cambios` lo declaró; uno cancelado, nunca)
        run: node scripts/ci/verificar-needs.mjs
        env:
          NEEDS: ${{ toJSON(needs) }}
