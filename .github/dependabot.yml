# Dependabot (US-217 AC-4, design.md D3): actualizaciones de seguridad y de versión, semanales y agrupadas por
# ecosistema. Sus PRs pasan por la misma CI (ci-ok); el merge sigue siendo humano (sin automerge).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /apps/rag-orchestrator
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ['*']
    ignore:
      # ADR-40: la versión de spaCy es parte de la medición del detector de PII (un test exige el pin); se cambia con una
      # nueva medición, no con una subida automática.
      - dependency-name: "spacy"

  # Herramientas de la CI (pip-audit) y generador de Pydantic: requirements propios fuera de rag-orchestrator.
  - package-ecosystem: pip
    directory: /scripts/ci
    schedule:
      interval: weekly
    groups:
      pip-ci:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /scripts/contracts
    schedule:
      interval: weekly
    groups:
      pip-contracts:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # Los Dockerfiles viven en apps/*; Compose en infra/docker (design.md D3, desviación del texto del AC-4).
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /apps/clinical-api
      - /apps/rag-orchestrator
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ['*']
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # etcd va fijado por el test de infra (v3.5.34): se ignora toda actualización, incluidos los patch (PR #229).
      - dependency-name: "gcr.io/etcd-development/etcd"
      # Dependabot nombra la imagen sin el registro (PR #206): sin esta entrada el ignore anterior no casa.
      - dependency-name: "etcd-development/etcd"
      - dependency-name: "milvusdb/milvus"
        update-types: ["version-update:semver-major"]
